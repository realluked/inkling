ubmit:"ink_submit",build:"e183f54cfa53"});
!function(){const e=(...e)=>e.join("\n"),t={A:{title:"Text A \xb7 The Last Ferry",paras:["Every evening at six, the old ferry Marisol left the harbour for the island, and every evening Amara's grandfather stood at the wheel. He had made the crossing for forty-one years. He knew which waves would lift the bow and which would slap the side, and he could tell from the colour of the sky whether his passengers would arrive dry.","Tonight was different. The council had announced that a new bridge would open in the spring, and the ferry would be sold for scrap. Most of the regular passengers seemed relieved: the bridge would cut their journey from forty minutes to six. Amara watched them hurry aboard, already talking about the time they would save.","Her grandfather said nothing. He checked the ropes twice, although he had never once found them loose, and he ran his thumb along the brass bell as if he were memorising its shape. When a small boy asked if he was sad, he laughed a little too loudly and said that bridges could not see dolphins.","Halfway across, he slowed the engine without explaining why. The passengers looked up from their phones. In the silver water beside them, three dolphins rose, breathed and vanished."]},B:{title:"Text B \xb7 Gardens in the Sky",paras:["Look down on almost any large city from the air and you will see acres of flat grey roofs. Increasingly, though, some of those roofs are turning green. In cities from Singapore to Rotterdam, planners and residents are planting gardens on top of buildings, and the reasons go well beyond appearances.","The most obvious benefit is cooling. Dark roofs soak up the sun and release heat long after dark, which helps make city centres several degrees warmer than the countryside around them. A layer of soil and plants absorbs far less heat, so the floors below stay cooler and residents rely less on air conditioning. Plants also trap rain. During heavy storms, a green roof holds water and releases it slowly, easing the pressure on drains that might otherwise flood the streets.","There are benefits for wildlife too. Bees, butterflies and birds that have been pushed out of cities by concrete find food and shelter on rooftops, sometimes several storeys above the traffic. Some gardens grow vegetables, giving people in crowded neighbourhoods fresh food that has not travelled hundreds of kilometres.","Not everything about them is simple. A soaked garden is heavy, and older buildings may need expensive strengthening before one can be added. Maintenance costs money, and a neglected roof can quickly become an eyesore.",'Yet the people who use them are often the most enthusiastic. "I came up here to water the tomatoes and ended up talking to neighbours I\'d ignored for ten years," says one Rotterdam resident. Researchers report the same pattern: green roofs give people a calm place to rest, and spending time among plants is linked to lower stress.']},C:{title:"Text C \xb7 The Storm",paras:["By noon the sky over the bay had curdled into a bruised purple, and the wind began to prowl along the shoreline, rattling shutters and worrying at the loose corners of tarpaulins. Gulls hung motionless above the harbour wall, pinned in place like paper cut-outs, before the gusts tore them sideways and flung them inland. On the beach, the fishermen worked in silence, dragging their boats higher up the shingle, their faces set like stone.","Then the rain arrived, not falling but hurled, a grey wall that marched across the water and swallowed the lighthouse whole. The sea, which an hour earlier had lapped politely at the jetty, now reared and snarled, flinging white spray over the harbour wall as if it wanted to drag the whole town into its throat. Somewhere a window shattered. In the caf\xe9, the lights flickered, steadied, then died, and for a moment the only sound was the storm's endless, furious roar."]},D1:{title:"Text 1 \xb7 Ban phones. Completely.",paras:["Walk into any classroom and watch what happens when a phone buzzes. Thirty heads turn. The lesson stops, even if only for a second, and the thread of a difficult idea snaps. At my children's school, a student survey found that seven in ten pupils check their phones during lessons. Seven in ten!","Phones do not only steal attention. They carry the playground into every corner of a child's life: the group chat that leaves you out, the photo you never agreed to, the comment that arrives at midnight. Banning phones during the school day gives young people seven hours of relief.","Some say students need phones for emergencies. Schools have telephones, and parents managed perfectly well before smartphones existed. Others say phones are useful for learning. Perhaps, but a textbook has never sent anyone a notification. If we want children who can concentrate, talk face to face and think for themselves, the answer is simple: lock the phones away."]},D2:{title:"Text 2 \xb7 Phones are tools, not toys",paras:["Every few years someone calls for a total phone ban, and every few years the same thing happens: phones disappear into pockets and bags, and students simply get better at hiding them. Bans do not teach anyone how to use technology well. They just move the problem out of sight.","Used properly, a phone is a remarkable learning tool. My students record experiments, translate texts, check facts and photograph the board instead of copying it out. When a family emergency happens, a quick message can save hours of worry.","Of course phones can distract, and online bullying is a real problem. But young people will spend the rest of their lives surrounded by screens. School is exactly the place to learn how to switch off notifications, manage time and treat each other kindly online. Teach responsible use; don't pretend the technology does not exist."]}},a=(e,a)=>t[e].paras[a],s=["Simile","Metaphor","Personification","Alliteration","Onomatopoeia","Hyperbole","Rhetorical question","Rule of three","Pathetic fallacy","Oxymoron","Juxtaposition","Sibilance","Imperative","Direct address","Repetition","Emotive language"],n=["Q1(a)\u2013(e): short answers on Text A, about 15 minutes","Q1(f): summary of Text B, about 25 minutes","Q2(a)\u2013(c): vocabulary and one language example from Text C, about 15 minutes","Q2(d): language analysis of two paragraphs, about 25 minutes","Q3: extended response to Text C, about 35 minutes","Checking: about 5 minutes"],o=["Read the question and underline the exact focus","Read Text B and highlight only the points that answer the focus","Cross out examples, repeats, quotations and anything off-focus","Group similar points together","Write in your own words, in continuous sentences, no more than 120 words","Check the word count and that you have not copied phrases"],i=["Choose a short, precise quotation, usually 1 to 5 words","Explain what it means literally, in the context","Explore its connotations: what ideas does the key word bring?","Explain the effect: what picture or feeling it creates for the reader","Link back to the overall impression of the paragraph"],r=["Exposition: introduce the character, setting and normal situation","Rising action: a problem or tension appears","Climax: the moment of greatest tension or change","Falling action: the consequences start to unfold","Resolution: how things end up, ideally with a final image or twist"],l={R1:{name:"Finding information",ex:[{type:"teach",title:"Explicit information",text:"Some questions ask you to find information that is stated directly in the text. This is explicit meaning: it is there on the page, you just have to locate it precisely.",passage:"A",bullets:["Read only the lines or paragraph the question points you to.","Find the exact detail, then answer in a short, clear sentence.",'"In your own words" means explain it using different key words, not just reordering the writer\u2019s.'],tip:"Underline the key word in the question (why, how, what, which two). It tells you exactly what kind of answer is needed."},{type:"type",q:"How many years has Amara's grandfather made the crossing? (number)",ref:"A",a:["41","forty one","forty-one"],why:'Paragraph 1: "forty-one years".'},{type:"mc",q:"Why do most of the regular passengers feel relieved?",ref:"A",options:["The bridge will make their journey much shorter","The ferry has become dangerous","The ferry tickets were too expensive","They did not like the grandfather"],a:0,why:"Forty minutes by ferry, six by bridge."},{type:"type",q:"How many minutes will the journey take using the bridge? (number)",ref:"A",a:["6","six"],why:'Paragraph 2: "from forty minutes to six".'},{type:"spot",q:"Tap a word in the phrase that shows the grandfather is trying to remember the ferry.",text:a("A",2),target:["as if he were memorising its shape"],why:"He is fixing the bell in his memory because he will lose it."},{type:"mc",q:'Which answer explains "hurry aboard" in your own words?',options:["They rush to get on the boat","They hurry aboard the ferry","They are aboard in a hurry","They walk calmly onto the deck"],a:0,why:"Own words means changing the key words, not just reordering them."},{type:"multi",q:"Which TWO things does the grandfather know from experience? Select two.",ref:"A",options:["Which waves will lift the bow","Whether passengers will arrive dry, from the sky","When the bridge will open","How much the ferry will sell for"],correct:[0,1],why:"Both are in paragraph 1."}]},R2:{name:"Inference",ex:[{type:"teach",title:"Reading between the lines",text:"Inference means working out what the writer suggests but does not say. You use clues to reach a conclusion about feelings, attitudes or relationships.",table:[["Clue","What it can reveal"],["Actions","What a character does, especially if it is odd or repeated"],["Speech","What they say, and what they avoid saying"],["Word choice","The connotations of how they are described"],["Contrast","How they differ from the people around them"]],tip:'Explain the feeling or attitude, not just the event. "He checks the ropes twice" is retelling. "He clings to his routine because he is losing something he loves" is inference.'},{type:"mc",q:'He laughed "a little too loudly". What does this suggest?',ref:"A",quote:"he laughed a little too loudly",options:["He is hiding how upset he really feels","He finds the boy's question very funny","He is hard of hearing","He is angry with the boy"],a:0,why:"Forced laughter covers sadness."},{type:"mc",q:"He checks the ropes twice, although they are never loose. What does this suggest?",ref:"A",options:["He wants to hold on to his routine while he still can","He thinks the ropes are dangerous","He is new to the job","He wants to slow the passengers down"],a:0,why:"The care shows how much the ferry means to him."},{type:"mc",q:'What does "bridges could not see dolphins" suggest he values about the ferry?',ref:"A",options:["The slow crossing lets people notice the natural world","Dolphins are dangerous to bridges","The ferry is faster than a bridge","He wants to become a marine biologist"],a:0,why:"The ferry offers something a quick bridge cannot."},{type:"spot",q:"Tap a word that shows the passengers had not been paying attention to the crossing.",text:a("A",3),target:["looked up from their phones"],why:"They only look up when he slows down."},{type:"mc",q:"Which answer is an inference rather than a retelling?",options:["His silence suggests he is grieving the loss of something he loves","He said nothing and checked the ropes","He drove the ferry across the water","The ferry left at six"],a:0,why:"An inference explains what the evidence reveals about feelings or attitudes."}]},R3:{name:"Words in context",ex:[{type:"teach",title:"Working out meaning from context",text:"You will meet words you don\u2019t know. The sentence around a word usually tells you what it means.",passage:"C",list:["Read the whole sentence, not just the word.","Ask what the thing is doing and how: is it gentle or violent, positive or negative?","Try your explanation in place of the word. If the sentence still makes sense, you have it."],tip:"When asked to find a word or phrase with a given meaning, copy only that word or short phrase. When asked to explain, use your own words."},{type:"spot",q:'Tap a word that means "moved around like a hunter looking for prey".',text:a("C",0),target:["prowl"],why:'"Prowl" suggests a predator.'},{type:"spot",q:'Tap a word that means "the pebbles on the beach".',text:a("C",0),target:["shingle"],why:"Shingle is a beach of small stones."},{type:"spot",q:'Tap a word that means "thrown with great force".',text:a("C",1),target:["hurled"],why:'The rain is "not falling but hurled".'},{type:"mc",q:'Explain "lapped politely" in your own words.',options:["Moved gently and calmly against the jetty","Licked the jetty with its tongue","Moved in a well-mannered and formal way","Crashed loudly into the jetty"],a:0,why:"Explain the meaning in context: the sea was calm and gentle."},{type:"mc",q:'What does "worrying at" mean in "worrying at the loose corners of tarpaulins"?',options:["Tugging repeatedly, like a dog with a toy","Feeling anxious about","Ignoring completely","Carefully fixing"],a:0,why:'Here "worry" means to pull at something again and again.'}]},L1:{name:"What analysis means",ex:[{type:"teach",title:"What language analysis is",text:"Language analysis means explaining how a writer\u2019s choice of words creates meaning, and what those words make the reader think, feel or picture. You are explaining why the writer chose these words and not others.",table:[["Ask","Which gives you"],["What does it say?","The literal meaning"],["How does it say it?","The exact word or technique"],["Why that word?","Its connotations and the effect on the reader"]]},{type:"teach",title:"Feature spotting vs analysis",text:"Naming a technique is not analysis. The marks come from explaining what the words do.",table:[["Feature spotting (weak)","Analysis (strong)"],["The writer uses a simile.",'Comparing the gulls to "paper cut-outs" makes them seem flat and weightless, totally at the mercy of the wind.'],["This is personification.",'"Prowl" turns the wind into a predator hunting along the shore, so it feels alive and threatening.']],tip:"You can get full marks without naming a single technique, but never without explaining the effect."},{type:"teach",title:'What "effect" actually means',text:"The effect is the specific impression the words create. It answers questions like:",bullets:["What picture does it create in the reader\u2019s mind?","What feeling or mood does it create?","What does it suggest about a character, place or situation?","How does it make the reader react: worried, sympathetic, uneasy, amused?"],model:'Weak: "This makes the reader want to read on."\nStrong: "This makes the sea seem hostile and alive, as if it wants to destroy the town."'},{type:"mc",q:"Which of these is analysis rather than feature spotting?",options:['"Snarled" makes the sea sound like a vicious animal, so it seems aggressive and dangerous.',"The writer uses personification in this sentence.","There is a metaphor in paragraph two.","The writer uses lots of techniques."],a:0,why:"It explains what the word suggests and the effect."},{type:"multi",q:"Which comments are too vague to earn credit? Select all that apply.",options:["It makes the reader want to read on","It creates a picture in the reader's mind","It is very descriptive",'"Swallowed" makes the storm seem like a monster devouring the town'],correct:[0,1,2],why:"These could be said about almost any sentence. Always say WHAT picture or feeling, and why."},{type:"mc",q:"What does a good explanation of effect do?",options:["Says exactly what impression the words create and why","Names as many techniques as possible","Retells what happens in the paragraph","Copies long quotations"],a:0},{type:"order",q:"Put the steps of analysing a phrase in order.",items:["Pick a short, precise quotation","Explain what it means literally","Explore the connotations of the key word","Explain the effect on the reader"],why:"Quote, meaning, connotations, effect."}]},L2:{name:"Words & connotations",ex:[{type:"teach",title:"Denotation and connotation",text:"A word\u2019s denotation is its dictionary meaning. Its connotations are the ideas and feelings it carries with it. Writers choose words for their connotations.",table:[["Word","Connotations"],["house","just a building"],["home","warmth, safety, family, belonging"],["slender","graceful, attractive"],["scrawny","weak, underfed, unattractive"],["walked","neutral"],["prowled","hunting, danger, a predator"]],tip:"Zoom in on one word in your quotation and explore what it suggests. This is where the best answers go deep."},{type:"teach",title:"Which words to zoom in on",text:"Different word classes do different jobs.",table:[["Word class","What it does","Example from Text C"],["Verb","Shows action and force: often the most powerful word","hurled, marched, snarled"],["Adjective","Describes a noun\u2019s qualities","bruised, endless, furious"],["Adverb","Describes how something is done","politely"],["Noun","Names a thing, often loaded with associations","wall, throat"]]},{type:"mc",q:'Compare "The man waited by the gate" with "The man lurked by the gate". What does "lurked" add?',options:["A sense that he is hiding with bad intentions","A sense that he is patient and kind","That he is waiting for a friend","Nothing: they mean the same"],a:0,why:'"Lurk" connotes hiding, secrecy and threat.'},{type:"match",q:"Match each word to its connotations.",pairs:[["lair","hidden danger, a predator"],["fortress","strength and protection"],["cage","being trapped, no freedom"],["nest","warmth, safety, family"]]},{type:"spot",q:"Tap the adjective that makes the sky seem injured.",text:a("C",0),target:["bruised"],why:'"Bruised" connotes injury and pain, so the sky looks sick and hurt.'},{type:"mc",q:'What word class is "hurled" in "not falling but hurled"?',options:["Verb","Adjective","Noun","Adverb"],a:0},{type:"teach",title:"Semantic fields",text:"A semantic field is a group of words from the same topic. When a writer uses several, they build one strong impression across a passage.",bullets:["In Text C: prowl, reared, snarled, throat, swallowed. These all belong to a semantic field of wild animals and predators.","The effect: the storm feels like a living beast hunting the town."]},{type:"multi",q:"Which words from Text C belong to the semantic field of predators?",ref:"C",options:["prowl","snarled","throat","shutters","lighthouse","caf\xe9"],correct:[0,1,2]},{type:"mc",q:"Why is spotting a semantic field useful in analysis?",options:["It lets you show how many words work together to build one impression","It proves the writer used lots of long words","It tells you how many marks to expect","It shows the text is a story"],a:0}]},L3:{name:"Imagery",ex:[{type:"teach",title:"Types of imagery",text:"Imagery is language that creates a picture in the reader\u2019s mind, often by comparing one thing to another.",table:[["Technique","What it is","Example"],["Simile","A comparison using like or as","faces set like stone"],["Metaphor","Says one thing IS another","a grey wall that marched"],["Extended metaphor","A metaphor developed over several lines","the storm as a beast that prowls, snarls and swallows"],["Personification","Gives human or animal qualities to something non-living","the wind began to prowl"],["Pathetic fallacy","Weather or setting reflects a mood","a bruised purple sky before disaster"],["Symbolism","An object stands for a bigger idea","a single candle left burning, standing for hope"]]},{type:"teach",title:"How to explain an image",text:"Three steps for any comparison:",list:["What is being compared to what?","Which qualities carry across from one to the other?","What does that suggest, and how does it make the reader feel?"],model:'"a grey wall that marched across the water"\nCompared: the rain to a wall, and to soldiers.\nQualities: solid, impossible to see through; organised, unstoppable.\nEffect: the rain feels like an invading army advancing on the town, overwhelming and threatening.'},{type:"match",q:"Match each example to its technique.",pairs:[["pinned in place like paper cut-outs","Simile"],["the sky had curdled into a bruised purple","Metaphor"],["the wind began to prowl","Personification"],["As the funeral began, grey clouds wept over the town","Pathetic fallacy"]]},{type:"mc",q:'Which is the best explanation of "their faces set like stone"?',options:["Stone is hard and unmoving, so the fishermen seem grimly determined, showing no fear as they work.","The writer uses a simile to describe their faces.","Their faces were grey.","It means they were made of stone."],a:0,why:"It names the shared quality (hard, fixed) and what it suggests."},{type:"mc",q:'"Her words were a knife." What technique is this, and what does it suggest?',options:["Metaphor: her words were sharp and hurtful","Simile: her words were long","Personification: the knife could speak","Onomatopoeia: the sound of a knife"],a:0},{type:"mc",q:'"A single candle burned in the window long after the others had gone dark." What might the candle symbolise?',options:["Hope that someone will return","The price of electricity","That the house is on fire","That it is daytime"],a:0},{type:"mc",q:"What makes an extended metaphor different from a metaphor?",options:["It is developed across several lines or a whole passage",'It always uses "like" or "as"',"It is only used in poetry","It is shorter"],a:0}]},L4:{name:"Sound & rhythm",ex:[{type:"teach",title:"How words sound",text:"Writers use sound to match what they describe. Always say what the sound does, not just that it is there.",table:[["Technique","What it is","Typical effect"],["Alliteration","Repeated consonant sounds at the start of nearby words","Draws attention; can be harsh or soft depending on the letter"],["Plosives","Hard b, p, t, d, k sounds","Harsh, violent, aggressive, abrupt"],["Sibilance","Repeated s and sh sounds","Hushed, soothing, or sinister, like a hiss"],["Assonance","Repeated vowel sounds","Slows the reading; can sound mournful or dreamy"],["Onomatopoeia","A word that sounds like what it describes","Makes the scene vivid and immediate"],["Rhythm and lists","The beat of a sentence","Fast and urgent, or slow and steady"]]},{type:"mc",q:'"The bitter wind bit and battered the boats." What effect do the plosive b sounds create?',options:["A harsh, violent sound, like the wind striking the boats","A soft, gentle mood","A happy, playful rhythm","A slow, sleepy feeling"],a:0},{type:"mc",q:'"The sea sighed and shifted, slipping softly over the sand." What is the effect of the sibilance?',options:["A soft, hushed sound that makes the sea seem calm and soothing","A loud, harsh sound","It shows the sea is dangerous","It speeds the sentence up"],a:0},{type:"spot",q:"Tap the word in this paragraph that sounds like the noise it describes.",text:a("C",0),target:["rattling"],why:'"Rattling" is onomatopoeic: you can hear the shutters shaking.'},{type:"mc",q:'"The lights flickered, steadied, then died." What does the rhythm of this list do?',options:['Three short verbs mimic the lights failing in stages, ending abruptly on "died"',"It makes the caf\xe9 seem cheerful","It slows everything to a calm pace","It has no effect"],a:0},{type:"mc",q:'Why is "the alliteration makes it flow" a weak comment?',options:["It doesn't say what the sound suggests or how it links to the meaning","Alliteration never flows","It is too long","It uses the wrong technique name"],a:0}]},L5:{name:"Types of effect",ex:[{type:"teach",title:"The effects you can write about",text:"The effect is what the language DOES. These are the effects that come up again and again. Learn them, and the words to go with them.",table:[["Effect","What it means","Example"],["Builds tension or suspense","The reader feels anxious about what will happen","Somewhere a window shattered."],["Creates atmosphere or mood","The overall feeling of a place or moment: eerie, oppressive, peaceful, chaotic","the only sound was the storm\u2019s endless, furious roar"],["Reveals character","Shows thoughts, feelings or personality","he checked the ropes twice"],["Emphasises an idea","Makes something stand out as important","Seven in ten!"],["Creates vivid imagery","Helps the reader see, hear or feel it","the sharp tang of ginger"],["Controls pace","Speeds the reader up or slows them down","Short sentences speed up; long, detailed ones slow down"],["Creates contrast","Highlights a difference","lapped politely \u2026 reared and snarled"],["Foreshadows","Hints at what is coming","a sky curdled into a bruised purple"],["Creates sympathy","Makes the reader feel for a character","he laughed a little too loudly"],["Conveys threat or power","Makes something seem dangerous or overwhelming","swallowed the lighthouse whole"]]},{type:"teach",title:"Phrases for writing about effect",text:"Use these to start your explanation, then be specific:",bullets:["This creates a sense of\u2026","This conveys how\u2026","This suggests that\u2026","The reader is made to feel\u2026","This emphasises\u2026","This builds a mood of\u2026","This foreshadows\u2026"],tip:'Always finish the sentence with something specific to the text. "This creates a sense of danger" is better with "\u2026as if the sea wants to drag the whole town under."'},{type:"match",q:"Match each quotation to its main effect.",pairs:[["Somewhere a window shattered.","Builds tension"],["he checked the ropes twice, although he had never once found them loose","Reveals character"],["lapped politely \u2026 reared and snarled","Creates contrast"],["the sky had curdled into a bruised purple","Foreshadows danger"],["the sharp tang of ginger","Creates vivid sensory imagery"]]},{type:"mc",q:'"The footsteps stopped. Outside the door. Waiting." What is the main effect?',options:["Short fragments slow the moment down and build suspense","It creates a cheerful mood","It makes the scene feel calm and safe","It shows the character is bored"],a:0},{type:"mc",q:"A writer describes a beach at dawn in one long, flowing sentence full of gentle detail. What effect does this create?",options:["A slow pace and a calm, peaceful mood","Panic and urgency","Tension and danger","Humour"],a:0},{type:"mc",q:"Which explanation names the most precise effect?",options:["The storm is made to seem like a predator hunting the town, creating a mood of fear and helplessness.","This makes the passage more interesting.","This is a good description.","This helps the reader imagine it."],a:0},{type:"mc",q:'The grandfather laughs "a little too loudly" when asked if he is sad. What effect does this create?',ref:"A",options:["The reader feels sympathy, because he is hiding his grief","The reader laughs with him","It builds suspense about the bridge","It creates a chaotic atmosphere"],a:0}]},L6:{name:"Tone & mood",ex:[{type:"teach",title:"Tone and mood",text:"Tone is the writer\u2019s or narrator\u2019s attitude: how the writing sounds. Mood is the atmosphere and the feeling it creates in the reader. You need precise words for both.",table:[["Group","Tone and mood words"],["Dark or negative","ominous, sinister, menacing, bleak, melancholic, oppressive, hostile, desolate"],["Light or positive","hopeful, joyful, serene, affectionate, celebratory, tranquil"],["Thoughtful","nostalgic, reflective, bittersweet, wistful"],["Other","urgent, tense, ironic, sarcastic, humorous, detached, chaotic"]],tip:'Avoid "happy" and "sad". "Melancholic", "wistful" and "bittersweet" are far more precise.'},{type:"match",q:"Match each tone word to its meaning.",pairs:[["Ominous","suggesting something bad will happen"],["Nostalgic","fondly longing for the past"],["Serene","calm and peaceful"],["Sinister","evil or harmful"],["Bittersweet","happy and sad at the same time"]]},{type:"mc",q:"Which word best describes the mood of Text C's second paragraph?",ref:"C",options:["Chaotic and menacing","Serene and peaceful","Nostalgic and wistful","Humorous"],a:0},{type:"mc",q:"Which word best describes the tone of Text A, about the last ferry?",ref:"A",options:["Bittersweet and nostalgic","Sarcastic","Sinister","Chaotic"],a:0,why:"There is sadness at losing the ferry, but warmth and beauty in the final moment."},{type:"mc",q:'"Nobody came. The swings creaked in the empty playground, and the wind pushed a crisp packet along the gravel." Which mood is created?',options:["Desolate and lonely","Joyful","Urgent","Celebratory"],a:0},{type:"mc",q:"What is the difference between tone and mood?",options:["Tone is the writer's attitude; mood is the atmosphere created for the reader","They mean exactly the same","Tone is about sound effects only","Mood is about punctuation"],a:0}]},L7:{name:"Sentences & structure",ex:[{type:"teach",title:"Sentences have effects too",text:"How a sentence is built changes how it feels.",table:[["Feature","Typical effect"],["Short simple sentence","Impact, shock or tension; makes a moment stand out"],["Fragment (minor sentence)",'Sudden emphasis: "Silence."'],["Long complex sentence","Flow and detail, or a feeling of being overwhelmed"],["List","Builds up: abundance, chaos or pressure"],["Repetition","Emphasis and rhythm"],["Rhetorical question","Makes the reader think or agree"],["Ellipsis \u2026","Suspense, hesitation or trailing off"],["Dash \u2013","A dramatic pause or interruption"]]},{type:"teach",title:"Structure",text:"Structure is how a text is organised and how it moves. Look for:",bullets:["The opening: how it hooks you and what it establishes.","Shifts in focus: wide to close-up, outside to inside, calm to chaos.","Shifts in time: flashback, or the same place at different times.","Contrast between paragraphs.","Foreshadowing: early hints of what comes later.","One-line paragraphs for impact.","The ending: a twist, a final image, or a cyclical ending that returns to the start."]},{type:"spot",q:"Tap a word in the short sentence that suddenly raises the tension.",text:a("C",1),target:["Somewhere a window shattered."],why:"A short sentence after long ones lands like a shock."},{type:"mc",q:"How does Text C's structure build tension from paragraph 1 to paragraph 2?",ref:"C",options:["It moves from the storm approaching to the storm striking in full","It moves from the storm to a calm sunny day","It flashes back to the town's history","It stays the same throughout"],a:0},{type:"mc",q:"Why does Text A save the dolphins for the very end?",ref:"A",options:["It gives a moving final image that shows exactly what the bridge will take away","It explains how the bridge was built","It introduces a new character","It shows the passengers are angry"],a:0},{type:"mc",q:'"Car horns, sirens, shouting traders, barking dogs, the hiss of frying oil." What does the list create?',options:["A sense of overwhelming noise and chaos","A calm, quiet scene","A slow, sleepy pace","A feeling of loneliness"],a:0},{type:"mc",q:'"She opened the letter, read the first line, and\u2026" What is the effect of the ellipsis?',options:["It creates suspense by leaving the reaction unsaid","It shows the sentence is finished","It speeds the story up","It shows she is happy"],a:0}]},L8:{name:"The analysis paragraph",ex:[{type:"teach",title:"A method that always works",text:"Follow these steps for each word or phrase you analyse:",list:i},{type:"teach",title:"A model paragraph",text:"Here is the method in action on one phrase from Text C:",mfirst:1,model:'The writer describes the sky as having "curdled into a bruised purple". "Curdled" usually describes milk turning sour, suggesting the sky has gone bad and unnatural, while "bruised" connotes injury and pain. Together, they make the sky look sick and wounded. This creates an ominous mood and foreshadows the violence of the storm about to hit the town.',bullets:["Why it works: the quotation is short and embedded in the sentence.","It zooms in on two key words and their connotations.","It ends with a precise effect: an ominous mood and foreshadowing."]},{type:"teach",title:"Mistakes that cost marks",text:"Avoid these:",table:[["Mistake","Fix"],["Long quotations","Quote 1 to 5 words, then zoom in"],["Feature spotting","Explain what the words suggest"],["Retelling the story","Focus on how it is written, not what happens"],['Generic effects ("read on")',"Say exactly what impression is created"],["Ignoring connotations","Ask what ideas the key word brings with it"]]},{type:"mc",q:"Which is the best quotation to analyse?",options:['"curdled"','"By noon the sky over the bay had curdled into a bruised purple, and the wind began to prowl"','"the sky"','"By noon"'],a:0,why:"Short and precise lets you zoom in on the key word."},{type:"mc",q:'Which explanation of "curdled into a bruised purple" is strongest?',options:['"Curdled" suggests milk going sour and "bruised" suggests injury, so the sky looks sickly and hurt, warning that something violent is coming.',"This is a metaphor which makes the reader want to read on.","The writer uses good descriptive language here.","The sky is purple."],a:0,why:"It explains meaning, connotations and effect."},{type:"mc",q:"Which response retells instead of analysing?",options:["The rain arrives, the lighthouse disappears and a window breaks.",'"Hurled" makes the rain seem deliberately violent, as if it is being thrown at the town.','"Marched" suggests an army advancing.','"Swallowed" makes the storm seem like a monster.'],a:0},{type:"blank",q:'The word "snarled" ___ an angry animal, which makes the sea seem ___ and out of control.',a:["suggests","threatening"],bank:["suggests","threatening","calm","says","pretty"],why:"Use analytical verbs like suggests, conveys, evokes."},{type:"order",q:"Put these sentences into a well-ordered analysis.",items:['The sea "reared and snarled".','"Snarled" is the sound an angry dog or wolf makes before it attacks.',"This makes the sea seem like a wild animal about to strike,","creating a threatening, frightening atmosphere."],why:"Quote, connotation, effect, mood."}]},L9:{name:"Analysis in action",ex:[{type:"teach",title:"Analysing a whole passage",text:"When you analyse two paragraphs, choose a few rich words or phrases from each, including some imagery. Explain each one separately, then sum up the overall impression of each paragraph.",passage:"C"},{type:"spot",q:"Paragraph 1: tap a word in the image that makes the gulls seem helpless.",text:a("C",0),target:["pinned in place like paper cut-outs"],why:"Paper cut-outs are flat and weightless, at the mercy of the wind."},{type:"spot",q:"Paragraph 2: tap a word in the image that makes the rain seem like an invading army.",text:a("C",1),target:["a grey wall that marched"],why:'"Marched" suggests soldiers advancing in formation.'},{type:"spot",q:"Paragraph 2: tap a word in the image that makes the storm seem like a monster.",text:a("C",1),target:["swallowed the lighthouse whole","drag the whole town into its throat"],why:"Swallowing and throats make the storm a devouring creature."},{type:"multi",q:"Which THREE choices from paragraph 2 are richest to analyse?",ref:"C",options:['"not falling but hurled"','"swallowed the lighthouse whole"','"lapped politely" contrasted with "reared and snarled"','"Then the rain arrived"','"In the caf\xe9"'],correct:[0,1,2],why:"Precise, rich choices with imagery."},{type:"mc",q:'What is the effect of "flickered, steadied, then died"?',options:["The lights are described like a dying person, ending the paragraph on a sense of death and helplessness","It shows the caf\xe9 has bad wiring","It is a list of things the writer saw","It makes the storm seem calm"],a:0,why:'"Died" personifies the lights and suggests the storm has won.'},{type:"mc",q:"What overall impression do the two paragraphs build?",options:["The storm is a violent, living force that overpowers the town","The town is ready for a pleasant day at the beach","The fishermen are careless","The storm is gentle and beautiful"],a:0,why:"End your answer with this kind of overview."}]},S1:{name:"Choosing summary points",ex:[{type:"teach",title:"What a summary is",text:"A summary picks out only the ideas that answer one specific focus, and puts them concisely in your own words.",list:o,tip:"The focus is everything. If the question asks for benefits, drawbacks don\u2019t count, however interesting they are."},{type:"teach",title:"Read Text B",text:"Focus: what are the BENEFITS of rooftop gardens for cities and the people who live in them?",passage:"B"},{type:"multi",q:"Which of these are relevant points for the focus (benefits)? Select all that apply.",ref:"B",options:["They keep buildings and streets cooler","They reduce the need for air conditioning","Older buildings may need strengthening","They hold rainwater and reduce flooding","Gardens exist in Singapore and Rotterdam","They give bees and birds food and shelter"],correct:[0,1,3,5],why:"Costs and place names are not benefits."},{type:"multi",q:"Which of these are also benefit points? Select all that apply.",ref:"B",options:["Residents can grow fresh, local food","A soaked garden is heavy","They bring neighbours together","They give people a calm place to rest","Maintenance costs money","Spending time among plants lowers stress"],correct:[0,2,3,5],why:"Weight and cost are drawbacks."},{type:"mc",q:"Why should you leave out the Rotterdam resident's quotation?",ref:"B",options:["Quotations are not your own words; use only the idea behind it","It is not about rooftop gardens","It is too short","It is a fact, not an opinion"],a:0,why:"Keep the point (neighbours meet), drop the quote."},{type:"order",q:"Put the summary method in order.",items:o,why:"Select, cut, group, then write and check."}]},S2:{name:"Own words & concision",ex:[{type:"teach",title:"Putting it in your own words",text:"Paraphrasing is a skill. These techniques help:",table:[["Technique","Original","Your version"],["Swap key words for synonyms","absorbs far less heat","takes in much less warmth"],["Generalise a list","bees, butterflies and birds","wildlife"],["Change the structure","a green roof holds water and releases it slowly","rainwater is stored and drained gradually"],["Combine points","cooler floors; less air conditioning","cooler buildings that need less air conditioning"]]},{type:"teach",title:"Being concise",text:"Every word has to earn its place.",bullets:["No introduction or conclusion: start with a point.","No examples, quotations, statistics or opinions.","Combine related points into one sentence.","Write in continuous sentences, not bullet points."]},{type:"mc",q:'Which is the best own-words version of "absorbs far less heat"?',options:["takes in much less warmth","absorbs a lot less heat","absorbs far less heat than roofs","is far less hot and absorbing"],a:0,why:"Change the key words, not just the order."},{type:"mc",q:'How could you generalise "Bees, butterflies and birds\u2026 find food and shelter"?',options:["They provide habitats for wildlife","Bees, butterflies and birds find food","Birds find shelter on roofs and so do bees","Insects and birds and butterflies and bees"],a:0},{type:"mc",q:"Which is the best opening sentence for this summary?",options:["Rooftop gardens cool cities, because soil and plants take in far less heat than dark roofs.","In this summary I am going to write about rooftop gardens.","Rooftop gardens are amazing and every city should have them!","Look down on any city and you will see grey roofs."],a:0,why:"Start with a point straight away. No introduction, no opinion."},{type:"mc",q:"Which sentence combines two points most efficiently?",options:["They also store rainwater during storms, reducing flooding, and provide food and shelter for wildlife.","They store rainwater. This is good. It stops flooding. They are also good for animals.","During heavy storms, a green roof holds water and releases it slowly, easing the pressure on drains.","Rain is stored."],a:0,why:"Two points, own words, one sentence."},{type:"mc",q:"Which detail should NOT be in a benefits summary?",options:["Maintenance costs money","Gardens provide habitats for wildlife","They reduce flood risk","People feel less stressed"],a:0,why:"It is a drawback, so it is off-focus."}]},X1:{name:"Writing as a character",ex:[{type:"teach",title:"Using and developing the text",text:"In the extended response you write as a character from the text. The skill is to take ideas from the text and develop them: explain the thoughts, feelings, reasons and consequences that the text only hints at.",table:[["Level","Example"],["Copying",'"He had made the crossing for forty-one years."'],["Using",'"I have steered this ferry for forty-one years."'],["Developing",'"For forty-one years this crossing has been my life. The bridge will save time, but it will take away the moments people share at sea."']],tip:"Stay true to the text. Develop what is implied; don\u2019t invent wild new events."},{type:"teach",title:"Voice and format",text:"Sound like the character, and write in the right form for the reader.",bullets:["Use the first person and the character\u2019s attitude and feelings.","Match the register to the reader: formal for a council, warmer for a friend.",'Use the conventions of the format: a letter opens with "Dear\u2026" and has a sign-off; a speech addresses its listeners.',"Give each part of the task real attention."]},{type:"match",q:"Match each format to a feature.",pairs:[["Letter",'Opens with "Dear\u2026" and has a suitable sign-off'],["Journal","Personal, reflective, first person"],["Speech","Addresses listeners directly"],["Report","Formal, factual, may use headings"],["Interview","Questions and answers between two voices"]]},{type:"mc",q:"You are writing as Amara's grandfather in a letter to the council. Which register is right?",options:["Formal and polite, but showing his feelings","Text speak with emojis","Very casual, like chatting to a friend","A list of bullet points"],a:0,why:"Match register to the reader: the council is formal."},{type:"mc",q:"Which sentence develops an idea from Text A instead of copying it?",options:['"For forty-one years the crossing has been my life; the bridge will save time, but it will take away the moments people share at sea."','"He had made the crossing for forty-one years."','"Suddenly the ferry was attacked by pirates."','"The ferry left at six."'],a:0,why:"It uses the text and develops the feeling behind it."},{type:"mc",q:"Which detail invents too much instead of developing the text?",options:['"Then a storm sank the new bridge."','"I checked the ropes twice, though I knew they were tight."','"I wanted them to look up from their phones, just once."','"The brass bell felt cold under my thumb."'],a:0,why:"Nothing in the text suggests this. The others grow naturally from it."}]},D1:{name:"Evaluating arguments",ex:[{type:"teach",title:"What evaluation means",text:"Evaluating means judging how convincing a writer\u2019s ideas are, not just repeating them. Look at the quality of the evidence and the reasoning.",table:[["Convincing","Less convincing"],["Evidence from a reliable, named source","One small survey or a single example"],["Balanced: admits problems, then answers them","One-sided: ignores the other view"],["Clear reasoning: because\u2026 so\u2026",'Sweeping generalisations: "everyone", "always"'],["Facts used fairly","Emotive words used instead of reasons"]]},{type:"teach",title:"Phrases for evaluating",text:"Use these to show judgement:",bullets:["This is convincing because\u2026","However, this claim is weakened by\u2026","The writer overlooks\u2026","This may be true, but it does not prove that\u2026","A fairer conclusion would be\u2026"],passage:"D1",passage2:"D2"},{type:"mc",q:"Which sentence evaluates rather than repeats?",options:["Text 1's survey sounds alarming, but checking a phone once is not the same as being distracted all lesson.","Text 1 says seven in ten pupils check their phones.","Text 2 says phones are tools, not toys.","Both texts talk about phones."],a:0,why:"Evaluation questions how strong the evidence or reasoning is."},{type:"multi",q:"Which are weaknesses in Text 1's argument? Select all that apply.",ref:"D1",options:['It claims parents "managed perfectly well" without evidence',"Its survey is from just one school","It mentions cyberbullying","It ignores the point that bans can be hidden from"],correct:[0,1,3],why:"Cyberbullying is a fair point, not a weakness."},{type:"mc",q:"Which is a strength of Text 2?",ref:"D2",options:["It admits the problems with phones before answering them","It uses lots of statistics","It agrees with a total ban","It never mentions bullying"],a:0,why:"Acknowledging the other side makes an argument more convincing."},{type:"mc",q:'"Everyone knows phones ruin concentration." What is the weakness?',options:["It is a sweeping generalisation with no evidence","It uses a statistic","It is too balanced","It is a rhetorical question"],a:0},{type:"mc",q:"What should your own response do with ideas from both texts?",options:["Weigh them up and reach your own clear view","Copy the best sentences","Summarise each text in turn","Ignore the text you disagree with"],a:0}]},D2:{name:"Persuasive techniques",ex:[{type:"teach",title:"Techniques and what they do",text:"Use these alongside reasoned points, never instead of them:",table:[["Technique","Example","Effect on the audience"],["Rhetorical question","Can we really call that progress?","Makes them think, and nudges them to agree"],["Rule of three","safer, calmer, kinder","Sounds complete and memorable"],["Direct address","every one of you in this hall","Makes it personal; they feel responsible"],["Anecdote","Last year my cousin lost a whole term to his phone.","Real and relatable"],["Statistics","seven in ten pupils","Sounds factual and authoritative"],["Emotive language","innocent, defenceless","Stirs feelings"],["Counter-argument","Some argue\u2026 however\u2026","Shows fairness, then wins the point"]]},{type:"match",q:"Match each example to its technique.",pairs:[["Can we really call that progress?","Rhetorical question"],["quieter, safer and fairer","Rule of three"],["Some people argue that bans work. However\u2026","Counter-argument"],["Last year my cousin lost a whole term to his phone.","Anecdote"],["Picture a classroom where every head is down.","Imperative"]]},{type:"mc",q:"What is the effect of a counter-argument followed by a rebuttal?",options:["The writer seems fair and reasonable, so their own view is more convincing","It confuses the reader","It shows the writer agrees with both sides","It makes the writing shorter"],a:0},{type:"order",q:"Put a strong argument structure in order.",items:["Hook the audience and state your view","Your strongest point, with evidence from the texts","A second point, evaluating the other side","Counter-argument and rebuttal","A memorable conclusion with a call to action"],why:"A clear, logical route through your argument."},{type:"mc",q:'What does "discursive" writing do?',options:["Explores both sides before reaching a balanced view","Tells a story","Describes a place","Only argues one side"],a:0,why:"Argumentative and persuasive writing take a clearer side."}]},D3:{name:"Audience & register",ex:[{type:"teach",title:"Register",text:"Register is how formal or informal your writing is. Choose it for your audience and purpose.",table:[["Formal","Informal"],["Full words: do not, cannot","Contractions: don\u2019t, can\u2019t"],["Precise vocabulary: undeniably, consequently","Everyday words: really, so"],["Complete, varied sentences","Chatty fragments"],["For: head teachers, councils, newspaper readers","For: friends, a blog for students"]],tip:'Never use slang or text speak ("gonna", "kinda", "lol"), even in an informal piece.'},{type:"teach",title:"Format conventions",text:"Each format has features examiners look for:",bullets:['Letter: "Dear\u2026", a clear reason for writing early on, and a sign-off ("Yours sincerely" if you name them, "Yours faithfully" if you don\u2019t).','Speech: greet the audience, use direct address and signposts ("First\u2026", "Finally\u2026"), end by thanking them.',"Article: an engaging headline and opening, a lively but controlled voice for the publication\u2019s readers.","Report: a clear title, an objective tone, and headings if useful."]},{type:"mc",q:"You are writing a speech for your school assembly. Which opening is best?",options:['"Good morning, everyone. Raise your hand if your phone has buzzed in the last hour."','"Dear Sir or Madam, I am writing to complain."','"Phones: a report."','"Once upon a time there was a phone."'],a:0,why:"Speech conventions: greet the audience and engage them."},{type:"mc",q:"Which sentence is right for a letter to your head teacher?",options:["I would like to suggest a change to the school's phone policy.","Hey, so basically the phone rules are kinda rubbish.","Yo sir, phones should be allowed lol.","PHONES!!! We need them!!!"],a:0},{type:"mc",q:'You begin a letter "Dear Sir or Madam". How should you sign off?',options:["Yours faithfully","Yours sincerely","Cheers","See you soon"],a:0,why:"Faithfully when you don't know their name; sincerely when you do."},{type:"mc",q:"Which word is too informal for a speech to teachers and students?",options:["gonna","furthermore","undeniably","however"],a:0}]},C1:{name:"Descriptive writing",ex:[{type:"teach",title:"Describe, don't narrate",text:"A descriptive piece paints a place, a moment or a person. Keep plot to a minimum: if lots of things happen, it becomes a story. The aim is atmosphere."},{type:"teach",title:"Techniques that lift description",text:"Use these deliberately:",table:[["Technique","Weak","Strong"],["Precise nouns","a bird","a heron"],["Powerful verbs","the wind blew","the wind clawed"],["Senses beyond sight","it was busy","the hiss of frying oil, the tang of ginger"],["Fresh imagery","as white as snow (clich\xe9)","pale as a page nobody has written on yet"],["Show, don\u2019t tell","the house was scary","the door hung from one hinge, groaning"]]},{type:"teach",title:"Give it a structure",text:"Description needs a shape the reader can feel:",bullets:["Zoom: start wide, then focus in on small details, then pull back.","Time shift: the same place at dawn, at noon and at night.","Movement: walk the reader through the place.","A final image that echoes the opening."]},{type:"mc",q:"Which sentence is the strongest description?",options:["Steam curled from the noodle stalls, carrying the sharp tang of ginger into the cold night air.","The market was very busy and nice.","There were lots of people and things at the market.","I went to the market and bought some food and then went home."],a:0,why:"Specific detail, precise verbs, two senses."},{type:"multi",q:'Which senses does this sentence use? "The metal railing was icy under my palm, and somewhere below a dog barked."',options:["Touch","Sound","Smell","Taste"],correct:[0,1],why:"Icy (touch) and barked (sound)."},{type:"mc",q:"Which of these is a clich\xe9 to avoid?",options:["as quiet as a mouse","the silence pressed against my ears","the hush of a library at closing time","quiet enough to hear the clock think"],a:0},{type:"mc",q:"What is the main risk in a descriptive piece?",options:["Turning it into a story with lots of events","Using too many senses","Writing in the present tense","Using paragraphs"],a:0},{type:"mc",q:"Which is a strong way to end a description of a busy market?",options:["The last stall lowers its shutter, and the empty street holds the smell of ginger like a memory.","And then I woke up.","That was the market. The end.","I hope you enjoyed my description."],a:0,why:"A final image that echoes the start."}]},C2:{name:"Narrative writing",ex:[{type:"teach",title:"Shape your story",text:"A good short story is small and focused: one or two characters, one main setting, one central problem.",list:r},{type:"teach",title:"Openings and endings",text:"First and last lines matter most.",table:[["Opening","Example"],["In the middle of the action",'"Don\u2019t open it," said Gran, but the lid was already lifting.'],["A striking detail","The letter had been sitting on the mat for three days."],["Setting and mood","Fog had swallowed the end of the pier."]],bullets:["End with a twist, a cliffhanger, or a circular ending that returns to the opening image.",'Avoid "it was all a dream" and endings that solve everything too quickly.']},{type:"order",q:"Put the parts of a story in order.",items:r.map(e=>e.split(":")[0]),short:!0,why:"Exposition, rising action, climax, falling action, resolution."},{type:"mc",q:"Which opening hooks the reader best?",options:['"Don\'t open it," said Gran, but the lid was already lifting.',"One day I woke up and had breakfast.","This is a story about a girl.","It was a normal day."],a:0,why:"It starts in the middle of the tension."},{type:"mc",q:"Your story's problem is solved in one sentence. What is the weakness?",options:["There is no build-up of tension or consequences","It is too exciting","It has too much dialogue","It uses the past tense"],a:0},{type:"mc",q:"Which ending is a circular ending?",options:["The story opens and closes with the same lit window, now dark","The character wakes up and it was all a dream","The story stops mid-sentence","A new character arrives in the last line"],a:0,why:"Returning to the opening image gives a satisfying shape."}]},C3:{name:"Character, dialogue & pace",ex:[{type:"teach",title:"Show, don't tell",text:"Reveal a character through what they do, say and notice, instead of naming the emotion.",table:[["Telling","Showing"],["She was nervous.","Her fingers kept straying to the clasp of her bag, opening it, closing it."],["He was angry.","He set the cup down so hard that tea slopped onto the table."],["They were close friends.","She finished his sentence before he had decided how it ended."]]},{type:"teach",title:"Dialogue that works",text:"Use dialogue to reveal character or build tension, not for small talk.",bullets:["New speaker, new line.",'Punctuation goes inside the speech marks: "Run," she whispered.','"Said" is fine. Let the words and actions carry the emotion.',"A few sharp lines beat a long conversation."]},{type:"teach",title:"Controlling pace",text:"Speed up for action and slow down for the moments that matter.",bullets:["Fast: short sentences, quick actions, less description.","Slow: long sentences, sensory detail, a character\u2019s thoughts.","Slow the climax right down. Stretch two seconds over a paragraph."]},{type:"mc",q:"Which line SHOWS rather than tells that a character is nervous?",options:["Her fingers kept straying to the clasp of her bag, opening it, closing it.","She was really nervous.","She felt nervous and scared.","Nervousness was what she felt."],a:0},{type:"mc",q:"How can you increase tension at the climax?",options:["Use short sentences and slow the moment down with detail","Add more characters","Skip to the ending","Explain everything that will happen"],a:0},{type:"mc",q:"Which piece of dialogue reveals the most about character?",options:['"I\'m fine," she said, not looking up from the broken vase.','"Hello," she said. "Hello," he said.','"What time is it?" "Three o\'clock."','"Nice weather," she said.'],a:0,why:"The gap between her words and her actions says a lot."},{type:"mc",q:"Which is correctly set out dialogue?",options:['"Run," she whispered.','"Run" she whispered.','"Run." she whispered.','Run, "she whispered."'],a:0}]},A1:{name:"Punctuation power",ex:[{type:"teach",title:"The comma splice",text:"You cannot join two complete sentences with just a comma. Use a full stop, a semicolon, or a connective.",code:e("\u2717  The rain stopped, we went outside.","\u2713  The rain stopped. We went outside.","\u2713  The rain stopped; we went outside.","\u2713  The rain stopped, so we went outside.")},{type:"teach",title:"Semicolons, colons and apostrophes",text:'A semicolon joins two closely linked sentences. A colon introduces an explanation or a list. Apostrophes show missing letters (don\'t) or possession (the dog\'s bowl). "It\'s" always means "it is" or "it has".'},{type:"mc",q:"Which sentence is correctly punctuated?",options:["The storm was over; the town was silent.","The storm was over, the town was silent.","The storm was over the town, was silent.","The storm, was over; the town was silent."],a:0,why:"A semicolon can join two linked complete sentences."},{type:"mc",q:"Which is correct?",options:["The dog wagged its tail.","The dog wagged it's tail.","The dog wagged its' tail.","The dog wagged it is tail."],a:0,why:'"Its" (no apostrophe) shows possession.'},{type:"mc",q:"Which uses a colon correctly?",options:["She packed three things: a torch, a map and a knife.","She packed: three things a torch, a map and a knife.","She: packed three things.","She packed three things a torch: a map and a knife."],a:0,why:"A colon introduces the list."},{type:"mc",q:"Which is correct?",options:["The students' results were posted.","The student's results were posted (meaning many students).","The students results' were posted.","The student's' results were posted."],a:0,why:"Plural possession: students'."},{type:"blank",q:'"I can\'t believe it\'s over," she said; the ___ apostrophe in "can\'t" shows a missing ___.',a:["first","letter"],bank:["first","letter","second","owner"],why:"Contraction apostrophes replace missing letters."}]},A2:{name:"Spelling traps",ex:[{type:"teach",title:"Homophones",text:"These sound the same but mean different things. Examiners notice them every time.",bullets:["their (belonging to them) \xb7 there (place) \xb7 they're (they are)","your (belonging to you) \xb7 you're (you are)","to \xb7 too (also, excessively) \xb7 two (2)","affect (verb: to influence) \xb7 effect (noun: a result)","then (time) \xb7 than (comparing)","lose (misplace) \xb7 loose (not tight)","practice (noun) \xb7 practise (verb) in British English"]},{type:"mc",q:"Choose the correct sentence.",options:["They're leaving their bags over there.","Their leaving there bags over they're.","There leaving they're bags over their.","They're leaving there bags over their."],a:0,why:"They are / belonging to them / place."},{type:"mc",q:'Choose the correct word: "The cold weather had a strange ___ on him."',options:["effect","affect"],a:0,why:"Noun = effect."},{type:"mc",q:'Choose the correct word: "She is taller ___ her brother."',options:["than","then"],a:0,why:"Comparing = than."},{type:"type",q:'Spell the word that means "certainly": d _ f _ n _ t _ l y',a:["definitely"],why:'Defin-ITE-ly: think "finite".'},{type:"type",q:'Spell the word meaning "needed": n _ c _ s s _ r y',a:["necessary"],why:"One Collar, two Sleeves: one c, two s."},{type:"type",q:'Spell the word meaning "apart, not together": s _ p _ r _ t e',a:["separate"],why:'There is "a rat" in sep-A-RAT-e.'},{type:"type",q:'Spell: the past tense of "occur".',a:["occurred"],why:"Double c, double r."},{type:"mc",q:"Which is spelled correctly?",options:["embarrassed","embarassed","embarrased","embarased"],a:0,why:"Double r, double s."}]},A3:{name:"Sentences that sing",ex:[{type:"teach",title:"Vary your sentences",text:"Strong style comes from controlled variety: short sentences for impact, longer ones for flow, and different ways to start.",bullets:["Simple: The door creaked.","Compound: The door creaked, and the hall fell silent.","Complex: Although the door creaked, nobody turned round.","Minor (for effect): Silence.","Openers: an -ing verb, an adverb, a place, a sound"]},{type:"match",q:"Match each sentence to its type.",pairs:[["Silence.","Minor sentence"],["The bell rang.","Simple sentence"],["The bell rang, and everyone ran.","Compound sentence"],["When the bell rang, everyone ran.","Complex sentence"]]},{type:"mc",q:'Which opener adds the most variety to a paragraph where every sentence starts with "I"?',options:["Trembling, I reached for the handle.","I reached for the handle.","I was trembling as I reached for the handle.","I then reached for the handle."],a:0,why:"An -ing opener changes the rhythm."},{type:"mc",q:'Why might a writer use a one-word paragraph like "Gone."?',options:["To create impact and make a moment stand out","Because they ran out of time","To show the story is finished","It is always a mistake"],a:0,why:"Used once, deliberately, it hits hard."},{type:"blank",q:"___ the lights went out, the room fell silent. ___, a match flared in the dark.",a:["As","Then"],bank:["As","Then","But","And"],why:"Varied connectives link ideas smoothly."},{type:"mc",q:"Which version builds tension best?",options:["The footsteps stopped. Outside the door. Waiting.","The footsteps stopped outside the door and waited there for a while.","There were footsteps that stopped at the door.","Footsteps stopped. They were at the door. They waited outside the door for a while and then waited more."],a:0,why:"Short, fragmented sentences slow the moment and build suspense."}]},V1:{name:"Ambitious vocabulary",ex:[{type:"teach",title:"Precise beats fancy",text:"The best word is the most precise one, not the longest. Swap vague words like good, nice, bad, big, walked and said for words that show exactly what you mean."},{type:"match",q:"Match each bland phrase to a more precise word.",pairs:[["walked slowly","trudged"],["said quietly","murmured"],["very big","colossal"],["very sad","despondent"],["very happy","elated"]]},{type:"mc",q:"Which verb best shows a tired, unwilling movement?",options:["trudged","skipped","sprinted","strolled"],a:0,why:"Trudge suggests heavy, weary steps."},{type:"mc",q:'Which word means "calm and peaceful"?',options:["serene","ominous","frantic","sombre"],a:0},{type:"mc",q:'Which word means "suggesting something bad will happen"?',options:["ominous","luminous","jubilant","pristine"],a:0},{type:"mc",q:'"The house was old and falling apart." Which single word replaces "old and falling apart"?',options:["dilapidated","opulent","pristine","vibrant"],a:0},{type:"mc",q:"Which word describes a harsh mix of loud sounds?",options:["cacophony","melody","whisper","serenity"],a:0}]},V2:{name:"Words for analysis",ex:[{type:"teach",title:'Better than "shows"',text:"Use precise verbs to explain effects. Each says something slightly different:",bullets:["suggests / implies: hints at a meaning","conveys: gets across a feeling or idea","evokes: brings a picture or emotion to mind","emphasises: makes something stand out","connotes: carries associations","foreshadows: hints at what will happen later","contrasts with: shows difference"]},{type:"mc",q:"Which sentence analyses most precisely?",options:['"Snarled" evokes a vicious animal, conveying the sea\'s hostility.',"This shows the sea is bad.","This quote is good.","The writer uses words."],a:0,why:"Precise verbs, specific word, clear effect."},{type:"blank",q:"The dark clouds ___ the danger that will arrive later in the story.",a:["foreshadow"],bank:["foreshadow","emphasise","imply","contrast"],why:"Hinting at future events = foreshadowing."},{type:"mc",q:'What does "connotations" mean?',options:["The ideas and feelings a word carries beyond its literal meaning","The dictionary definition of a word","The number of syllables in a word","A list of synonyms"],a:0,why:'E.g. "home" connotes safety and warmth.'},{type:"mc",q:"Which is the best way to begin explaining an image?",options:['The image of the rain as "a grey wall" suggests\u2026',"The writer uses a metaphor.","In paragraph two there is a quote.","This makes the reader want to read on."],a:0,why:"Name the image, quote it, and move straight into meaning."}]}},h=[{id:"p1",tab:"Paper 1",title:"Reading",units:[{topic:"1",title:"Reading for meaning",sub:"Explicit information, inference, words in context",lessons:["R1","R2","R3"],guide:["Explicit: the answer is stated in the text. Find it precisely.","Inference: work out what is suggested from actions, speech and word choices.","Explain feelings and attitudes, not just events.",'"In your own words" means change the key words.',"Work out unfamiliar words from the sentence around them."]},{topic:"2",title:"Language analysis",sub:"Connotations, imagery, sound, effects, tone, structure",lessons:["L1","L2","L3","L4","L5","L6","L7","L8","L9"],guide:["Analysis explains how words create meaning and effect. Naming a technique is not enough.","Zoom in on one key word and explore its connotations.","Imagery: say what is compared, which qualities carry across, and what that suggests.","Sound: plosives are harsh, sibilance is hushed or sinister, onomatopoeia is vivid.","Effects to name: tension, atmosphere, character, emphasis, imagery, pace, contrast, foreshadowing, sympathy, threat.","Use precise tone words: ominous, nostalgic, menacing, serene, bittersweet.","Sentences and structure have effects too: short for impact, lists for chaos, shifts in focus.","Method: short quote, meaning, connotations, effect, overall impression."]},{topic:"3",title:"Summary",sub:"Select, cut, condense",lessons:["S1","S2"],guide:o.concat(["Paraphrase: swap synonyms, generalise lists, change the structure, combine points.","No introduction, opinions, quotations or examples."])},{topic:"4",title:"Writing as a character",sub:"Using and developing ideas from the text",lessons:["X1"],guide:["Copy \u2192 use \u2192 develop: explain the feelings, reasons and consequences the text implies.","Stay true to the text; don't invent wild events.","Write in the character's voice and the right format for the reader."]}]},{id:"p2",tab:"Paper 2",title:"Writing",units:[{topic:"5",title:"Directed writing",sub:"Evaluate, persuade, write for an audience",lessons:["D1","D2","D3"],guide:["Evaluate: judge the evidence and reasoning, don't repeat it.","Weak arguments: tiny samples, generalisations, emotion instead of reasons, ignoring the other side.","Persuasive techniques work best alongside reasons.","Match register and format to the audience. No slang."]},{topic:"6",title:"Composition",sub:"Descriptive and narrative writing",lessons:["C1","C2","C3"],guide:["Description: atmosphere, senses, precise nouns, strong verbs, little plot.","Narrative: one problem, a clear shape, real tension, a satisfying ending.","Show, don't tell: reveal feelings through actions and details.","Control pace: slow the important moments down."]},{topic:"7",title:"Accuracy and style",sub:"Punctuation, spelling, sentences",lessons:["A1","A2","A3"],guide:["No comma splices: use a full stop, semicolon or connective.","its = belonging to it; it's = it is","their / there / they're; affect / effect; then / than","Vary sentence length and openings."]},{topic:"8",title:"Vocabulary",sub:"Precise words for writing and analysis",lessons:["V1","V2"],guide:["Precise beats long: trudged, murmured, colossal.","Analysis verbs: suggests, conveys, evokes, emphasises, connotes, foreshadows.","Explain connotations, not just definitions."]}]}],d={sight:"Sight",sound:"Sound",move:"Movement",mood:"Mood",feel:"Feelings and character",argue:"Argument",analyse:"Analysis"},c=[{w:"luminous",c:"sight",m:"giving off a soft, bright light",e:"The jellyfish drifted past, luminous against the black water."},{w:"gaunt",c:"sight",m:"very thin and bony, usually from illness, hunger or worry",e:"After the long winter his face was gaunt, the cheekbones sharp as blades."},{w:"dilapidated",c:"sight",m:"falling apart because of age or neglect",e:"A dilapidated shed leaned against the fence as if it were too tired to stand."},{w:"pristine",c:"sight",m:"perfectly clean and untouched, as if new",e:"Fresh snow lay pristine across the playing field before the first footprints arrived."},{w:"vibrant",c:"sight",m:"bright, bold and full of life",e:"The mural was vibrant with oranges and purples that seemed to hum in the sunlight."},{w:"opulent",c:"sight",m:"rich, luxurious and expensive-looking",e:"Gold taps and velvet curtains made the hotel bathroom ridiculously opulent."},{w:"desolate",c:"sight",m:"empty, bleak and lonely",e:"Beyond the last house the road ran on through a desolate plain of rocks and dust."},{w:"ethereal",c:"sight",m:"delicate and light, almost too perfect for this world",e:"Mist turned the morning lake ethereal, the far shore floating like a dream."},{w:"gnarled",c:"sight",m:"twisted and knobbly with age",e:"The fisherman mended the net with gnarled, patient fingers."},{w:"translucent",c:"sight",m:"allowing light through, but not completely clear",e:"Light glowed through the translucent paper lanterns strung above the street."},{w:"cacophony",c:"sound",m:"a harsh, jumbled mixture of loud sounds",e:"Car horns, sirens and shouting traders blended into a cacophony that made my head ache."},{w:"reverberate",c:"sound",m:"to echo again and again",e:"Her footsteps reverberated through the empty sports hall."},{w:"shrill",c:"sound",m:"high-pitched and piercing",e:"A shrill whistle cut through the chatter and the whole pitch fell still."},{w:"guttural",c:"sound",m:"deep and harsh, as if from the back of the throat",e:"The dog gave a low, guttural growl that froze us at the gate."},{w:"resonant",c:"sound",m:"deep, rich and continuing to sound",e:"The cathedral bell was so resonant that the windows seemed to hum with it."},{w:"muffled",c:"sound",m:"quietened or made unclear, as if covered",e:"Muffled voices came through the wall, too soft to make out the words."},{w:"clamour",c:"sound",m:"a loud, confused noise, often of people demanding something",e:"The clamour of the crowd grew as the gates stayed shut."},{w:"hushed",c:"sound",m:"very quiet, often out of respect or tension",e:"The audience waited in hushed silence for the final name to be read out."},{w:"trudge",c:"move",m:"to walk slowly and heavily, as if tired",e:"We trudged up the hill, our boots heavy with mud."},{w:"saunter",c:"move",m:"to walk in a slow, relaxed, unhurried way",e:"He sauntered into the exam hall as if he had all the time in the world."},{w:"scurry",c:"move",m:"to move quickly with short, hurried steps",e:"Mice scurried across the kitchen floor the moment the light went off."},{w:"lurch",c:"move",m:"to make a sudden, unsteady movement",e:"The bus lurched forward and my coffee slopped across my sleeve."},{w:"meander",c:"move",m:"to wander slowly with many turns",e:"The river meandered through the valley, in no hurry to reach the sea."},{w:"plummet",c:"move",m:"to fall very fast and steeply",e:"The kite caught a gust, spun, and plummeted into the trees."},{w:"recoil",c:"move",m:"to jump or pull back suddenly in fear or disgust",e:"She recoiled as the spider dropped from the shelf onto her book."},{w:"hurtle",c:"move",m:"to move at great speed, often out of control",e:"The sledge hurtled down the slope towards the frozen pond."},{w:"stagger",c:"move",m:"to walk unsteadily, almost falling",e:"The runner staggered across the line and collapsed onto the grass."},{w:"glide",c:"move",m:"to move smoothly and silently",e:"A heron glided low over the reeds without a single beat of its wings."},{w:"ominous",c:"mood",m:"suggesting that something bad is about to happen",e:"An ominous silence settled over the house just before the lights failed."},{w:"serene",c:"mood",m:"calm, peaceful and untroubled",e:"Even with the exam an hour away, her face was serene."},{w:"sombre",c:"mood",m:"dark, serious and sad",e:"The sombre music made the whole hall fall still."},{w:"foreboding",c:"mood",m:"a strong feeling that something bad will happen",e:"A sense of foreboding crept over him as the phone kept ringing."},{w:"melancholy",c:"mood",m:"a deep, thoughtful sadness",e:"There is a melancholy beauty to a seaside town in winter."},{w:"eerie",c:"mood",m:"strange and frightening in a mysterious way",e:"The empty playground was eerie in the fog, one swing still moving."},{w:"tranquil",c:"mood",m:"quiet, still and peaceful",e:"At dawn the harbour was tranquil, the boats barely rocking."},{w:"oppressive",c:"mood",m:"heavy and uncomfortable, making it hard to breathe or relax",e:"The heat was oppressive, pressing down on the town like a lid."},{w:"idyllic",c:"mood",m:"extremely happy, peaceful and picturesque",e:"The village looked idyllic on the postcard, all blossom and blue sky."},{w:"bleak",c:"mood",m:"cold, bare and without hope or comfort",e:"The moor was bleak in November, grey on grey as far as you could see."},{w:"despondent",c:"feel",m:"low in spirits, having lost hope",e:"After the third rejection letter he was too despondent to open the fourth."},{w:"elated",c:"feel",m:"extremely happy and excited",e:"She was elated when her name appeared at the top of the list."},{w:"apprehensive",c:"feel",m:"anxious that something bad might happen",e:"I was apprehensive as I knocked on the head teacher's door."},{w:"indignant",c:"feel",m:"angry because something seems unfair",e:"The players were indignant when the goal was disallowed."},{w:"resilient",c:"feel",m:"able to recover quickly from difficulties",e:"The town proved resilient, rebuilding the harbour within a year."},{w:"wistful",c:"feel",m:"sadly longing for something in the past or out of reach",e:"Grandad gave a wistful smile as he looked at the old photograph."},{w:"aloof",c:"feel",m:"cool and distant; not friendly or involved",e:"The new student seemed aloof, but she was really just shy."},{w:"meticulous",c:"feel",m:"very careful and precise about every detail",e:"His notes were meticulous, every heading underlined twice."},{w:"impetuous",c:"feel",m:"acting quickly without thinking first",e:"In an impetuous moment she quit the team, and regretted it by dinner time."},{w:"nonchalant",c:"feel",m:"calm and relaxed, seeming not to care",e:"He gave a nonchalant shrug, though his hands were shaking."},{w:"compelling",c:"argue",m:"so convincing that it is hard to disagree",e:"The second writer makes a compelling case for teaching responsible use."},{w:"contentious",c:"argue",m:"likely to cause disagreement or argument",e:"School uniform remains a contentious issue among students and parents."},{w:"detrimental",c:"argue",m:"causing harm or damage",e:"Too little sleep is detrimental to concentration."},{w:"crucial",c:"argue",m:"extremely important; decisive",e:"Clean water is crucial to the health of the whole village."},{w:"undeniably",c:"argue",m:"in a way that cannot be argued with",e:"Phones are undeniably useful in an emergency."},{w:"consequently",c:"argue",m:"as a result",e:"The bridge will cut the journey to six minutes; consequently, the ferry will close."},{w:"nevertheless",c:"argue",m:"in spite of that; however",e:"Green roofs are expensive. Nevertheless, their benefits are hard to ignore."},{w:"furthermore",c:"argue",m:"in addition; also (to add a further point)",e:"Furthermore, a ban would be almost impossible to enforce."},{w:"alleviate",c:"argue",m:"to make a problem or pain less severe",e:"Planting trees can alleviate the heat in crowded city streets."},{w:"advocate",c:"argue",m:"to publicly support or recommend",e:"Many doctors advocate a screen-free hour before bed."},{w:"evokes",c:"analyse",m:"brings a feeling, memory or image to mind",e:'"Snarled" evokes a vicious animal ready to attack.'},{w:"connotes",c:"analyse",m:"carries extra ideas or associations beyond the literal meaning",e:'"Bruised" connotes injury, suggesting the sky has been hurt.'},{w:"juxtaposes",c:"analyse",m:"places two contrasting things side by side for effect",e:"The writer juxtaposes the polite sea with the snarling one to show how fast it changed."},{w:"foreshadows",c:"analyse",m:"hints at something that will happen later",e:"The flickering lights foreshadow the darkness that is coming."}],u=[{s:"Her voice was as thin as paper.",d:"Simile"},{s:"The crowd moved like a slow grey river towards the gates.",d:"Simile"},{s:"He ran through the corridor like a startled deer.",d:"Simile"},{s:"The classroom was a zoo by the end of lunch.",d:"Metaphor",x:["Hyperbole"]},{s:"Grief was a heavy coat she could not take off.",d:"Metaphor"},{s:"His words were knives.",d:"Metaphor"},{s:"The old stairs groaned under every step.",d:"Personification",x:["Onomatopoeia"]},{s:"Hunger gnawed at the town all winter.",d:"Personification"},{s:"The kettle grumbled to itself in the corner.",d:"Personification"},{s:"Pale pink petals piled up on the path.",d:"Alliteration",x:["Sibilance"]},{s:"The big brown boat bobbed in the bay.",d:"Alliteration",x:["Sibilance"]},{s:"The fire crackled and hissed in the grate.",d:"Onomatopoeia",x:["Sibilance","Personification"]},{s:"Bang! The door slammed shut behind us.",d:"Onomatopoeia",x:["Imperative"]},{s:"Somewhere a tap went drip, drip, drip.",d:"Onomatopoeia",x:["Repetition","Rule of three"]},{s:"I have told you a million times to shut the gate.",d:"Hyperbole"},{s:"This bag weighs a tonne.",d:"Hyperbole",x:["Metaphor"]},{s:"The queue was so long it reached the next town.",d:"Hyperbole"},{s:"Who would not want cleaner air for their children?",d:"Rhetorical question",x:["Emotive language","Direct address"]},{s:"Is this really the best our town can do?",d:"Rhetorical question",x:["Direct address"]},{s:"The streets were cold, quiet and empty.",d:"Rule of three"},{s:"We want schools that are safer, fairer and kinder.",d:"Rule of three",x:["Direct address"]},{s:"On the morning of her wedding, the sun burst through and the whole valley glowed.",d:"Pathetic fallacy",x:["Personification","Hyperbole"]},{s:"As the villain stepped inside, thunder rolled across the hills.",d:"Pathetic fallacy",x:["Onomatopoeia"]},{s:"A deafening silence filled the hall.",d:"Oxymoron",x:["Hyperbole"]},{s:"It was a bittersweet goodbye.",d:"Oxymoron"},{s:"Outside the gleaming hotel, a man slept on cardboard.",d:"Juxtaposition"},{s:"The baby laughed in the middle of the ruined street.",d:"Juxtaposition"},{s:"Silent, sleepless, she sat beside the sea.",d:"Sibilance",x:["Alliteration","Rule of three"]},{s:"The snake slid slowly through the soft sand.",d:"Sibilance",x:["Alliteration"]},{s:"Pic
