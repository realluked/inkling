ONFIG={url:"https://bzcaswhwxffuuhrqtdyk.supabase.co",key:"sb_publishable_NaAvMjYFrs0Z0StUaIJzug_1z-4n-H3"};</script><script>!function(){const e=(...e)=>e.join("\n"),t={A:{title:"Text A \xb7 The Last Ferry",paras:["Every evening at six, the old ferry Marisol left the harbour for the island, and every evening Amara's grandfather stood at the wheel. He had made the crossing for forty-one years. He knew which waves would lift the bow and which would slap the side, and he could tell from the colour of the sky whether his passengers would arrive dry.","Tonight was different. The council had announced that a new bridge would open in the spring, and the ferry would be sold for scrap. Most of the regular passengers seemed relieved: the bridge would cut their journey from forty minutes to six. Amara watched them hurry aboard, already talking about the time they would save.","Her grandfather said nothing. He checked the ropes twice, although he had never once found them loose, and he ran his thumb along the brass bell as if he were memorising its shape. When a small boy asked if he was sad, he laughed a little too loudly and said that bridges could not see dolphins.","Halfway across, he slowed the engine without explaining why. The passengers looked up from their phones. In the silver water beside them, three dolphins rose, breathed and vanished."]},B:{title:"Text B \xb7 Gardens in the Sky",paras:["Look down on almost any large city from the air and you will see acres of flat grey roofs. Increasingly, though, some of those roofs are turning green. In cities from Singapore to Rotterdam, planners and residents are planting gardens on top of buildings, and the reasons go well beyond appearances.","The most obvious benefit is cooling. Dark roofs soak up the sun and release heat long after dark, which helps make city centres several degrees warmer than the countryside around them. A layer of soil and plants absorbs far less heat, so the floors below stay cooler and residents rely less on air conditioning. Plants also trap rain. During heavy storms, a green roof holds water and releases it slowly, easing the pressure on drains that might otherwise flood the streets.","There are benefits for wildlife too. Bees, butterflies and birds that have been pushed out of cities by concrete find food and shelter on rooftops, sometimes several storeys above the traffic. Some gardens grow vegetables, giving people in crowded neighbourhoods fresh food that has not travelled hundreds of kilometres.","Not everything about them is simple. A soaked garden is heavy, and older buildings may need expensive strengthening before one can be added. Maintenance costs money, and a neglected roof can quickly become an eyesore.",'Yet the people who use them are often the most enthusiastic. "I came up here to water the tomatoes and ended up talking to neighbours I\'d ignored for ten years," says one Rotterdam resident. Researchers report the same pattern: green roofs give people a calm place to rest, and spending time among plants is linked to lower stress.']},C:{title:"Text C \xb7 The Storm",paras:["By noon the sky over the bay had curdled into a bruised purple, and the wind began to prowl along the shoreline, rattling shutters and worrying at the loose corners of tarpaulins. Gulls hung motionless above the harbour wall, pinned in place like paper cut-outs, before the gusts tore them sideways and flung them inland. On the beach, the fishermen worked in silence, dragging their boats higher up the shingle, their faces set like stone.","Then the rain arrived, not falling but hurled, a grey wall that marched across the water and swallowed the lighthouse whole. The sea, which an hour earlier had lapped politely at the jetty, now reared and snarled, flinging white spray over the harbour wall as if it wanted to drag the whole town into its throat. Somewhere a window shattered. In the caf\xe9, the lights flickered, steadied, then died, and for a moment the only sound was the storm's endless, furious roar."]},D1:{title:"Text 1 \xb7 Ban phones. Completely.",paras:["Walk into any classroom and watch what happens when a phone buzzes. Thirty heads turn. The lesson stops, even if only for a second, and the thread of a difficult idea snaps. At my children's school, a student survey found that seven in ten pupils check their phones during lessons. Seven in ten!","Phones do not only steal attention. They carry the playground into every corner of a child's life: the group chat that leaves you out, the photo you never agreed to, the comment that arrives at midnight. Banning phones during the school day gives young people seven hours of relief.","Some say students need phones for emergencies. Schools have telephones, and parents managed perfectly well before smartphones existed. Others say phones are useful for learning. Perhaps, but a textbook has never sent anyone a notification. If we want children who can concentrate, talk face to face and think for themselves, the answer is simple: lock the phones away."]},D2:{title:"Text 2 \xb7 Phones are tools, not toys",paras:["Every few years someone calls for a total phone ban, and every few years the same thing happens: phones disappear into pockets and bags, and students simply get better at hiding them. Bans do not teach anyone how to use technology well. They just move the problem out of sight.","Used properly, a phone is a remarkable learning tool. My students record experiments, translate texts, check facts and photograph the board instead of copying it out. When a family emergency happens, a quick message can save hours of worry.","Of course phones can distract, and online bullying is a real problem. But young people will spend the rest of their lives surrounded by screens. School is exactly the place to learn how to switch off notifications, manage time and treat each other kindly online. Teach responsible use; don't pretend the technology does not exist."]}},s=(e,s)=>t[e].paras[s],a=["Simile","Metaphor","Personification","Alliteration","Onomatopoeia","Hyperbole","Rhetorical question","Rule of three","Pathetic fallacy","Oxymoron","Juxtaposition","Sibilance","Imperative","Direct address","Repetition","Emotive language"],n=["Q1(a)\u2013(e): short answers on Text A, about 15 minutes","Q1(f): summary of Text B, about 25 minutes","Q2(a)\u2013(c): vocabulary and one language example from Text C, about 15 minutes","Q2(d): language analysis of two paragraphs, about 25 minutes","Q3: extended response to Text C, about 35 minutes","Checking: about 5 minutes"],o=["Read the question and underline the exact focus","Read Text B and highlight only the points that answer the focus","Cross out examples, repeats, quotations and anything off-focus","Group similar points together","Write in your own words, in continuous sentences, no more than 120 words","Check the word count and that you have not copied phrases"],r=["Choose a short, precise quotation, usually 1 to 5 words","Explain what it means literally, in the context","Explore its connotations: what ideas does the key word bring?","Explain the effect: what picture or feeling it creates for the reader","Link back to the overall impression of the paragraph"],i=["Exposition: introduce the character, setting and normal situation","Rising action: a problem or tension appears","Climax: the moment of greatest tension or change","Falling action: the consequences start to unfold","Resolution: how things end up, ideally with a final image or twist"],l={K1:{name:"Paper 1 at a glance",ex:[{type:"teach",title:"Your reading paper",text:"Paper 1 is 2 hours and 80 marks. You get a booklet with three texts and answer every question. The marks next to each question tell you how much to write.",list:["Question 1: Text A short answers (15 marks) and a summary of Text B (15 marks)","Question 2: Text C vocabulary and a single language example (10 marks), then a language analysis (15 marks)","Question 3: an extended response using Text C (25 marks)"]},{type:"teach",title:"Spend time where the marks are",text:"A good plan for the 2 hours:",list:n},{type:"mc",q:"How many words can your summary in Question 1(f) be?",options:["No more than 120","About 250","Exactly 100","As many as you need"],a:0,why:"Going far over 120 words costs writing marks for concision."},{type:"mc",q:"How much is the Question 2(d) language analysis worth?",options:["15 marks","5 marks","25 marks","40 marks"],a:0,why:"It is one of the biggest single questions, so give it about 25 minutes."},{type:"match",q:"Match each question to its task",pairs:[["Q1(a)\u2013(e)","Short answers on Text A"],["Q1(f)","Summary of Text B"],["Q2(d)","Analysis of the writer's language"],["Q3","Extended response in a set format"]]},{type:"mc",q:"Question 3 asks you to write as a character. What length is recommended?",options:["250 to 350 words","No more than 120 words","350 to 450 words","Around 600 words"],a:0,why:"250 to 350 words, using and developing ideas from Text C."},{type:"order",q:"Put a sensible Paper 1 timing plan in order",items:n.map(e=>e.split(":")[0]),short:!1,why:"Work through in order and keep an eye on the clock."},{type:"mc",q:"A 3-mark short-answer question usually needs\u2026",options:["Three separate points","One long quotation","A paragraph of analysis","Just one word"],a:0,why:"One mark per clear point is a safe rule."}]},R1:{name:"Finding explicit meaning",ex:[{type:"teach",title:"Read Text A",text:"Questions 1(a) to (e) test whether you can find and explain information. Read Text A carefully first. You can reopen it on every question.",passage:"A"},{type:"teach",title:"Answering short questions",text:'Look only at the lines the question points to. Answer in short, precise sentences. When it says "in your own words", don\'t copy: explain it in different words.'},{type:"type",q:"How many years has Amara's grandfather made the crossing? (number)",ref:"A",a:["41","forty one","forty-one"],why:'Paragraph 1: "forty-one years".'},{type:"mc",q:"Why do most of the regular passengers feel relieved?",ref:"A",options:["The bridge will make their journey much shorter","The ferry has become dangerous","The ferry tickets were too expensive","They did not like the grandfather"],a:0,why:"Forty minutes by ferry, six by bridge."},{type:"type",q:"How many minutes will the journey take using the bridge? (number)",ref:"A",a:["6","six"],why:'Paragraph 2: "from forty minutes to six".'},{type:"spot",q:"Tap a word in the phrase that shows the grandfather is trying to remember the ferry.",text:s("A",2),target:["as if he were memorising its shape"],why:"He is fixing the bell in his memory because he will lose it."},{type:"mc",q:'Which answer explains "hurry aboard" in your own words?',options:["They rush to get on the boat","They hurry aboard the ferry","They are aboard in a hurry","They walk calmly onto the deck"],a:0,why:"Own words means changing the key words, not just reordering them."},{type:"multi",q:"Which TWO things does the grandfather know from experience? Select two.",ref:"A",options:["Which waves will lift the bow","Whether passengers will arrive dry, from the sky","When the bridge will open","How much the ferry will sell for"],correct:[0,1],why:"Both are in paragraph 1."}]},R2:{name:"Reading between the lines",ex:[{type:"teach",title:"Inference",text:"Many questions ask what a detail suggests. The answer is not stated: you work it out from clues such as actions, word choices and what characters avoid saying. Explain the feeling or attitude, not just the event."},{type:"mc",q:'He laughed "a little too loudly". What does this suggest?',ref:"A",quote:"he laughed a little too loudly",options:["He is hiding how upset he really feels","He finds the boy's question very funny","He is hard of hearing","He is angry with the boy"],a:0,why:"Forced laughter covers sadness."},{type:"mc",q:"He checks the ropes twice, although they are never loose. What does this suggest?",ref:"A",options:["He wants to hold on to his routine while he still can","He thinks the ropes are dangerous","He is new to the job","He wants to slow the passengers down"],a:0,why:"The care shows how much the ferry means to him."},{type:"mc",q:'What does "bridges could not see dolphins" suggest he values about the ferry?',ref:"A",options:["The slow crossing lets people notice the natural world","Dolphins are dangerous to bridges","The ferry is faster than a bridge","He wants to become a marine biologist"],a:0,why:"The ferry offers something a quick bridge cannot."},{type:"mc",q:"Why does the writer end with the dolphins?",ref:"A",options:["It proves the grandfather's point about what the ferry offers","It shows the passengers are bored","It explains why the bridge is being built","It shows the ferry is unsafe"],a:0,why:"The passengers finally look up and see what he meant."},{type:"spot",q:"Tap a word that shows the passengers had not been paying attention to the crossing.",text:s("A",3),target:["looked up from their phones"],why:"They only look up when he slows down."},{type:"mc",q:"Which answer is a strong inference rather than a retelling?",options:["His silence suggests he is grieving the loss of something he loves","He said nothing and checked the ropes","He drove the ferry across the water","The ferry left at six"],a:0,why:"An inference explains what the evidence reveals about feelings or attitudes."}]},R3:{name:"Words in context",ex:[{type:"teach",title:"Questions 2(a) and 2(b)",text:"2(a) asks you to find a word or phrase in Text C with a given meaning. Copy just the word or short phrase. 2(b) asks you to explain words in your own words, so your explanation should still make sense if you swapped it into the sentence."},{type:"teach",title:"Read Text C",text:"This passage is used for the next lessons too. Notice how every verb is chosen to make the storm feel alive.",passage:"C"},{type:"spot",q:'Tap a word that means "moved around like a hunter looking for prey".',text:s("C",0),target:["prowl"],why:'"Prowl" suggests a predator.'},{type:"spot",q:'Tap a word that means "the pebbles on the beach".',text:s("C",0),target:["shingle"],why:"Shingle is a beach of small stones."},{type:"spot",q:'Tap a word that means "thrown with great force".',text:s("C",1),target:["hurled"],why:'The rain is "not falling but hurled".'},{type:"mc",q:'Explain "lapped politely" in your own words.',options:["Moved gently and calmly against the jetty","Licked the jetty with its tongue","Moved in a well-mannered and formal way","Crashed loudly into the jetty"],a:0,why:"Explain the meaning in context; the sea was calm and gentle."},{type:"mc",q:'What does "worrying at" mean in "worrying at the loose corners of tarpaulins"?',options:["Tugging repeatedly, like a dog with a toy","Feeling anxious about","Ignoring completely","Carefully fixing"],a:0,why:'Here "worry" means to pull at something again and again.'},{type:"mc",q:"For 2(a), which answer is best?",options:["hurled","then the rain arrived, not falling but hurled, a grey wall","it was thrown","not falling"],a:0,why:"Copy only the precise word or phrase. Extra words can lose the mark."}]},S1:{name:"Choosing summary points",ex:[{type:"teach",title:"The summary question",text:"Question 1(f) asks you to summarise Text B on one focus, in your own words, in no more than 120 words. 10 marks are for relevant points and 5 for writing: concise, organised, own words.",list:o},{type:"teach",title:"Read Text B",text:"Focus: what are the BENEFITS of rooftop gardens for cities and the people who live in them?",passage:"B"},{type:"multi",q:"Which of these are relevant points for the focus (benefits)? Select all that apply.",ref:"B",options:["They keep buildings and streets cooler","They reduce the need for air conditioning","Older buildings may need strengthening","They hold rainwater and reduce flooding","Gardens exist in Singapore and Rotterdam","They give bees and birds food and shelter"],correct:[0,1,3,5],why:"Costs and place names are not benefits."},{type:"multi",q:"Which of these are also benefit points? Select all that apply.",ref:"B",options:["Residents can grow fresh, local food","A soaked garden is heavy","They bring neighbours together","They give people a calm place to rest","Maintenance costs money","Spending time among plants lowers stress"],correct:[0,2,3,5],why:"Weight and cost are drawbacks."},{type:"mc",q:"Why should you leave out the Rotterdam resident's quotation?",ref:"B",options:["Quotations are not your own words; use only the idea behind it","It is not about rooftop gardens","It is too short","It is a fact, not an opinion"],a:0,why:"Keep the point (neighbours meet), drop the quote."},{type:"mc",q:'Which is the best own-words version of "absorbs far less heat"?',options:["takes in much less warmth","absorbs a lot less heat","absorbs far less heat than roofs","is far less hot and absorbing"],a:0,why:"Change the key words, not just the order."},{type:"order",q:"Put the summary method in order",items:o,why:"Select, cut, group, then write and check."}]},S2:{name:"Writing a tight summary",ex:[{type:"teach",title:"Concise and informative",text:"Write in continuous sentences, not bullet points. No introduction, no opinions, no quotations, no examples. Combine related points into one sentence to save words."},{type:"mc",q:"Which is the best opening sentence for this summary?",options:["Rooftop gardens cool cities, because soil and plants take in far less heat than dark roofs.","In this summary I am going to write about rooftop gardens.","Rooftop gardens are amazing and every city should have them!","Look down on any city and you will see grey roofs."],a:0,why:"Start with a point straight away. No introduction, no opinion."},{type:"mc",q:"Which sentence combines two points most efficiently?",options:["They also store rainwater during storms, reducing flooding, and provide food and shelter for wildlife.","They store rainwater. This is good. It stops flooding. They are also good for animals.","During heavy storms, a green roof holds water and releases it slowly, easing the pressure on drains.","Rain is stored."],a:0,why:"Two points, own words, one sentence."},{type:"mc",q:"What happens if you copy long phrases from Text B?",options:["You lose writing marks for not using your own words","You get extra marks for accuracy","Nothing, it saves time","The examiner ignores the whole answer"],a:0,why:"Lifting text is one of the most common problems examiners report."},{type:"blank",q:"A summary should be in your own ___, in ___ sentences, and no more than ___ words.",a:["words","continuous","120"],bank:["words","continuous","120","bullet","250","quotes"],why:"Own words, continuous prose, 120 words."},{type:"mc",q:"Which detail should NOT be in a benefits summary?",options:["Maintenance costs money","Gardens provide habitats for wildlife","They reduce flood risk","People feel less stressed"],a:0,why:"It is a drawback, so it is off-focus."},{type:"type",q:"What is the maximum number of words for the summary?",a:["120"],why:"No more than 120 words."}]},W1:{name:"Language devices",ex:[{type:"teach",title:"Devices to recognise",text:"Naming a device earns nothing on its own. What earns marks is explaining what the words mean and the effect they create. Still, you need to spot them quickly:",bullets:["Simile: a comparison using like or as","Metaphor: says something IS something else","Personification: gives human or animal qualities to a non-living thing","Alliteration: repeated consonant sounds at the start of words","Onomatopoeia: words that sound like their meaning","Pathetic fallacy: weather reflecting mood","Oxymoron: two opposite ideas together","Juxtaposition: contrasting ideas placed side by side"]},{type:"match",q:"Match each example to its device",pairs:[["pinned in place like paper cut-outs","Simile"],["the sky had curdled into a bruised purple","Metaphor"],["the wind began to prowl","Personification"],["the storm's endless, furious roar","Onomatopoeia"],["silver sea, silent sky","Alliteration"]]},{type:"spot",q:"Tap a word in the simile that makes the fishermen seem determined.",text:s("C",0),target:["their faces set like stone"],why:'"Set like stone" suggests hard, fixed determination.'},{type:"spot",q:"Tap a word showing the sea is personified as a wild animal.",text:s("C",1),target:["reared and snarled"],why:'"Snarled" makes the sea sound like an angry beast.'},{type:"mc",q:'"It was a deafening silence." Which device is this?',options:["Oxymoron","Simile","Alliteration","Onomatopoeia"],a:0,why:"Deafening and silence are opposites."},{type:"mc",q:'"As the funeral began, grey clouds wept over the town." Which device links the weather to the mood?',options:["Pathetic fallacy","Hyperbole","Onomatopoeia","Rhetorical question"],a:0,why:"The weather mirrors the sadness."},{type:"mc",q:'Why is "The bag weighed a ton" hyperbole?',options:["It is a deliberate exaggeration for effect","It compares using like or as","It repeats a sound","It is literally true"],a:0,why:"Exaggeration that is not meant literally."}]},W2:{name:"Meaning, then effect",ex:[{type:"teach",title:"How to explain a choice",text:"For each word or phrase, examiners want precise explanation, not labels. Follow these steps:",list:r},{type:"teach",title:"An example",text:"Here is the method applied to one phrase from Text C:",code:e('"the wind began to prowl"',"Meaning: the wind moved around the shore restlessly.",'Connotations: "prowl" is what a predator does when hunting.',"Effect: the wind feels threatening and alive, as if it is","searching for something to attack, building tension.")},{type:"mc",q:"Which is the best quotation choice for Q2(d)?",options:['"curdled"','"By noon the sky over the bay had curdled into a bruised purple, and the wind began to prowl"','"the sky"','"By noon"'],a:0,why:"Short and precise lets you zoom in on the key word."},{type:"mc",q:'Which explanation of "curdled into a bruised purple" is strongest?',options:['"Curdled" suggests milk going sour and "bruised" suggests injury, so the sky looks sickly and hurt, warning that something violent is coming.',"This is a metaphor which makes the reader want to read on.","The writer uses good descriptive language here.","The sky is purple."],a:0,why:"It explains meaning, connotations and effect."},{type:"mc",q:'What is wrong with "this makes the reader want to read on"?',options:["It could be said about any phrase, so it explains nothing","It is too long","It uses the wrong device name","Nothing, it always gets marks"],a:0,why:"Generic comments score little. Be specific to the words."},{type:"order",q:"Put the analysis steps in order",items:r,why:"Quote, meaning, connotations, effect, overall impression."},{type:"blank",q:'The word "snarled" ___ an angry animal, which makes the sea seem ___ and out of control.',a:["suggests","threatening"],bank:["suggests","threatening","calm","says","pretty"],why:"Use analytical verbs like suggests, conveys, evokes."}]},W3:{name:"Question 2(d) in action",ex:[{type:"teach",title:"The 15-mark question",text:"You choose three words or phrases from each of two paragraphs, and you must include imagery. Spend about 25 minutes. Explain each choice separately, then sum up the overall effect of each paragraph."},{type:"spot",q:"Paragraph 1: tap a word in the image that makes the gulls seem helpless.",text:s("C",0),target:["pinned in place like paper cut-outs"],why:"Paper cut-outs are flat and weightless, at the mercy of the wind."},{type:"spot",q:"Paragraph 2: tap a word in the image that makes the rain seem like an invading army.",text:s("C",1),target:["a grey wall that marched"],why:'"Marched" suggests soldiers advancing in formation.'},{type:"spot",q:"Paragraph 2: tap a word in the image that makes the storm seem like a monster.",text:s("C",1),target:["swallowed the lighthouse whole","drag the whole town into its throat"],why:"Swallowing and throats make the storm a devouring creature."},{type:"multi",q:"Which THREE choices from paragraph 2 would make the strongest Q2(d) answer?",ref:"C",options:['"not falling but hurled"','"swallowed the lighthouse whole"','"lapped politely" contrasted with "reared and snarled"','"Then the rain arrived"','"In the caf\xe9"'],correct:[0,1,2],why:"Precise, rich choices with imagery."},{type:"mc",q:'What is the effect of "flickered, steadied, then died"?',options:["The lights are described like a dying person, ending the paragraph on a sense of death and helplessness","It shows the caf\xe9 has bad wiring","It is a list of things the writer saw","It makes the storm seem calm"],a:0,why:'"Died" personifies the lights and suggests the storm has won.'},{type:"mc",q:"What overall impression do the two paragraphs build?",options:["The storm is a violent, living force that overpowers the town","The town is ready for a pleasant day at the beach","The fishermen are careless","The storm is gentle and beautiful"],a:0,why:"End your answer with this kind of overview."}]},X1:{name:"Voice, format and bullets",ex:[{type:"teach",title:"Question 3",text:"You write as a character in a set format: a letter, report, journal, speech, interview or article. 15 marks are for reading (using and developing ideas from the text) and 10 for writing. Aim for 250 to 350 words."},{type:"teach",title:"What examiners reward",text:"Cover all three bullet points equally. Base every idea on the text, then develop it: explain feelings, reasons and consequences that the text implies. Don't invent wild new events, and don't copy whole sentences."},{type:"match",q:"Match each format to a feature",pairs:[["Letter",'Opens with "Dear\u2026" and has a suitable sign-off'],["Journal","Personal, reflective, first person"],["Speech","Addresses listeners directly"],["Report","Formal, factual, may use headings"],["Interview","Questions and answers between two voices"]]},{type:"mc",q:"You are writing as Amara's grandfather in a letter to the council. Which register is right?",options:["Formal and polite, but showing his feelings","Text speak with emojis","Very casual, like chatting to a friend","A list of bullet points"],a:0,why:"Match register to the reader: the council is formal."},{type:"mc",q:"Which sentence develops an idea from Text A instead of copying it?",options:['"For forty-one years the crossing has been my life; the bridge will save time, but it will take away the moments people share at sea."','"He had made the crossing for forty-one years."','"Suddenly the ferry was attacked by pirates."','"The ferry left at six."'],a:0,why:"It uses the text and develops the feeling behind it."},{type:"mc",q:"What happens if you only answer two of the three bullet points well?",options:["Your reading mark is limited","Nothing, two is enough","You get bonus marks for depth","The examiner marks the third for you"],a:0,why:"Give all three bullets roughly equal attention."}]},D1:{name:"Evaluating two texts",ex:[{type:"teach",title:"Section A: directed writing",text:"You read two texts with different views and write a speech, letter or article of 250 to 350 words. 15 marks are for reading: you must EVALUATE the ideas, not just repeat them. 25 marks are for writing."},{type:"teach",title:"Read both texts",text:"Text 1 argues for a total ban. Text 2 argues for teaching responsible use.",passage:"D1",passage2:"D2"},{type:"mc",q:"Which sentence evaluates rather than repeats?",options:["Text 1's survey sounds alarming, but checking a phone once is not the same as being distracted all lesson.","Text 1 says seven in ten pupils check their phones.","Text 2 says phones are tools, not toys.","Both texts talk about phones."],a:0,why:"Evaluation questions how strong the evidence or reasoning is."},{type:"multi",q:"Which are weaknesses in Text 1's argument? Select all that apply.",ref:"D1",options:['It claims parents "managed perfectly well" without evidence',"Its survey is from just one school","It mentions cyberbullying","It ignores the point that bans can be hidden from"],correct:[0,1,3],why:"Cyberbullying is a fair point, not a weakness."},{type:"mc",q:"Which is a strength of Text 2?",ref:"D2",options:["It admits the problems with phones before answering them","It uses lots of statistics","It agrees with a total ban","It never mentions bullying"],a:0,why:"Acknowledging the other side makes an argument more convincing."},{type:"mc",q:"What should your response do with ideas from both texts?",options:["Weigh them up and reach your own clear view","Copy the best sentences","Summarise each text in turn","Ignore the text you disagree with"],a:0,why:"Use, evaluate and develop ideas from both."}]},D2:{name:"Arguing and persuading",ex:[{type:"teach",title:"Persuasive techniques",text:"Use these to make your writing convincing, but always alongside reasoned points:",bullets:['Rhetorical questions: "Would you hand a toddler a chainsaw?"','Rule of three: "safer, calmer, kinder"','Direct address: "you", "we", "all of us"',"Anecdote: a short personal story","Facts and statistics, used fairly","Emotive language",'Counter-argument and rebuttal: "Some argue\u2026 however\u2026"']},{type:"match",q:"Match each example to its technique",pairs:[["Can we really call that progress?","Rhetorical question"],["quieter, safer and fairer","Rule of three"],["Some people argue that bans work. However\u2026","Counter-argument"],["Last year my cousin lost a whole term to his phone.","Anecdote"],["Picture a classroom where every head is down.","Imperative"]]},{type:"mc",q:"You are writing a speech for your school assembly. Which opening is best?",options:['"Good morning, everyone. Raise your hand if your phone has buzzed in the last hour."','"Dear Sir or Madam, I am writing to complain."','"Phones: a report."','"Once upon a time there was a phone."'],a:0,why:"Speech conventions: greet the audience and engage them."},{type:"order",q:"Put a strong argument structure in order",items:["Hook the audience and state your view","Your strongest point, with evidence from the texts","A second point, evaluating the other side","Counter-argument and rebuttal","A memorable conclusion with a call to action"],why:"A clear, logical route through your argument."},{type:"mc",q:"Which word is too informal for a speech to teachers and students?",options:["gonna","furthermore","undeniably","however"],a:0,why:'Examiners specifically flag slang like "gonna" and "kinda".'},{type:"mc",q:'What does "discursive" writing do?',options:["Explores both sides before reaching a balanced view","Tells a story","Describes a place","Only argues one side"],a:0,why:"Argumentative and persuasive writing take a clearer side."}]},C1:{name:"Descriptive writing",ex:[{type:"teach",title:"Describe, don't narrate",text:"A descriptive composition paints a place, a moment or a person. Keep plot to a minimum: if lots of things HAPPEN, it becomes a story and loses marks. Aim for 350 to 450 words."},{type:"teach",title:"Structure a description",text:"Give it a shape the reader can feel:",bullets:["Zoom: start wide, then focus on small details, then pull back","Time shift: the same place at dawn, at noon and at night","Senses: sight, sound, smell, touch and taste, not just sight","A final image that echoes the opening"]},{type:"mc",q:"Which sentence is the strongest description?",options:["Steam curled from the noodle stalls, carrying the sharp tang of ginger into the cold night air.","The market was very busy and nice.","There were lots of people and things at the market.","I went to the market and bought some food and then went home."],a:0,why:"Specific detail, precise verbs, two senses."},{type:"multi",q:'Which senses does this sentence use? "The metal railing was icy under my palm, and somewhere below a dog barked." Select all that apply.',options:["Touch","Sound","Smell","Taste"],correct:[0,1],why:"Icy (touch) and barked (sound)."},{type:"mc",q:"What is the main risk in a descriptive composition?",options:["Turning it into a story with lots of events","Using too many senses","Writing in the present tense","Using paragraphs"],a:0,why:"Descriptive tasks reward atmosphere, not plot."},{type:"mc",q:"Which is a strong way to end a description of a busy market?",options:["The last stall lowers its shutter, and the empty street holds the smell of ginger like a memory.","And then I woke up.","That was the market. The end.","I hope you enjoyed my description."],a:0,why:"A final image that echoes the start."},{type:"blank",q:"Good description appeals to the ___, uses precise ___ and avoids too much ___.",a:["senses","verbs","plot"],bank:["senses","verbs","plot","dialogue","headings"],why:"Senses, precise verbs, little plot."}]},C2:{name:"Narrative writing",ex:[{type:"teach",title:"Shape your story",text:"A narrative of 350 to 450 words needs a clear shape. Keep it small: one or two characters, one main setting, one central problem.",list:i},{type:"teach",title:"Openings and endings",text:'Try opening in the middle of the action, with dialogue, or with a striking detail. End with a twist, a cliffhanger, or a circular ending that returns to the opening image. Avoid "it was all a dream".'},{type:"order",q:"Put the parts of a story in order",items:i.map(e=>e.split(":")[0]),short:!0,why:"Exposition, rising action, climax, falling action, resolution."},{type:"mc",q:"Which line SHOWS rather than tells that a character is nervous?",options:["Her fingers kept straying to the clasp of her bag, opening it, closing it.","She was really nervous.","She felt nervous and scared.","Nervousness was what she felt."],a:0,why:"Show emotion through actions and details."},{type:"mc",q:"Which opening hooks the reader best?",options:['"Don\'t open it," said Gran, but the lid was already lifting.',"One day I woke up and had breakfast.","This is a story about a girl.","It was a normal day."],a:0,why:"It starts in the middle of the tension."},{type:"mc",q:'What did examiners criticise in weak "misunderstanding" stories?',options:["Ordinary problems resolved too quickly, with no real tension","Too much tension","Stories with only two characters","Using the past tense"],a:0,why:"Build consequences and jeopardy."},{type:"mc",q:"How can you increase tension at the climax?",options:["Use short sentences and slow the moment down with detail","Add more characters","Skip to the ending","Explain everything that will happen"],a:0,why:"Pace is a tool: short sentences speed the reader up."},{type:"mc",q:"Which ending is a circular ending?",options:["The story opens and closes with the same lit window, now dark","The character wakes up and it was all a dream","The story stops mid-sentence","A new character arrives in the last line"],a:0,why:"Returning to the opening image gives a satisfying shape."}]},A1:{name:"Punctuation power",ex:[{type:"teach",title:"The comma splice",text:"You cannot join two complete sentences with just a comma. Use a full stop, a semicolon, or a connective.",code:e("\u2717  The rain stopped, we went outside.","\u2713  The rain stopped. We went outside.","\u2713  The rain stopped; we went outside.","\u2713  The rain stopped, so we went outside.")},{type:"teach",title:"Semicolons, colons and apostrophes",text:'A semicolon joins two closely linked sentences. A colon introduces an explanation or a list. Apostrophes show missing letters (don\'t) or possession (the dog\'s bowl). "It\'s" always means "it is" or "it has".'},{type:"mc",q:"Which sentence is correctly punctuated?",options:["The storm was over; the town was silent.","The storm was over, the town was silent.","The storm was over the town, was silent.","The storm, was over; the town was silent."],a:0,why:"A semicolon can join two linked complete sentences."},{type:"mc",q:"Which is correct?",options:["The dog wagged its tail.","The dog wagged it's tail.","The dog wagged its' tail.","The dog wagged it is tail."],a:0,why:'"Its" (no apostrophe) shows possession.'},{type:"mc",q:"Which uses a colon correctly?",options:["She packed three things: a torch, a map and a knife.","She packed: three things a torch, a map and a knife.","She: packed three things.","She packed three things a torch: a map and a knife."],a:0,why:"A colon introduces the list."},{type:"mc",q:"Which speech punctuation is correct?",options:['"Run," she whispered.','"Run" she whispered.','"Run." she whispered.','Run, "she whispered."'],a:0,why:"Punctuation goes inside the speech marks, with a comma before the speech tag."},{type:"mc",q:"Which is correct?",options:["The students' results were posted.","The student's results were posted (meaning many students).","The students results' were posted.","The student's' results were posted."],a:0,why:"Plural possession: students'."},{type:"blank",q:'"I can\'t believe it\'s over," she said; the ___ apostrophe in "can\'t" shows a missing ___.',a:["first","letter"],bank:["first","letter","second","owner"],why:"Contraction apostrophes replace missing letters."}]},A2:{name:"Spelling traps",ex:[{type:"teach",title:"Homophones",text:"These sound the same but mean different things. Examiners notice them every time.",bullets:["their (belonging to them) \xb7 there (place) \xb7 they're (they are)","your (belonging to you) \xb7 you're (you are)","to \xb7 too (also, excessively) \xb7 two (2)","affect (verb: to influence) \xb7 effect (noun: a result)","then (time) \xb7 than (comparing)","lose (misplace) \xb7 loose (not tight)","practice (noun) \xb7 practise (verb) in British English"]},{type:"mc",q:"Choose the correct sentence.",options:["They're leaving their bags over there.","Their leaving there bags over they're.","There leaving they're bags over their.","They're leaving there bags over their."],a:0,why:"They are / belonging to them / place."},{type:"mc",q:'Choose the correct word: "The cold weather had a strange ___ on him."',options:["effect","affect"],a:0,why:"Noun = effect."},{type:"mc",q:'Choose the correct word: "She is taller ___ her brother."',options:["than","then"],a:0,why:"Comparing = than."},{type:"type",q:'Spell the word that means "certainly": d _ f _ n _ t _ l y',a:["definitely"],why:'Defin-ITE-ly: think "finite".'},{type:"type",q:'Spell the word meaning "needed": n _ c _ s s _ r y',a:["necessary"],why:"One Collar, two Sleeves: one c, two s."},{type:"type",q:'Spell the word meaning "apart, not together": s _ p _ r _ t e',a:["separate"],why:'There is "a rat" in sep-A-RAT-e.'},{type:"type",q:'Spell: the past tense of "occur".',a:["occurred"],why:"Double c, double r."},{type:"mc",q:"Which is spelled correctly?",options:["embarrassed","embarassed","embarrased","embarased"],a:0,why:"Double r, double s."}]},A3:{name:"Sentences that sing",ex:[{type:"teach",title:"Vary your sentences",text:"High marks for style come from controlled variety: short sentences for impact, longer ones for flow, and different ways to start.",bullets:["Simple: The door creaked.","Compound: The door creaked, and the hall fell silent.","Complex: Although the door creaked, nobody turned round.","Minor (for effect): Silence.","Openers: an -ing verb, an adverb, a place, a sound"]},{type:"match",q:"Match each sentence to its type",pairs:[["Silence.","Minor sentence"],["The bell rang.","Simple sentence"],["The bell rang, and everyone ran.","Compound sentence"],["When the bell rang, everyone ran.","Complex sentence"]]},{type:"mc",q:'Which opener adds the most variety to a paragraph where every sentence starts with "I"?',options:["Trembling, I reached for the handle.","I reached for the handle.","I was trembling as I reached for the handle.","I then reached for the handle."],a:0,why:"An -ing opener changes the rhythm."},{type:"mc",q:'Why might a writer use a one-word paragraph like "Gone."?',options:["To create impact and make a moment stand out","Because they ran out of time","To show the story is finished","It is always a mistake"],a:0,why:"Used once, deliberately, it hits hard."},{type:"blank",q:"___ the lights went out, the room fell silent. ___, a match flared in the dark.",a:["As","Then"],bank:["As","Then","But","And"],why:"Varied connectives link ideas smoothly."},{type:"mc",q:"Which version builds tension best?",options:["The footsteps stopped. Outside the door. Waiting.","The footsteps stopped outside the door and waited there for a while.","There were footsteps that stopped at the door.","Footsteps stopped. They were at the door. They waited outside the door for a while and then waited more."],a:0,why:"Short, fragmented sentences slow the moment and build suspense."}]},V1:{name:"Ambitious vocabulary",ex:[{type:"teach",title:"Precise beats fancy",text:"The best word is the most precise one, not the longest. Swap vague words like good, nice, bad, big, walked and said for words that show exactly what you mean."},{type:"match",q:"Match each bland word to a more precise choice",pairs:[["walked slowly","trudged"],["said quietly","murmured"],["very big","colossal"],["very sad","despondent"],["very happy","elated"]]},{type:"mc",q:"Which verb best shows a tired, unwilling movement?",options:["trudged","skipped","sprinted","strolled"],a:0,why:"Trudge suggests heavy, weary steps."},{type:"mc",q:'Which word means "calm and peaceful"?',options:["serene","ominous","frantic","sombre"],a:0,why:"Serene: calm and untroubled."},{type:"mc",q:'Which word means "suggesting something bad will happen"?',options:["ominous","luminous","jubilant","pristine"],a:0,why:"Ominous: threatening."},{type:"mc",q:'"The house was old and falling apart." Which single word replaces "old and falling apart"?',options:["dilapidated","opulent","pristine","vibrant"],a:0,why:"Dilapidated: in ruin through neglect."},{type:"mc",q:"Which word describes a harsh mix of loud sounds?",options:["cacophony","melody","whisper","serenity"],a:0,why:"Cacophony: a loud, unpleasant mixture of sounds."}]},V2:{name:"Words for analysis",ex:[{type:"teach",title:'Better than "shows"',text:"Use precise verbs to explain effects. Each says something slightly different:",bullets:["suggests / implies: hints at a meaning","conveys: gets across a feeling or idea","evokes: brings a picture or emotion to mind","emphasises: makes something stand out","connotes: carries associations","foreshadows: hints at what will happen later","contrasts with: shows difference"]},{type:"mc",q:"Which sentence analyses most precisely?",options:['"Snarled" evokes a vicious animal, conveying the sea\'s hostility.',"This shows the sea is bad.","This quote is good.","The writer uses words."],a:0,why:"Precise verbs, specific word, clear effect."},{type:"blank",q:"The dark clouds ___ the danger that will arrive later in the story.",a:["foreshadow"],bank:["foreshadow","emphasise","imply","contrast"],why:"Hinting at future events = foreshadowing."},{type:"mc",q:'What does "connotations" mean?',options:["The ideas and feelings a word carries beyond its literal meaning","The dictionary definition of a word","The number of syllables in a word","A list of synonyms"],a:0,why:'E.g. "home" connotes safety and warmth.'},{type:"mc",q:"Which is the best way to begin explaining an image?",options:['The image of the rain as "a grey wall" suggests\u2026',"The writer uses a metaphor.","In paragraph two there is a quote.","This makes the reader want to read on."],a:0,why:"Name the image, quote it, and move straight into meaning."}]}},h=[{id:"p1",tab:"Paper 1",title:"Reading",units:[{topic:"P1",title:"Paper 1 at a glance",sub:"Questions, marks and timing",lessons:["K1"],guide:n.concat(["Q1(f) summary: no more than 120 words","Q3: 250 to 350 words, 15 reading + 10 writing marks"])},{topic:"Q1",title:"Comprehension",sub:"Explicit meaning and inference",lessons:["R1","R2"],guide:["Look only at the lines the question points to","Marks = number of points needed",'"In your own words" means change the key words',"Inference: explain what a detail suggests about feelings or attitudes"]},{topic:"Q1f",title:"Summary",sub:"Select, cut, condense",lessons:["S1","S2"],guide:o.concat(["10 marks for relevant points, 5 for writing","No introduction, opinions, quotations or examples"])},{topic:"Q2",title:"Words in context",sub:"Questions 2(a) and 2(b)",lessons:["R3"],guide:["2(a): copy only the precise word or short phrase","2(b): explain in your own words; it should fit back into the sentence","Use the context to work out unfamiliar words"]},{topic:"Q2d",title:"Writer's effects",sub:"Language analysis for 15 marks",lessons:["W1","W2","W3"],guide:r.concat(["Three choices from each of two paragraphs, including imagery",'Avoid "this makes the reader want to read on"',"Finish each paragraph with the overall impression"])},{topic:"Q3",title:"Extended response",sub:"Writing as a character",lessons:["X1"],guide:["250 to 350 words; 15 reading + 10 writing","Cover all three bullet points equally","Use and develop ideas from the text; don't invent wild events","Match the format and register to the reader"]}]},{id:"p2",tab:"Paper 2",title:"Writing",units:[{topic:"A",title:"Directed writing",sub:"Evaluate two texts, argue a view",lessons:["D1","D2"],guide:["250 to 350 words; 15 reading + 25 writing marks","Evaluate the ideas in both texts, don't just repeat them","Give your own clear view based on what you read","Speech, letter or article: use the right conventions",'Avoid slang like "gonna" and "kinda"']},{topic:"B",title:"Composition",sub:"Descriptive and narrative writing",lessons:["C1","C2"],guide:["Choose one of four titles: two descriptive, two narrative","350 to 450 words; marked on content and structure (16) and style and accuracy (24)","Description: senses, atmosphere, little plot","Narrative: clear shape, tension, believable characters","Plan for 5 minutes before you write"]},{topic:"\u2713",title:"Accuracy and style",sub:"Punctuation, spelling, sentences",lessons:["A1","A2","A3"],guide:["No comma splices: use a full stop, semicolon or connective","its = belonging to it; it's = it is","their / there / they're; affect / effect; then / than","Vary sentence length and openings"]},{topic:"Aa",title:"Vocabulary",sub:"Precise words for writing and analysis",lessons:["V1","V2"],guide:["Precise beats long: trudged, murmured, colossal","Analysis verbs: suggests, conveys, evokes, emphasises, connotes","Explain connotations, not just definitions"]}]}],c={sight:"Sight",sound:"Sound",move:"Movement",mood:"Mood",feel:"Feelings and character",argue:"Argument",analyse:"Analysis"},d=[{w:"luminous",c:"sight",m:"giving off a soft, bright light",e:"The jellyfish drifted past, luminous against the black water."},{w:"gaunt",c:"sight",m:"very thin and bony, usually from illness, hunger or worry",e:"After the long winter his face was gaunt, the cheekbones sharp as blades."},{w:"dilapidated",c:"sight",m:"falling apart because of age or neglect",e:"A dilapidated shed leaned against the fence as if it were too tired to stand."},{w:"pristine",c:"sight",m:"perfectly clean and untouched, as if new",e:"Fresh snow lay pristine across the playing field before the first footprints arrived."},{w:"vibrant",c:"sight",m:"bright, bold and full of life",e:"The mural was vibrant with oranges and purples that seemed to hum in the sunlight."},{w:"opulent",c:"sight",m:"rich, luxurious and expensive-looking",e:"Gold taps and velvet curtains made the hotel bathroom ridiculously opulent."},{w:"desolate",c:"sight",m:"empty, bleak and lonely",e:"Beyond the last house the road ran on through a desolate plain of rocks and dust."},{w:"ethereal",c:"sight",m:"delicate and light, almost too perfect for this world",e:"Mist turned the morning lake ethereal, the far shore floating like a dream."},{w:"gnarled",c:"sight",m:"twisted and knobbly with age",e:"The fisherman mended the net with gnarled, patient fingers."},{w:"translucent",c:"sight",m:"allowing light through, but not completely clear",e:"Light glowed through the translucent paper lanterns strung above the street."},{w:"cacophony",c:"sound",m:"a harsh, jumbled mixture of loud sounds",e:"Car horns, sirens and shouting traders blended into a cacophony that made my head ache."},{w:"reverberate",c:"sound",m:"to echo again and again",e:"Her footsteps reverberated through the empty sports hall."},{w:"shrill",c:"sound",m:"high-pitched and piercing",e:"A shrill whistle cut through the chatter and the whole pitch fell still."},{w:"guttural",c:"sound",m:"deep and harsh, as if from the back of the throat",e:"The dog gave a low, guttural growl that froze us at the gate."},{w:"resonant",c:"sound",m:"deep, rich and continuing to sound",e:"The cathedral bell was so resonant that the windows seemed to hum with it."},{w:"muffled",c:"sound",m:"quietened or made unclear, as if covered",e:"Muffled voices came through the wall, too soft to make out the words."},{w:"clamour",c:"sound",m:"a loud, confused noise, often of people demanding something",e:"The clamour of the crowd grew as the gates stayed shut."},{w:"hushed",c:"sound",m:"very quiet, often out of respect or tension",e:"The audience waited in hushed silence for the final name to be read out."},{w:"trudge",c:"move",m:"to walk slowly and heavily, as if tired",e:"We trudged up the hill, our boots heavy with mud."},{w:"saunter",c:"move",m:"to walk in a slow, relaxed, unhurried way",e:"He sauntered into the exam hall as if he had all the time in the world."},{w:"scurry",c:"move",m:"to move quickly with short, hurried steps",e:"Mice scurried across the kitchen floor the moment the light went off."},{w:"lurch",c:"move",m:"to make a sudden, unsteady movement",e:"The bus lurched forward and my coffee slopped across my sleeve."},{w:"meander",c:"move",m:"to wander slowly with many turns",e:"The river meandered through the valley, in no hurry to reach the sea."},{w:"plummet",c:"move",m:"to fall very fast and steeply",e:"The kite caught a gust, spun, and plummeted into the trees."},{w:"recoil",c:"move",m:"to jump or pull back suddenly in fear or disgust",e:"She recoiled as the spider dropped from the shelf onto her book."},{w:"hurtle",c:"move",m:"to move at great speed, often out of control",e:"The sledge hurtled down the slope towards the frozen pond."},{w:"stagger",c:"move",m:"to walk unsteadily, almost falling",e:"The runner staggered across the line and collapsed onto the grass."},{w:"glide",c:"move",m:"to move smoothly and silently",e:"A heron glided low over the reeds without a single beat of its wings."},{w:"ominous",c:"mood",m:"suggesting that something bad is about to happen",e:"An ominous silence settled over the house just before the lights failed."},{w:"serene",c:"mood",m:"calm, peaceful and untroubled",e:"Even with the exam an hour away, her face was serene."},{w:"sombre",c:"mood",m:"dark, serious and sad",e:"The sombre music made the whole hall fall still."},{w:"foreboding",c:"mood",m:"a strong feeling that something bad will happen",e:"A sense of foreboding crept over him as the phone kept ringing."},{w:"melancholy",c:"mood",m:"a deep, thoughtful sadness",e:"There is a melancholy beauty to a seaside town in winter."},{w:"eerie",c:"mood",m:"strange and frightening in a mysterious way",e:"The empty playground was eerie in the fog, one swing still moving."},{w:"tranquil",c:"mood",m:"quiet, still and peaceful",e:"At dawn the harbour was tranquil, the boats barely rocking."},{w:"oppressive",c:"mood",m:"heavy and uncomfortable, making it hard to breathe or relax",e:"The heat was oppressive, pressing down on the town like a lid."},{w:"idyllic",c:"mood",m:"extremely happy, peaceful and picturesque",e:"The village looked idyllic on the postcard, all blossom and blue sky."},{w:"bleak",c:"mood",m:"cold, bare and without hope or comfort",e:"The moor was bleak in November, grey on grey as far as you could see."},{w:"despondent",c:"feel",m:"low in spirits, having lost hope",e:"After the third rejection letter he was too despondent to open the fourth."},{w:"elated",c:"feel",m:"extremely happy and excited",e:"She was elated when her name appeared at the top of the list."},{w:"apprehensive",c:"feel",m:"anxious that something bad might happen",e:"I was apprehensive as I knocked on the head teacher's door."},{w:"indignant",c:"feel",m:"angry because something seems unfair",e:"The players were indignant when the goal was disallowed."},{w:"resilient",c:"feel",m:"able to recover quickly from difficulties",e:"The town proved resilient, rebuilding the harbour within a year."},{w:"wistful",c:"feel",m:"sadly longing for something in the past or out of reach",e:"Grandad gave a wistful smile as he looked at the old photograph."},{w:"aloof",c:"feel",m:"cool and distant; not friendly or involved",e:"The new student seemed aloof, but she was really just shy."},{w:"meticulous",c:"feel",m:"very careful and precise about every detail",e:"His notes were meticulous, every heading underlined twice."},{w:"impetuous",c:"feel",m:"acting quickly without thinking first",e:"In an impetuous moment she quit the team, and regretted it by dinner time."},{w:"nonchalant",c:"feel",m:"calm and relaxed, seeming not to care",e:"He gave a nonchalant shrug, though his hands were shaking."},{w:"compelling",c:"argue",m:"so convincing that it is hard to disagree",e:"The second writer makes a compelling case for teaching responsible use."},{w:"contentious",c:"argue",m:"likely to cause disagreement or argument",e:"School uniform remains a contentious issue among students and parents."},{w:"detrimental",c:"argue",m:"causing harm or damage",e:"Too little sleep is detrimental to concentration."},{w:"crucial",c:"argue",m:"extremely important; decisive",e:"Clean water is crucial to the health of the whole village."},{w:"undeniably",c:"argue",m:"in a way that cannot be argued with",e:"Phones are undeniably useful in an emergency."},{w:"consequently",c:"argue",m:"as a result",e:"The bridge will cut the journey to six minutes; consequently, the ferry will close."},{w:"nevertheless",c:"argue",m:"in spite of that; however",e:"Green roofs are expensive. Nevertheless, their benefits are hard to ignore."},{w:"furthermore",c:"argue",m:"in addition; also (to add a further point)",e:"Furthermore, a ban would be almost impossible to enforce."},{w:"alleviate",c:"argue",m:"to make a problem or pain less severe",e:"Planting trees can alleviate the heat in crowded city streets."},{w:"advocate",c:"argue",m:"to publicly support or recommend",e:"Many doctors advocate a screen-free hour before bed."},{w:"evokes",c:"analyse",m:"brings a feeling, memory or image to mind",e:'"Snarled" evokes a vicious animal ready to attack.'},{w:"connotes",c:"analyse",m:"carries extra ideas or associations beyond the literal meaning",e:'"Bruised" connotes injury, suggesting the sky has been hurt.'},{w:"juxtaposes",c:"analyse",m:"places two contrasting things side by side for effect",e:"The writer juxtaposes the polite sea with the snarling one to show how fast it changed."},{w:"foreshadows",c:"analyse",m:"hints at something that will happen later",e:"The flickering lights foreshadow the darkness that is coming."}],u=[{s:"Her voice was as thin as paper.",d:"Simile"},{s:"The crowd moved like a slow grey river towards the gates.",d:"Simile"},{s:"He ran through the corridor like a startled deer.",d:"Simile"},{s:"The classroom was a zoo by the end of lunch.",d:"Metaphor",x:["Hyperbole"]},{s:"Grief was a heavy coat she could not take off.",d:"Metaphor"},{s:"His words were knives.",d:"Metaphor"},{s:"The old stairs groaned under every step.",d:"Personification",x:["Onomatopoeia"]},{s:"Hunger gnawed at the town all winter.",d:"Personification"},{s:"The kettle grumbled to itself in the corner.",d:"Personification"},{s:"Pale pink petals piled up on the path.",d:"Alliteration",x:["Sibilance"]},{s:"The big brown boat bobbed in the bay.",d:"Alliteration",x:["Sibilance"]},{s:"The fire crackled and hissed in the grate.",d:"Onomatopoeia",x:["Sibilance","Personification"]},{s:"Bang! The door slammed shut behind us.",d:"Onomatopoeia",x:["Imperative"]},{s:"Somewhere a tap went drip, drip, drip.",d:"Onomatopoeia",x:["Repetition","Rule of three"]},{s:"I have told you a million times to shut the gate.",d:"Hyperbole"},{s:"This bag weighs a tonne.",d:"Hyperbole",x:["Metaphor"]},{s:"The queue was so long it reached the next town.",d:"Hyperbole"},{s:"Who would not want cleaner air for their children?",d:"Rhetorical question",x:["Emotive language","Direct address"]},{s:"Is this really the best our town can do?",d:"Rhetorical question",x:["Direct address"]},{s:"The streets were cold, quiet and empty.",d:"Rule of three"},{s:"We want schools that are safer, fairer and kinder.",d:"Rule of three",x:["Direct address"]},{s:"On the morning of her wedding, the sun burst through and the whole valley glowed.",d:"Pathetic fallacy",x:["Personification","Hyperbole"]},{s:"As the villain stepped inside, thunder rolled across the hills.",d:"Pathetic fallacy",x:["Onomatopoeia"]},{s:"A deafening silence filled the hall.",d:"Oxymoron",x:["Hyperbole"]},{s:"It was a bittersweet goodbye.",d:"Oxymoron"},{s:"Outside the gleaming hotel, a man slept on cardboard.",d:"Juxtaposition"},{s:"The baby laughed in the middle of the ruined street.",d:"Juxtaposition"},{s:"Silent, sleepless, she sat beside the sea.",d:"Sibilance",x:["Alliteration","Rule of three"]},{s:"The snake slid slowly through the soft sand.",d:"Sibilance",x:["Alliteration"]},{s:"Picture a world without plastic.",d:"Imperative",x:["Direct address"]},{s:"Close your eyes and imagine the sea.",d:"Imperative",x:["Direct address"]},{s:"You deserve better, and deep down you know it.",d:"Direct address"},{s:"Every one of you in this hall can make a difference.",d:"Direct address"},{s:"Again and again and again, the waves came.",d:"Repetition",x:["Rule of three"]},{s:"Nobody listened. Nobody cared. Nobody came.",d:"Repetition",x:["Rule of three","Emotive language"]},{s:"Innocent, defenceless animals are left to suffer in filthy cages.",d:"Emotive language"},{s:"Heartbroken families wait for news that may never come.",d:"Emotive language"}],p=[["Simile",'Compares one thing to another using "like" or "as".',"gulls pinned in place like paper cut-outs","Say what the two things share and what that suggests."],["Metaphor","Says one thing IS another, to transfer its qualities.","the rain was a grey wall","Explain which qualities carry across (solid, impossible to see through)."],["Personification","Gives human or animal qualities to something non-living.","the wind began to prowl","Explain what the behaviour suggests about the thing's mood or threat."],["Pathetic fallacy","Weather or setting reflects a mood or foreshadows events.","a bruised purple sky before disaster","Link the weather to the feeling or what is coming."],["Alliteration","Repeated consonant sounds at the start of nearby words.","wild winter wind","Say what the sound does: harsh, soft, rhythmic, memorable."],["Sibilance",'Repeated "s" or "sh" sounds.',"the sea sighed and shifted","Often creates a hushed, sinister or soothing sound."],["Onomatopoeia","A word that sounds like what it describes.","the fire crackled","Explain how it makes the scene vivid and immediate."],["Hyperbole","Deliberate exaggeration for effect.","I've told you a million times","Explain the emotion it emphasises: frustration, wonder, humour."],["Oxymoron","Two contradictory words side by side.","deafening silence","Explain the tension or complexity it captures."],["Juxtaposition","Two contrasting ideas placed close together.","lapped politely \u2026 reared and snarled","Explain what the contrast highlights."],["Rhetorical question","A question asked for effect, not an answer.","Is this really the best we can do?","It involves the reader and pushes them towards the writer's view."],["Rule of three","A list of three for rhythm and emphasis.","safer, fairer and kinder","Makes the point sound complete and memorable."],["Direct address",'Speaks to the reader or audience as "you" or "we".',"every one of you in this hall","Creates a personal connection and responsibility."],["Imperative","A command verb.","Picture a classroom where every head is down.","Pushes the audience to act or imagine."],["Repetition","Repeating a word or structure for emphasis.","Nobody listened. Nobody cared.","Hammers the idea home and builds rhythm."],["Emotive language","Words chosen to stir strong feelings.","innocent, defenceless animals","Explain the feeling it targets and why that persuades."]],m=[["Adding","furthermore, moreover, in addition, what is more"],["Contrasting","however, nevertheless, on the other hand, whereas, yet"],["Cause and effect","consequently, as a result, therefore, so, because of this"],["Conceding","admittedly, although, it is true that, granted"],["Emphasising","above all, most importantly, undeniably, crucially"],["Concluding","ultimately, in conclusion, overall, to sum up"]],g=[["Full stop","Ends a complete sentence. Never join two sentences with only a comma."],["Comma","Separates items in a list, clauses after a connective, and an opening phrase from the main clause."],["Semicolon ;","Joins two closely linked complete sentences: The storm passed; the town was silent."],["Colon :","Introduces a list, explanation or reveal: She had one aim: to win."],["Dash \u2013","Adds an aside or a dramatic pause \u2013 used sparingly."],["Apostrophe","Missing letters (don't) or possession (the boy's bag, the boys' bags). its = belonging to it."],["Speech marks",'"Run," she whispered. New speaker, new line. Punctuation goes inside the marks.'],["Question and exclamation marks","Use exclamation marks rarely. One per piece is plenty."]],w=[{paper:"Paper 1 \xb7 Reading \xb7 2 hours \xb7 80 marks",rows:[["Q1(a)\u2013(e)","Short answers on Text A","15","15 min",'One point per mark; "own words" means change the key words'],["Q1(f)","Summary of Text B","15","25 min","No more than 120 words, own words, continuous sentences"],["Q2(a)\u2013(c)","Words and phrases in Text C","10","15 min","Copy only the precise word for (a); explain in own words for (b)"],["Q2(d)","Language analysis of Text C","15","25 min","Three choices from each of two paragraphs, include imagery"],["Q3","Extended response to Text C","25
