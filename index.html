ture a world without plastic.",d:"Imperative",x:["Direct address"]},{s:"Close your eyes and imagine the sea.",d:"Imperative",x:["Direct address"]},{s:"You deserve better, and deep down you know it.",d:"Direct address"},{s:"Every one of you in this hall can make a difference.",d:"Direct address"},{s:"Again and again and again, the waves came.",d:"Repetition",x:["Rule of three"]},{s:"Nobody listened. Nobody cared. Nobody came.",d:"Repetition",x:["Rule of three","Emotive language"]},{s:"Innocent, defenceless animals are left to suffer in filthy cages.",d:"Emotive language"},{s:"Heartbroken families wait for news that may never come.",d:"Emotive language"}],p=[["Simile",'Compares one thing to another using "like" or "as".',"gulls pinned in place like paper cut-outs","Say what the two things share and what that suggests."],["Metaphor","Says one thing IS another, to transfer its qualities.","the rain was a grey wall","Explain which qualities carry across (solid, impossible to see through)."],["Personification","Gives human or animal qualities to something non-living.","the wind began to prowl","Explain what the behaviour suggests about the thing's mood or threat."],["Pathetic fallacy","Weather or setting reflects a mood or foreshadows events.","a bruised purple sky before disaster","Link the weather to the feeling or what is coming."],["Alliteration","Repeated consonant sounds at the start of nearby words.","wild winter wind","Say what the sound does: harsh, soft, rhythmic, memorable."],["Sibilance",'Repeated "s" or "sh" sounds.',"the sea sighed and shifted","Often creates a hushed, sinister or soothing sound."],["Onomatopoeia","A word that sounds like what it describes.","the fire crackled","Explain how it makes the scene vivid and immediate."],["Hyperbole","Deliberate exaggeration for effect.","I've told you a million times","Explain the emotion it emphasises: frustration, wonder, humour."],["Oxymoron","Two contradictory words side by side.","deafening silence","Explain the tension or complexity it captures."],["Juxtaposition","Two contrasting ideas placed close together.","lapped politely \u2026 reared and snarled","Explain what the contrast highlights."],["Rhetorical question","A question asked for effect, not an answer.","Is this really the best we can do?","It involves the reader and pushes them towards the writer's view."],["Rule of three","A list of three for rhythm and emphasis.","safer, fairer and kinder","Makes the point sound complete and memorable."],["Direct address",'Speaks to the reader or audience as "you" or "we".',"every one of you in this hall","Creates a personal connection and responsibility."],["Imperative","A command verb.","Picture a classroom where every head is down.","Pushes the audience to act or imagine."],["Repetition","Repeating a word or structure for emphasis.","Nobody listened. Nobody cared.","Hammers the idea home and builds rhythm."],["Emotive language","Words chosen to stir strong feelings.","innocent, defenceless animals","Explain the feeling it targets and why that persuades."],["Extended metaphor","A metaphor developed across several lines or a whole passage.","the storm prowls, snarls, then swallows the lighthouse","Show how the comparison builds one consistent impression."],["Symbolism","An object, colour or image that stands for a bigger idea.","a single candle left burning in the window","Say what it represents (hope, loss, danger) and why it fits."],["Semantic field","A group of words from the same topic.","marched, wall, invading: words of war","Show how the words work together to build one impression."],["Plosives","Hard b, p, t, d, k sounds.","the bitter wind bit and battered the boats","Usually harsh, violent or abrupt: link the sound to the action."],["Assonance","Repeated vowel sounds in nearby words.","the low moan of the old road","Can slow the pace and sound mournful or dreamy."],["Listing","Several items in a row.","horns, sirens, shouting traders, barking dogs","Builds up a sense of abundance, chaos or pressure."],["Short sentence","A brief sentence, often after longer ones.","Somewhere a window shattered.","Creates impact, shock or tension: the moment stands out."],["Ellipsis","Three dots showing an unfinished thought or pause.","She read the first line, and\u2026","Creates suspense or hesitation by leaving something unsaid."],["Foreshadowing","An early hint of what will happen later.","a sky curdled into a bruised purple","Explain what it hints at and how it builds unease."],["Cyclical structure","The ending returns to the image or idea of the opening.","a story that opens and closes at the same window","Gives a sense of completion, or shows how much has changed."]],m=[["Adding","furthermore, moreover, in addition, what is more"],["Contrasting","however, nevertheless, on the other hand, whereas, yet"],["Cause and effect","consequently, as a result, therefore, so, because of this"],["Conceding","admittedly, although, it is true that, granted"],["Emphasising","above all, most importantly, undeniably, crucially"],["Concluding","ultimately, in conclusion, overall, to sum up"]],g=[["Full stop","Ends a complete sentence. Never join two sentences with only a comma."],["Comma","Separates items in a list, clauses after a connective, and an opening phrase from the main clause."],["Semicolon ;","Joins two closely linked complete sentences: The storm passed; the town was silent."],["Colon :","Introduces a list, explanation or reveal: She had one aim: to win."],["Dash \u2013","Adds an aside or a dramatic pause \u2013 used sparingly."],["Apostrophe","Missing letters (don't) or possession (the boy's bag, the boys' bags). its = belonging to it."],["Speech marks",'"Run," she whispered. New speaker, new line. Punctuation goes inside the marks.'],["Question and exclamation marks","Use exclamation marks rarely. One per piece is plenty."]],w=[{paper:"Paper 1 \xb7 Reading \xb7 2 hours \xb7 80 marks",rows:[["Q1(a)\u2013(e)","Short answers on Text A","15","15 little",infront:"in front",aswell:"as well",everytime:"every time",noone:"no one",thru:"through",tho:"though",freind:"friend",freinds:"friends",calender:"calendar",rythm:"rhythm",independant:"independent",persue:"pursue",priviledge:"privilege",relevent:"relevant",rember:"remember",remeber:"remember",wether:"whether",wheather:"whether",disapear:"disappear",disapeared:"disappeared",dissapear:"disappear",dissapeared:"disappeared",exagerate:"exaggerate",grammer:"grammar",harrass:"harass",millenium:"millennium",mischievious:"mischievous",noticable:"noticeable",posession:"possession",reccomend:"recommend",recomend:"recommend",tounge:"tongue",vaccum:"vacuum",withold:"withhold",wonderous:"wondrous"},k=[[/\b(could|should|would|must|might) of\b/gi,'"$1 have", not "$1 of"'],[/\btheir (is|are|was|were)\b/gi,'Did you mean "there $1"?'],[/\bthere (own|house|home|parents|friends|bags|phones|books)\b/gi,'Did you mean "their $1"?'],[/\byour (welcome|right|wrong|going|not)\b/gi,'Did you mean "you\'re $1"?'],[/\bits (a|the|been|not|going|time|raining|over)\b/gi,'Did you mean "it\'s $1"?'],[/\bit's (own|tail|head|wings|shape|colour|color|eyes|roof|walls)\b/gi,'Did you mean "its $1" (belonging to it)?'],[/\bthen (me|him|her|them|us|you|ever|before|expected|usual)\b/gi,'Comparing? Use "than $1".'],[/\b(more|less|better|worse|bigger|smaller|faster|slower|rather|other) then\b/gi,'Comparing? Use "$1 than".'],[/\b(the|an|a|no|big|huge) affect\b/gi,'As a noun it is "effect".'],[/\b(to|will|can|could|would|might) effect\b/gi,'As a verb it is usually "affect".'],[/\bloose (my|your|his|her|the|their|our|it|them|track|weight)\b/gi,'Did you mean "lose $1"?']],v=new Set(["the","a","an"]),x=new Set("the a an and or but so of to in on at by for with from as is was were are be been being it its this that these those i me my we our you your he him his she her they them their there here then than not no yes do did does have has had will would can could should may might must just also very really into on
