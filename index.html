utine and caring for the boat while he still can. Running his thumb over the bell shows he is trying to fix it in his memory because he will miss it. His overly loud laugh suggests he is covering up how upset he really is."},{id:"sa4",ref:"A",part:"Q1(d)",marks:2,q:'What does the grandfather mean when he tells the boy that "bridges could not see dolphins"?',points:[{t:"The slow ferry crossing lets people notice nature and wildlife",k:["nature","wildlife","notice","animal","spot","watch","observe","slow"]},{t:"The fast bridge journey means people will rush past and miss such experiences",k:["miss","lose","rush","experience","beaut","fast","quick"]}],model:"He means that the slow ferry crossing allows people to notice the natural world around them, whereas the quick bridge journey will mean they rush past and miss moments like this."},{id:"sa5",ref:"A",part:"Q1(e)",marks:2,q:"How does the final paragraph prove the grandfather's point?",points:[{t:"Dolphins appear beside the ferry when he slows down",k:["dolphin"]},{t:"The passengers look up from their phones and notice them for once",k:["phone","look+up","looked+up","notice","attention"]}],model:"When he slows the ferry, three dolphins appear, and the passengers, who had been staring at their phones, finally look up and notice them."},{id:"sa6",ref:"B",part:"Q1",marks:2,q:"Identify two drawbacks of rooftop gardens mentioned in paragraph 4 of Text B.",points:[{t:"They are heavy, so older buildings may need costly strengthening",k:["heavy","weigh","strength","structur","reinforc"]},{t:"They cost money to maintain",k:["maintain","maintenance","upkeep","looking after"]},{t:"If neglected, they can become an eyesore",k:["eyesore","ugly","neglect","messy","unattractive"]}],model:"They are heavy when soaked, so older buildings may need expensive strengthening, and they cost money to maintain."},{id:"sa7",ref:"C",part:"Q2(a)",marks:1,q:"Identify a word or phrase from paragraph 1 of Text C which suggests that the fishermen are grimly determined.",points:[{t:'"their faces set like stone"',k:["stone"]}],model:"their faces set like stone"},{id:"sa8",ref:"C",part:"Q2(b)",marks:3,q:'Using your own words, explain what the writer means by each of these words from Text C: (i) "worrying at" the tarpaulins (ii) the gusts "flung" the gulls (iii) the sea "reared".',points:[{t:"(i) pulling or tugging at again and again",k:["tug","pull","yank","pick","jerk","tear","grab","snatch"]},{t:"(ii) threw them violently or with great force",k:["threw","throw","toss","hurl","forc","push","blew","blown","sent"]},{t:"(iii) rose up high, like an animal on its back legs",k:["rose","rise","rising","lift","stood","stand","tower","surg"]}],model:"(i) repeatedly tugging and pulling at (ii) threw them violently (iii) rose up high, like an animal standing on its back legs"},{id:"sa9",ref:"C",part:"Q2(c)",marks:3,q:'Explain how the writer conveys the change in the sea in this sentence: "The sea, which an hour earlier had lapped politely at the jetty, now reared and snarled".',points:[{t:'"lapped politely": the sea was calm, gentle and well-behaved',k:["calm","gentle","polite","well behaved","peaceful","tame","quiet","soft"]},{t:'"reared and snarled": the sea is like a vicious, angry animal',k:["animal","beast","predator","dog","wolf","horse","vicious","aggress","angry","hostile","wild"]},{t:"The contrast shows how suddenly and completely it has become dangerous",k:["contrast","change","transform","juxtapos","sudden","danger","threat"]}],model:'"Lapped politely" makes the sea sound gentle and well-mannered, almost tame. By contrast, "reared and snarled" turns it into a vicious animal rising up to attack. Placing the two side by side shows how suddenly and completely the sea has become dangerous.'}],A=["Reading","Writing"],I=["Content and structure","Style and accuracy"],C=[{t:"Precise, ambitious vocabulary, with few weak words like nice, good or very",w:6,sec:1,auto:"vocab"},{t:"Varied sentence lengths and openings",w:6,sec:1,auto:"variety"},{t:"Accurate spelling",w:4,sec:1,auto:"spell"},{t:"Accurate punctuation, including speech marks and no comma splices",w:4,sec:1,auto:"punct"},{t:"Consistent tense and fluent, well-linked paragraphs",w:4,sec:1}],S=[{t:"Stays descriptive: atmosphere and detail, very little plot",w:4,sec:0},{t:"A clear structure, such as zooming in, a time shift or moving through a place",w:4,sec:0},{t:"Detail from several senses, not just sight",w:4,sec:0,auto:"senses"},{t:"A striking opening and a final image that ends it well",w:4,sec:0}].concat(C),q=[{t:"A clear story shape: opening, rising tension, climax and ending",w:4,sec:0},{t:"Believable characters, shown through actions and dialogue",w:4,sec:0,auto:"dialogue"},{t:"Tension and pace controlled, with short sentences at key moments",w:4,sec:0,auto:"short"},{t:'A satisfying ending (not "it was all a dream")',w:4,sec:0,auto:"nodream"}].concat(C),M=[{id:"sum",kind:"summary",paper:"p1",label:"Q1(f) Summary",title:"The benefits of rooftop gardens",marks:15,minutes:25,words:[80,120],ref:["B"],secs:["Reading","Writing"],prompt:"According to Text B, what are the benefits of rooftop gardens for cities and the people who live in them? You must use continuous writing (not note form) and use your own words as far as possible. Your summary should not be more than 120 words.",plan:o,points:[{t:"They make dull grey roofs and skylines more attractive",k:["attractive","appearance","beaut","look nicer","look better","prettier","pleasant to look"]},{t:"They keep buildings and city centres cooler",k:["cool","heat","temperature","warm","hot"]},{t:"People rely less on air conditioning",k:["air condition","air con","aircon","energy","electric"]},{t:"They soak up rainwater and release it slowly",k:["rain","water","storm"]},{t:"They reduce flooding and pressure on drains",k:["flood","drain","overflow"]},{t:"They give bees, butterflies and birds food and shelter",k:["bee","bird","butterfl","wildlife","insect","animal","habitat","creature","species"]},{t:"Residents can grow fresh vegetables",k:["vegetable","grow","crop","produce","fresh food","fruit","tomato"]},{t:"The food is local, not transported long distances",k:["local","travel","transport","distance","miles","kilomet"]},{t:"They bring neighbours together",k:["neighbour","neighbor","social","communit","friend","meet","together"]},{t:"They offer a calm, peaceful place to rest",k:["calm","peace","rest","relax","tranquil","quiet","escape"]},{t:"Time among plants lowers stress",k:["stress","wellbeing","well being","mental","anxi","health","mood"]}],checks:[{t:"No more than 120 words",w:1,sec:1,auto:"max"},{t:"Own words: no long phrases copied from Text B",w:1,sec:1,auto:"nolift"},{t:"Continuous sentences, not notes or bullet points",w:1,sec:1,auto:"prose"},{t:"No introduction, opinions, examples or quotations",w:1,sec:1,auto:"noopinion"},{t:"Related points grouped and linked smoothly",w:1,sec:1}],model:"Rooftop gardens cool cities because plants and soil absorb much less heat than dark roofs, so the rooms beneath need less air conditioning. They store rainwater during storms and release it gradually, reducing the risk of drains overflowing and streets flooding. They give bees, butterflies and birds driven out by concrete somewhere to feed and shelter. Some grow vegetables, providing crowded areas with fresh, locally grown food. They also benefit people socially and mentally: residents meet neighbours they previously ignored, enjoy a peaceful place to relax, and feel less stressed among plants. Finally, they make dull grey skylines more attractive.",tips:["10 marks are for points, so aim for at least 10 separate ideas","Group points: cooling, water, wildlife, food, people","Count your words before you finish"]},{id:"lang",kind:"language",paper:"p1",label:"Q2(d) Language",title:"How the writer presents the storm",marks:15,minutes:25,words:[250,450],ref:["C"],secs:["Selection","Analysis"],prompt:"Re-read paragraphs 1 and 2 of Text C. Explain how the writer uses language to convey meaning and to create effect in these paragraphs. Choose three examples of words and phrases from each paragraph to support your answer. Your choices should include the use of imagery.",plan:i.concat(["Put each choice in quotation marks so it is clear what you are analysing","Finish each paragraph with the overall impression it creates"]),checks:[{t:"Three or more quoted choices from paragraph 1",w:2,sec:0,auto:"q1"},{t:"Three or more quoted choices from paragraph 2",w:2,sec:0,auto:"q2"},{t:"Imagery included from each paragraph (simile, metaphor or personification)",w:2,sec:0,auto:"imagery"},{t:"The meaning of each choice explained in context",w:2,sec:1},{t:"Connotations of key words explored, not just whole phrases",w:3,sec:1,auto:"connot"},{t:'Precise effects, with no generic comments like "makes the reader want to read on"',w:2,sec:1,auto:"nogeneric"},{t:"The overall impression of each paragraph summed up",w:2,sec:1,auto:"overall"}],model:e("Paragraph 1",'The sky has "curdled into a bruised purple". "Curdled" suggests milk turning sour and thick, so the sky seems to be rotting, as if something has spoiled. "Bruised" connotes injury, as though the sky has already been beaten. Together they make it look sickly and hurt, warning that violence is coming.','The wind begins to "prowl" along the shoreline. This verb is used of predators hunting, so the wind is personified as a restless animal searching for prey. It makes the town seem vulnerable and builds tension.','The gulls are "pinned in place like paper cut-outs". The simile suggests they are flat, weightless and helpless, held still by the wind like decorations stuck to a wall. When they are "flung" inland, we see that even creatures of the air are powerless.',"Overall, paragraph 1 creates quiet menace: the storm has not broken yet, but everything is in the grip of something dangerous and alive.","","Paragraph 2",'The rain is "not falling but hurled". Rain usually drops gently, but "hurled" suggests deliberate, violent throwing, as if the storm is attacking the town.','It becomes "a grey wall that marched across the water". A wall is solid and impossible to see through or escape, while "marched" evokes an army advancing in formation, relentless and organised.','The sea "swallowed the lighthouse whole". A lighthouse is a symbol of safety and guidance, so having it devoured as if by a monster suggests that nothing can protect the town now.','The contrast between the sea that "lapped politely" and the sea that "reared and snarled" shows its transformation from a tame, well-mannered presence into a vicious beast, like a dog turning on its owner.',"Overall, paragraph 2 presents the storm at full strength as a monstrous, living force that overwhelms the town."),tips:["Short quotations let you zoom in on single words","Meaning first, then connotations, then effect","Imagery is required: pick at least one image from each paragraph"]},{id:"q3c",kind:"extended",paper:"p1",label:"Q3 Extended response",title:"Journal: the fisherman",marks:25,minutes:35,words:[250,350],ref:["C"],secs:A,format:"journal",prompt:"You are one of the fishermen in Text C. That night, you write a journal entry about the storm.",bullets:["what you noticed as the storm approached and how you and the other fishermen prepared","your thoughts and feelings when the storm struck the harbour","what the storm has shown you about the sea and about your town"],start:"I have worked on this beach for twenty years, but today\u2026",plan:["Bullet 1: the sky, the wind, the gulls; dragging the boats up the shingle in silence","Bullet 2: the rain, the vanishing lighthouse, the spray, the caf\xe9 lights going out; your fear","Bullet 3: develop it: what you learned about the sea, and how the town pulled together","Use details from Text C, but explain feelings the text only hints at","Journal voice: first person, honest, reflective, written that night"],checks:[{t:"Bullet 1: what you noticed and how you prepared",w:3,sec:0,k:["sky","wind","gull","boat","shingle","drag","haul","prepar"]},{t:"Bullet 2: your thoughts and feelings when the storm struck",w:3,sec:0,k:["afraid","fear","scared","terrif","shak","panic","heart","felt","feel"]},{t:"Bullet 3: what the storm has shown you about the sea and the town",w:3,sec:0,k:["learn","realis","realiz","shown","taught","remind","understand","respect"]},{t:"Details from Text C used accurately (the lighthouse, the caf\xe9, the spray)",w:3,sec:0,k:["lighthouse","caf\xe9","cafe","spray","jetty","harbour","window"]},{t:"Ideas developed beyond the text, but consistent with it",w:3,sec:0},{t:"Journal voice: first person and reflective",w:3,sec:1,auto:"firstperson"},{t:"Own words, not lifted from Text C",w:2,sec:1,auto:"nolift"},{t:"Organised in clear paragraphs",w:2,sec:1,auto:"paras3"},{t:"Accurate spelling, punctuation and grammar",w:3,sec:1,auto:"accuracy"}],model:e("I have worked on this beach for twenty years, but today I learned how little I know about the sea.","","The signs were there from the morning. By noon the sky had turned a sickly purple, the colour of an old bruise, and the wind had started creeping along the shore, tugging at every loose shutter as if it were searching for a way in. Even the gulls could not fly against it; they hung still for a moment before being tossed inland like scraps of paper. Nobody needed to give an order. Together we hauled the boats as far up the beach as our backs would allow, saving our breath and our fear for later.","","When the storm finally struck, it was worse than anything I have seen. The rain came at us sideways, a solid grey curtain that hid the lighthouse completely, and for a terrible moment I thought it had gone. The sea, which had been nudging the jetty as gently as a cat, rose up and roared, throwing spray right over the harbour wall. Somewhere glass shattered. I sheltered in the caf\xe9 with the others, and when the lights went out, nobody said a word. I am not ashamed to admit that my hands were shaking.","","Tonight the wind has dropped and I am writing by candlelight. I keep thinking about how quickly the sea changed. We talk about it as if it belongs to us, but today it reminded us that we are only its guests. And yet I also saw what this town is made of: no one went home until every boat was safe. Tomorrow we will count the damage. Tomorrow we will start again."),tips:["Give each bullet roughly equal space","Develop ideas: explain feelings and reasons the text implies","Don't invent wild new events like a shipwreck rescue"]},{id:"q3a",kind:"extended",paper:"p1",label:"Q3 Extended response",title:"Letter: the ferry skipper",marks:25,minutes:35,words:[250,350],ref:["A"],secs:A,format:"letter",prompt:"You are Amara's grandfather in Text A. After the final crossing, you write a letter to the town council.",bullets:["what the ferry and the crossing have meant to you and your passengers over the years","what happened on the crossing when the dolphins appeared, and how the passengers reacted","how the council could keep something of the ferry's value once the bridge opens"],start:"Dear Members of the Council,",plan:["Open politely and say who you are: forty-one years at the wheel","Bullet 1: what the slow crossing gives people that a bridge cannot; be fair about why the bridge is wanted","Bullet 2: slowing the engine, the three dolphins, passengers looking up from their phones, the boy","Bullet 3: develop a sensible proposal, such as weekend trips, school visits or training a new skipper",'Close formally: "Yours faithfully" when you begin "Dear Members of the Council"'],checks:[{t:"Bullet 1: what the ferry has meant to you and your passengers",w:3,sec:0,k:["years","forty","passenger","crossing","journey","evening"]},{t:"Bullet 2: the dolphins and how the passengers reacted",w:3,sec:0,k:["dolphin"]},{t:"Bullet 3: a sensible suggestion for the council",w:3,sec:0,k:["keep","save","tourist","trip","suggest","propose","instead","visit","school"]},{t:"Details from Text A used accurately (the bell, the ropes, the bridge, the boy)",w:3,sec:0,k:["bell","rope","bridge","six","boy","island","amara"]},{t:"Ideas developed beyond the text, but consistent with it",w:3,sec:0},{t:"Letter conventions: greeting, formal but heartfelt tone, sign-off",w:3,sec:1,auto:"letter"},{t:"Own words, not lifted from Text A",w:2,sec:1,auto:"nolift"},{t:"Organised in clear paragraphs",w:2,sec:1,auto:"paras3"},{t:"Accurate spelling, punctuation and grammar",w:3,sec:1,auto:"accuracy"}],model:e("Dear Members of the Council,","","For forty-one years I have taken the Marisol across to the island every evening at six. As you prepare to open the new bridge, I would like to tell you what you are about to lose.","","Of course the bridge is needed. Six minutes instead of forty is a real gift to people who are tired and want to reach home, and nobody should blame them for being relieved. But the crossing has never been just a journey. I have watched children see the sea for the first time and strangers become friends because there was nothing to do but talk. On the ferry, people slow down. On a bridge, they never will.","","On our final crossing I slowed the engine halfway across. There was no explanation; there was only hope. And there they were: three dolphins rising beside us in the silver water, breathing once and disappearing. Every passenger looked up from their phone. Nobody spoke. A small boy who had asked me earlier whether I was sad pressed his face to the rail, and I knew he would remember that moment long after he had forgotten the bridge.","","So I ask you not to send the Marisol for scrap. Keep her for weekend trips and school visits, for anyone who wants to see the bay slowly. I would gladly train a younger skipper, perhaps my granddaughter, who knows these waters almost as well as I do, and the ticket money could pay for her upkeep.","","I have checked her ropes every evening for forty-one years. Let me check them a little longer.","","Yours faithfully,","The skipper of the Marisol"),tips:["Match the register to your reader: polite and formal for a council","Use the text's details, then build on them","The third bullet invites you to develop ideas sensibly"]},{id:"dw1",kind:"directed",paper:"p2",label:"Section A Directed writing",title:"Speech: should phones be banned?",marks:40,minutes:60,words:[250,350],ref:["D1","D2"],secs:A,format:"speech",prompt:"Your headteacher is considering a complete ban on mobile phones during the school day. You have been asked to give a speech to students and teachers in a school assembly.",bullets:["evaluate the views expressed in both texts","give your own views, based on what you have read, about whether phones should be banned"],start:"Good morning, everyone.",plan:["Hook: involve the audience straight away (a question or a show of hands)","State your view clearly in the first paragraph","Text 1: its strongest point, then a weakness (one school's survey, no evidence, ignores hiding)","Text 2: why it is more or less convincing (it admits the problems, offers alternatives)","Your proposal, built from both texts",'A memorable ending and "Thank you"'],checks:[{t:"Ideas from Text 1 used and assessed",w:3,sec:0,k:["seven in ten","survey","relief","emergenc","textbook","notification","bully","playground","concentrat","attention"]},{t:"Ideas from Text 2 used and assessed",w:3,sec:0,k:["hid","tool","experiment","translat","photograph","responsib","switch off","manage","screen"]},{t:"Evaluation: you judge how convincing each argument is, not just repeat it",w:5,sec:0,auto:"evaluate"},{t:"Your own clear view, based on the texts",w:4,sec:0,auto:"view"},{t:"Speech conventions: greeting, direct address and a clear close",w:5,sec:1,auto:"speech"},{t:"Clear structure with paragraphs and linking words",w:5,sec:1,auto:"connect"},{t:"Persuasive techniques used deliberately",w:5,sec:1,auto:"persuade"},{t:"Formal register with no slang",w:4,sec:1,auto:"noslang"},{t:"Accurate spelling, grammar and punctuation",w:6,sec:1,auto:"accuracy"}],model:e("Good morning, everyone.","","Raise your hand if your phone has buzzed since you walked into this hall. Now keep it up if you checked it. Exactly. Our headteacher is considering a complete ban on phones during the school day, and I want to explain why a total ban would be a mistake, but why doing nothing would be a mistake too.","",'The writer of the first article makes powerful points. Anyone who has watched a lesson fall apart because of one notification knows the problem is real, and the idea of "seven hours of relief" from group chats and midnight comments is genuinely moving. Online bullying does follow students everywhere.',"",'However, the evidence is weaker than it sounds. The survey comes from a single school, and glancing at a phone is not the same as losing a whole lesson. The writer claims parents "managed perfectly well" without smartphones but offers no proof. Above all, the article ignores the obvious problem: phones will simply be hidden.',"","The second writer, a teacher, tackles that problem head on, and I find this far more convincing. Bans, they argue, teach us nothing; they simply hide the problem instead of solving it. Crucially, they admit that phones distract and that cyberbullying is real before explaining why school is exactly where we should learn to handle both.","","So what do I propose? Not a free-for-all, and not a total ban. Phones should be silent and out of sight in lessons unless a teacher asks for them. Lunchtimes could have phone-free zones. And every year group should be taught how to manage notifications and behave kindly towards each other online.","","We will spend our whole lives surrounded by screens. Let us use our time here to learn to control them, rather than pretending they do not exist.","","Thank you."),tips:["Evaluate: is the evidence strong? Is anything ignored or exaggerated?","You can agree with one text, or take a middle view",'Avoid slang like "gonna" and "kinda"']},{id:"dw2",kind:"directed",paper:"p2",label:"Section A Directed writing",title:"Letter: to your headteacher",marks:40,minutes:60,words:[250,350],ref:["D1","D2"],secs:A,format:"letter",prompt:"Your headteacher has asked students for their views on banning mobile phones during the school day. Write a letter to your headteacher.",bullets:["evaluate the ideas in both texts","explain what you think the school should do, based on what you have read"],start:"Dear Mrs Okafor,",plan:["Say why you are writing and give your view in the first paragraph","Use the strongest evidence from the text you agree with","Concede: accept the fair points of the other text, then explain why they are less convincing","Make practical suggestions that answer both writers' concerns",'Polite, formal close: "Yours sincerely" when you use the head\'s name'],checks:[{t:"Ideas from Text 1 used and assessed",w:3,sec:0,k:["seven in ten","survey","relief","emergenc","textbook","notification","bully","playground","concentrat","thirty heads"]},{t:"Ideas from Text 2 used and assessed",w:3,sec:0,k:["hid","tool","experiment","translat","photograph","responsib","switch off","manage","screen"]},{t:"Evaluation: you judge how convincing each argument is, not just repeat it",w:5,sec:0,auto:"evaluate"},{t:"Your own clear view, based on the texts",w:4,sec:0,auto:"view"},{t:"Letter conventions: greeting, purpose, formal sign-off",w:5,sec:1,auto:"letter"},{t:"Clear structure with paragraphs and linking words",w:5,sec:1,auto:"connect"},{t:"Reasoned, persuasive tone that stays polite",w:5,sec:1},{t:"Formal register with no slang",w:4,sec:1,auto:"noslang"},{t:"Accurate spelling, grammar and punctuation",w:6,sec:1,auto:"accuracy"}],model:e("Dear Mrs Okafor,","","I am writing about your proposal to ban mobile phones during the school day. Having read arguments on both sides, I believe a ban is the right decision, although it will only work if it is introduced carefully.","",'The case for a ban is stronger than many students would like to admit. The first article describes how a single buzz can make "thirty heads turn", and anyone who sits in our lessons knows this is no exaggeration. More importantly, the writer points out that phones let playground conflicts follow us everywhere. Group chats that exclude people and photographs shared without permission are real problems here; seven hours away from them each day would give many students genuine relief. Is that not worth a little inconvenience?',"","I accept that the second writer raises fair points. Phones can be useful for recording experiments or translating texts, and families do worry about emergencies. However, these arguments are less convincing than they first appear. The school office has a telephone, and teachers could book tablets for lessons that need them. The claim that students will simply hide their phones is a reason to enforce a ban properly, not a reason to avoid one.","","Where I agree with the second writer is that we need to learn to use technology responsibly. A ban during school hours does not prevent this. I would suggest that phones are handed in at registration and returned at the end of the day, and that tutor time includes lessons on managing notifications and behaving kindly online.","","I hope you will consider these suggestions, and I would be happy to discuss them with the student council.","","Yours sincerely,","A Year 11 student"),tips:['Concede, then counter: "I accept that\u2026 However\u2026"',"Practical suggestions show you have weighed both texts",'Formal letter: no contractions like "don\'t" in the body']},{id:"cd1",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The market at closing time",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Describe a busy market as it closes at the end of the day.",plan:["Wide shot: the market at its loudest; colours, crowds, smells","Close-ups: one stall, one trader's hands, one detail nobody notices","Change: the light shifts; sounds begin to fade; shutters come down","Pull back: the empty lane and a final image that echoes the opening"],wordbank:["cacophony","vibrant","meander","hushed","melancholy","desolate"],checks:S,model:e("At four o'clock, the market is still roaring. Awnings of faded red and orange stretch over the narrow lane like the sails of stranded ships, and beneath them the air is thick with frying garlic, ripe mangoes and diesel. Traders bellow prices over one another until the words dissolve into a single cacophony, rising and falling like surf.","","Look closer. At the spice stall, a woman scoops turmeric into paper cones, her fingertips stained a permanent gold. Pyramids of chillies glow beside sacks of cardamom so fragrant that passers-by slow down without knowing why. Across the lane, the fishmonger's ice has begun to sweat; silver bodies lie in rows, their eyes clouding, and he sluices the counter with a bucket of water that runs grey into the gutter.","","By five, the light has changed. The sun slides behind the clock tower and shadows stretch across the cobbles, cool and blue. Voices drop. Someone laughs, tired and content, and a radio behind the noodle stall crackles out an old love song that nobody is listening to. The first metal shutter rattles down with a clatter that echoes off the walls, then another, and another, until the lane sounds like a giant drawing breath through its teeth.","","The fruit seller is the last to pack away. He works slowly, as if reluctant to let the day go, and wraps each unsold papaya in newspaper as tenderly as if it were a sleeping child. Bruised tomatoes are left in a crate by the drain, where a thin cat appears, sniffs, and moves on, unimpressed. Pigeons strut between the empty stalls with the confidence of new owners.","","Now the awnings are folded and the lane seems far too wide, a long grey corridor littered with cabbage leaves and flattened cardboard. A single bulb buzzes above the locked spice stall, and moths gather around it like late customers hoping for a bargain. The smells linger after their owners have gone: a ghost of garlic, a memory of ginger, the sweetness of fruit beginning to turn.","","Tomorrow, before dawn, the shutters will rise and the roar will return. For now the market sleeps, and the only sound is the patient drip of melting ice, counting the seconds until morning.")},{id:"cd2",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The abandoned cinema",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Describe a place that has been abandoned for many years.",plan:["Entrance: how the outside world gets in (wind, light, weeds)","Move through the space room by room, like a camera","Details that show the past: objects left behind, signs of the people who were here","The silence: what you hear instead of what used to be there","End with a final image, or a moment where the past almost returns"],wordbank:["dilapidated","eerie","muffled","reverberate","desolate","translucent"],checks:S,model:e("The doors of the Regal Cinema have not opened for thirty years, but the wind has found its own way in. It slips through a broken pane above the entrance and wanders the foyer, stirring drifts of dust that rise and settle like slow grey snow.","","Light enters in thin blades between the boarded windows. It falls across the ticket counter, where a brass bell sits beside a faded poster of a film nobody remembers, the heroine's smile peeling away in long curls. The carpet, once a deep and confident crimson, has bleached to the colour of weak tea. Each step releases a soft, damp breath of mould, and somewhere beneath it a floorboard sighs.","","Beyond the swing doors, the auditorium waits in near darkness. Rows of velvet seats slope towards the screen like the steps of a ruined amphitheatre. Some have collapsed; others still hold their shape, their arms worn smooth by thousands of elbows, as if the audience left a moment ago. In the front row a single seat is folded down, as though someone is still waiting for the film to begin. The screen hangs in tatters, a huge pale sail torn by damp, and behind it pigeons have built an untidy kingdom of twigs and feathers. When one shifts, the beat of its wings echoes around the cavernous room like sudden applause.","","It is the silence that is hardest to bear. In a room built for gasps and laughter, there is only one sound left: the tick of water dripping from the ceiling into a rusted bucket that someone placed there long ago and never came back to empty. The air smells of wet plaster and old popcorn oil, a sour sweetness that clings to the back of the throat.","","High at the back, the projection window is still intact. Through it, dust drifts in a beam of sunlight like a film waiting to be shown. For a moment it is almost possible to believe the projector will flicker into life, that music will swell and the darkness will fill with faces turned upwards, lit silver and gold.","","Then a cloud passes over the sun. The beam fades. The Regal returns to its long, patient sleep, and the wind, bored, slips back out through the broken pane.")},{id:"cd3",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The station: dawn and rush hour",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Describe a railway station early in the morning, before it gets busy, and then later when it is crowded.",plan:["Dawn: emptiness, cold, small sounds that carry, one or two people","A one-line paragraph to mark the time shift","Rush hour: the same details transformed (the same kiosk, the same pigeons)","Contrast senses: quiet against noise, fresh smells against crowded ones","End by returning to a detail from the opening"],wordbank:["tranquil","hushed","clamour","scurry","lurch","luminous"],checks:S,model:e("At half past five, the station belongs to the pigeons. They patrol the empty platform in twos and threes, heads bobbing, inspecting the yellow line as if it were their own invention. The departure board flickers green in the gloom, its letters clicking over one by one with nobody to read them.","","The air is cold enough to sting. It smells of metal and damp concrete, with a faint, warm hint of bread from the kiosk, where the shutter is half raised and a young man yawns as he lines up paper cups in perfect rows. Under the roof a loose sheet of plastic flaps and settles, flaps and settles, like a slow heartbeat. Otherwise there is nothing: no footsteps, no voices, no trains.","","A cleaner moves along the platform with a wide broom, pushing a small wave of crisp packets ahead of her. She hums an old tune, and the sound carries much further than it should across the hushed tracks. Beyond the glass canopy the sky is turning from ink to pale lilac, and the rails gleam like two silver threads running into the morning.","","By eight o'clock, the station is unrecognisable.","","The pigeons have retreated to the girders; below them, a tide of commuters surges through the barriers: suits and school uniforms, headphones and briefcases, a toddler perched on her father's shoulders like a queen surveying her kingdom. Footsteps drum on the stairs. The announcements, which earlier echoed politely into silence, now compete with a hundred conversations and the shriek of brakes as a train slides in, already full, its windows fogged with breath.","","The kiosk has become a battleground. The young man, wide awake now, slams coffee after coffee onto the counter while the queue snakes back past the timetable. The smell of bread has been swallowed by perfume, warm rubber and the sharp tang of the city waking up.","","The doors open. Bodies pour out and bodies pour in, and for a few seconds the platform empties as quickly as it filled. Then the whistle blows, the train pulls away, and a single pigeon drops from the girders to inspect the yellow line again, as if nothing has happened at all.")},{id:"cd4",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The family gathering",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Describe a family gathering, focusing on the people and the atmosphere.",plan:["Choose one room as your stage and anchor it with a central figure","Describe three or four people through one telling action each","Use sound and smell to build warmth","Include a quieter moment or a detail that hints at the past","End as the gathering winds down, with a final image"],wordbank:["vibrant","resonant","wistful","serene","meticulous","cacophony"],checks:S,model:e("The kitchen is the beating heart of my grandmother's house, and on the first Sunday of the holidays it is working overtime.","","Steam rises from three pots at once, fogging the window above the sink so that the garden becomes a soft green blur. The air is heavy with cumin, frying onions and the scorched sweetness of something left in the oven a minute too long. Nobody minds; my grandmother stands at the centre of it all, small and unhurried, stirring with a wooden spoon worn pale at the edges and giving instructions in a voice so quiet that everyone has to lean in to hear.","","Around her, the family orbits. My uncle, enormous and cheerful, has been trusted with the tomatoes and chops them with the solemn concentration of a surgeon. Two of my aunts argue happily about whose turn it was to bring dessert, their bangles chiming like tiny bells. Under the table, the youngest cousins have built a fort from chair legs and a tablecloth, and every so often a small hand reaches up to steal an olive.","","In the living room, the television murmurs to itself, ignored. My grandfather has fallen asleep in his armchair with a newspaper tented over his chest, rising and falling with each gentle snore. On the mantelpiece, photographs in mismatched frames watch over us: weddings, graduations, a black-and-white couple squinting into the sun on a beach decades ago. Some of those faces are at the table today. Some are not, but somehow they are here too.","","When the food arrives, the noise doubles. Plates clatter, chairs scrape and three conversations collide in the middle of the table. Rice is passed from hand to hand like a precious parcel. Someone knocks over a glass, and the laughter is so loud that my grandfather wakes with a start and asks if he has missed anything.","","Later, when the dishes are stacked and the light has turned golden, the house grows quiet. Cousins sprawl across the carpet, too full to move, and someone starts a sleepy argument about a board game. My grandmother sits at last, hands folded, watching us with the calm satisfaction of someone who has gathered everything she loves into one warm, crowded room.")},{id:"cn1",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The Key",marks:40,minutes:60,words:[350,450],secs:I,prompt:'Write a story with the title "The Key".',plan:["Opening: the key arrives with a mystery attached","Rising action: failed attempts; a hint that someone knows more","Turning point: a character recognises it","Climax: the door opens and reveals something that changes how a character sees the past","Ending: a quiet final image rather than a big explanation"],wordbank:["apprehensive","gnarled","wistful","foreboding","resonant","hushed"],checks:q,model:e("The key arrived on a Tuesday, in an envelope with no stamp and no name, just our address in shaky blue ink.","","It was old and heavy, black iron longer than my hand, its teeth worn smooth. A paper tag hung from it on faded string. On the tag, someone had written a single word: Remember.","",'"Junk," said Mum, but she turned it over twice before handing it back, and I saw her jaw tighten.',"","For a week I carried it everywhere. I tried it in every lock I could find: the shed, the garage, the tin box under Mum's bed where she kept papers she never let me read. Nothing fitted. At night it lay on my bedside table, catching the street light, while I wondered whose hand had written that word.","","It was Gran who recognised it. We were visiting her at the care home and I was turning the key between my fingers. She stopped mid-sentence. Her eyes, which these days drifted like boats without anchors, found mine and held them.","",'"Where did you get that?" she whispered. "That opens the blue house on Harbour Lane. Your grandfather\'s workshop."',"","Mum went still. My grandfather had walked out when she was a baby. That was all anyone ever said about him, and they rarely said it.","","On Saturday we drove to Harbour Lane in silence. The house was squeezed between a launderette and a phone shop, its paint faded to the colour of a winter sky. The key turned stiffly, resisted, then gave.","","Dust lay over everything like a sheet. Beneath it were shelves of tiny wooden boats, hundreds of them, each carved and painted by hand, each with a name on its side. Every name was Mum's.","","On the workbench, beside a half-finished hull, lay a letter addressed to her, sealed and never sent. She read it standing in the doorway. When she finally looked up, her eyes were wet.","",'"He didn\'t leave because of me," she said. "He was ill. He was trying to come back."',"","We never found out who posted the key. But that evening Mum placed the smallest boat on our kitchen windowsill, where the light could find it.")},{id:"cn2",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The light in the window",marks:40,minutes:60,words:[350,450],secs:I,prompt:'Write a story that begins: "Nobody else had noticed the light in the window."',plan:["Use the given opening exactly, then establish why the light is strange","Build curiosity over several days; raise the stakes with a deadline","Climax: the narrator investigates alone; slow the moment down","Reveal a human, believable explanation","Resolve with action and end on an image that echoes the light"],wordbank:["ominous","reverberate","apprehensive","dilapidated","muffled","resilient"],checks:q,model:e("Nobody else had noticed the light in the window.","","Every evening the number 12 bus crawled past Carlton Tower, and every evening I pressed my forehead to the glass and counted the floors. Fourteen storeys of dark windows, boarded and blind. The council had emptied the building in the spring. A yellow sign on the fence announced the demolition date in letters a metre high: Monday.","","But on the eleventh floor, third window from the left, a small orange light was glowing.","","On Thursday it was there again. On Friday it flickered, as if someone had walked in front of it. I looked around the bus. Nobody else had seen.","","On Saturday I stepped off the bus two stops early.","","The fence had a gap where the wire had been peeled back. My heart was hammering so hard I could feel it in my throat. The stairwell smelled of damp and pigeons, and every step echoed upwards into the dark. By the eleventh floor I could hear music: an old song, crackling, the kind my grandmother used to hum.","","The door of flat 114 was open a crack.","",'"Hello?" My voice came out smaller than I meant it to.',"","The music stopped. Footsteps shuffled. The door swung open, and an elderly man in a cardigan peered at me over his glasses.","",'"You\'re not from the council," he said.',"","His name was Mr Adeyemi, and he had lived in flat 114 for forty years. His late wife had planted the balcony garden in their first summer: geraniums, tomatoes, a lemon tree in a cracked blue pot. He had moved to his new flat across town, but he could not carry the plants, so every evening he came back to water them, sitting with a lamp and the radio until dark.","",'"They knock it down on Monday," I said.',"",'He looked at the lemon tree. "I know."',"","On Sunday I came back with my brother, my cousin and three borrowed shopping trolleys. It took us six trips and the whole afternoon.","","Now, when the number 12 passes the empty space where Carlton Tower stood, I look across the river instead. On the fourth floor of a newer building, a small orange light glows among the leaves.")},{id:"cn3",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The misunderstanding",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Write a story in which a misunderstanding has serious consequences.",plan:["Set up the misunderstanding early so the reader sees it before the narrator does","Make the consequences real: danger, cost or harm, not a quick laugh","Slow the climax down with short sentences and physical detail","Show how the narrator gets out of it through their own actions","End with what the narrator has learned, shown in one final image"],wordbank:["apprehensive","plummet","hurtle","stagger","impetuous","despondent"],checks:q,model:e("The lifeguard was waving at me. I was sure of it.","","It was the last afternoon of our holiday and the beach was almost empty. Mum was dozing under the umbrella, my little sister Noor was burying her own feet, and I was waist-deep in water so clear I could see my toes. Beyond the rocks, the waves were bigger, glassy and green. That was where I wanted to be.","","On the tall white chair, the lifeguard stood up. She lifted both arms above her head and swept them from side to side.","","I grinned, waved back, and swam towards the rocks.","","At first it was easy. Too easy. The water carried me as if it wanted me out there too, and in a minute I was further out than I had meant to go in five. When I turned, the umbrella was a tiny red dot. I started to swim back.","","I did not move.","","I kicked harder. My arms churned. The beach stayed exactly where it was, then slowly slid further away. The water around me was strangely smooth, a dark channel between the breaking waves, pulling me out like a conveyor belt.","","Panic arrived all at once. Salt filled my mouth. I could hear my own breathing, ragged and loud, and nothing else. My legs were turning to stone.","","Swim sideways. The words surfaced from somewhere: a poster in the changing room, an assembly I had barely listened to. Don't fight it. Swim along the beach.","","So I turned. Stroke after stroke, parallel to the shore; then a wave lifted me and pushed me forward instead of back. Was it working?","","The lifeguard reached me as my knees scraped sand. She dragged me into the shallows, gasping, a long red cut down her shin where the rocks had caught her.","",'"I was waving," she panted, "to tell you to come back."',"","I looked at her leg, at the blood threading into the foam, at Mum sprinting down the beach with Noor in her arms, and I could not say anything at all.","","Nobody shouted at me. That was the worst part. Mum just held me so tightly that I could feel her shaking.","","Now, whenever someone waves at me from a distance, I stop. I look. And I make sure I understand.")},{id:"cn4",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The journey that went wrong",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Write a story about a journey that does not go to plan.",plan:["Open with the plan, so the reader knows what should happen","The moment it goes wrong: make it the narrator's own fault","Raise the stakes: no phone, no help, time running out","A turning point: help arrives, or the narrator solves it","End with a change in the narrator, tied back to the opening plan"],wordbank:["apprehensive","meander","desolate","lurch","elated","nonchalant"],checks:q,model:e("The plan was simple: the 8:14 train to the city, the museum by ten, lunch on the steps and home by four. Ms Rahman had written it on the board in green pen and made us copy it into our planners. I had copied it. I had not read it.","","Which is why, at half past ten, I woke in an empty carriage with my cheek stuck to the window and no idea where I was.","","Outside, instead of the grey towers of the city, there was a tiny station with a single bench, a hanging basket of drooping flowers and, beyond the fence, the sea.","","Stumbling onto the platform, I heard the doors hiss shut behind me. The train slid away. The sign above the bench said Port Ellin. I had never heard of it.","","My phone was dead. Of course it was. I had spent the journey playing games instead of listening to Josh explain, for the third time, which stop we needed.","","For a moment I just stood there while a gull screamed at me from the roof. My stomach felt hollow. Somewhere in the city, thirty students were filing into a museum, and one empty seat was about to be noticed. Ms Rahman's face swam into my mind: pale, then crimson.","","The ticket office was closed. The next train back was at 1:40. Down the hill I went, into the town, past a bakery that smelled of warm sugar, until I found a caf\xe9 with a handwritten sign: Phone charging, ask inside.","","The woman behind the counter took one look at me and put the kettle on. While my phone charged, she rang the school, then the museum, then my mum, speaking so calmly that it seemed lost teenagers arrived in her caf\xe9 every week. Perhaps they did.","",'When Ms Rahman finally called, she did not shout. She let out a long breath that crackled down the line and said, "Stay exactly where you are."',"","So I did, settling by the window with a hot chocolate and a slice of lemon cake the woman refused to let me pay for, watching fishing boats nod in the harbour. Something strange had happened; I was not frightened any more.","","I never saw the museum. But I still keep the caf\xe9's receipt folded inside my planner, next to the plan I didn't read.")}];Object.assign(t,{BA:{title:"Text A \xb7 The Audition",paras:["The corridor outside Room 14 smelled of floor polish and nerves. Mei sat at the end of a row of plastic chairs with her grandmother's violin case across her knees, running her thumb along the worn leather handle. Six other students waited with her. A boy in a crisp blazer was playing scales silently on his thigh; a girl with a cello had closed her eyes and was moving her lips, as if she were praying.","The violin had arrived in Mei's life two years earlier, wrapped in a faded silk scarf, with a note in her grandmother's careful handwriting: For the next pair of hands. Mei had been eleven, and she had not wanted it. She had wanted a phone. But the instrument had sat in the corner of her bedroom, patient as a cat, until one wet Sunday she had opened the case and drawn the bow across a string. The sound had been terrible. She had done it again the next day, and the next.",'Now the door of Room 14 opened and a tall woman with silver glasses read from a clipboard. "Mei Lin?" Mei stood up too quickly and the case knocked against the chair with a crack that made everyone look. Her face burned. Inside, three judges sat behind a long table, pens ready. The room was enormous and almost empty, and her footsteps sounded far too loud on the wooden floor.',"She tucked the violin under her chin. For a moment her mind was completely white, like a page nobody had written on. Then she remembered her grandmother's kitchen, the radio always playing, the way the old woman used to hum along with her eyes half closed. Mei began to play. The first notes wobbled. By the fourth bar, the wobble had gone, and she was no longer in the enormous room at all.",'Halfway through the slow movement, the E string snapped. It whipped past her cheek with a sound like a slap. One of the judges half rose from her seat. Mei looked at the broken string, then at the three faces watching her, and kept playing, moving the melody across to the strings that remained. When she finished, nobody spoke. Then the woman with the silver glasses put down her pen, took off her glasses and said quietly, "Where did you learn to do that?"']},BB:{title:"Text B \xb7 Lights Out",paras:["A century ago, almost anyone could step outside on a clear night and see the Milky Way. Today around a third of humanity cannot, because the glow of streetlights, advertising screens and floodlit buildings drowns out the stars. Astronomers were the first to complain, but scientists are discovering that the loss of darkness affects far more than the view.","For wildlife, night-time light can be deadly. Newly hatched sea turtles find the ocean by heading towards the brightest horizon, which used to be moonlight on the water; now many crawl inland towards hotels and roads. Migrating birds, which navigate partly by the stars, become disorientated by lit skyscrapers and circle them until they are exhausted, or fly straight into the glass. Moths and other insects gather around lamps in their millions instead of feeding and pollinating plants, and the bats and birds that depend on those insects go hungry.","People are affected too. Our bodies run on an internal clock that expects darkness at night. Bright light, especially the blue-white light of modern LEDs and screens, suppresses melatonin, the hormone that makes us sleepy. Studies have linked poor sleep caused by light at night to tiredness, weaker concentration and, over many years, a higher risk of some illnesses. Light shining into bedrooms from outside can also make it harder for children to settle.","There is a financial cost as well. Much outdoor lighting points sideways or upwards, lighting the sky rather than the ground, so a large share of the electricity it uses is simply wasted. That waste also adds to carbon emissions.","The encouraging news is that light pollution is one of the easiest environmental problems to fix. Shielded lamps that point downwards, warmer colours, timers and motion sensors can cut the glow dramatically without making streets less safe. Some towns have already been named dark sky places, and visitors now travel to them just to see the stars."]},BC:{title:"Text C \xb7 The Glacier",paras:["The path to the glacier climbed through a valley of grey rubble, as if a giant had emptied his pockets and walked away. Every few hundred metres a small signpost marked where the ice had reached in a particular year: 1950, 1980, 2005. The posts were absurdly far apart. By the time we reached the last one, my legs ached and the air had turned thin and sharp, scrubbed clean of every smell except wet stone. Then we rounded a ridge and the glacier was there, filling the valley's throat: a vast frozen river, scarred and ribbed, its surface the dirty white of an old bandage.","Up close it was not silent at all. It ticked, dripped, sighed. Somewhere deep inside, water was running in hidden tunnels, a constant hurried gurgle like a kettle that could never quite boil. Our guide knelt and laid her palm flat on the ice, the way you might touch the forehead of someone with a fever. Where the glacier ended, it did not stop so much as collapse: towers of blue ice leaned over a milky lake, cracked through with veins of light. While we watched, a slab the size of a house shivered, groaned, and slid into the water with a roar that echoed off the cliffs for a long time afterwards. Nobody spoke. The guide said that when she was a child, the lake had not existed."]},BD1:{title:"Text 1 \xb7 Let teenagers sleep",paras:["Every morning, millions of teenagers are dragged out of bed in the middle of their biological night. This is not laziness. During adolescence the body clock shifts: the sleep hormone melatonin is released around two hours later than in childhood, so most teenagers simply cannot fall asleep before eleven. If school starts at eight, they lose sleep every single day.","The evidence from schools that have changed is striking. When one group of schools moved the start of the day from 7:50 to 8:45, students slept almost an hour longer, attendance rose and grades in first-period lessons improved. Car accidents involving teenage drivers fell. Students reported feeling less anxious and more motivated.","Critics worry about buses, sports practice and parents' working hours. These are real problems, but they are problems of organisation, not of biology. We redesign timetables all the time; we cannot redesign the adolescent brain. A later start is one of the cheapest, simplest ways to improve young people's health and learning."]},BD2:{title:"Text 2 \xb7 Why we are keeping our timetable",paras:["Dear parents and carers, several of you have asked whether we will follow other schools and start the day an hour later. I understand the appeal. Nobody enjoys a dark winter morning, and I have read the research on teenage sleep with interest. But I want to explain why we are not planning to change.","First, a later start means a later finish. Many of our students look after younger brothers and sisters after school, have part-time jobs or travel long distances on buses that run to fixed timetables. Finishing at 4:30 would make their afternoons harder, not easier, and sports fixtures against other schools would become almost impossible in winter.","Second, I am not convinced that a later start automatically means more sleep. Some studies suggest that teenagers simply go to bed later when they know they can get up later, especially if they are on their phones until midnight.","Instead, we will work with students on sleep habits: putting phones away an hour before bed, keeping regular bedtimes, and starting the day with a short, calm tutor period rather than a test. Small changes at home may achieve more than a big change to the timetable."]}}),T.push({id:"sa10",ref:"A",part:"Q1(e)(ii)",marks:4,q:"Using your own words, explain how the passengers' feelings about the bridge contrast with the grandfather's feelings.",points:[{t:"The passengers are relieved or pleased",k:["relie","pleased","happy","glad","excit","eager","delight"]},{t:"because the bridge will save them time",k:["time","quick","faster","short","save"]},{t:"The grandfather is sad, quiet or grieving",k:["sad","silent","quiet","griev","grief","upset","loss","sorrow"]},{t:"because the ferry has been his life and means a great deal to him",k:["life","work","years","mean","love","important","routine","proud","devot"]}],model:"The regular passengers are relieved and eager, because the bridge will save them a lot of time. The grandfather, by contrast, is quietly grieving: the ferry has been his whole working life for over forty years, so losing it feels like losing part of himself."},{id:"sa11",ref:"C",part:"Q2(a)",marks:4,q:"Identify a word or phrase from Text C which suggests the same idea as each of the following: (i) the fishermen were grimly determined (ii) the wind moved like a hunter (iii) the rain was thrown with force (iv) the sea had been calm and well-behaved.",points:[{t:'(i) "their faces set like stone"',k:["stone"]},{t:'(ii) "prowl"',k:["prowl"]},{t:'(iii) "hurled"',k:["hurl"]},{t:'(iv) "lapped politely"',k:["lapped","polite"]}],model:"(i) their faces set like stone (ii) prowl (iii) hurled (iv) lapped politely"},{id:"sb1",set:"B",ref:"BA",part:"Q1(a)",marks:2,q:"Give two details from paragraph 1 which show that the students waiting outside Room 14 are nervous.",points:[{t:"A boy is silently playing scales on his thigh",k:["thigh","scale","finger","leg"]},{t:"A girl has closed her eyes and is moving her lips as if praying",k:["pray","eyes","lips","cello"]},{t:"The corridor smells of nerves",k:["nerves","smell"]}],model:"A boy is silently practising scales on his thigh, and a girl with a cello has her eyes shut and is moving her lips as if she is praying."},{id:"sb2",set:"B",ref:"BA",part:"Q1(b)",marks:2,q:'Explain what the phrase "patient as a cat" suggests about the violin in paragraph 2.',points:[{t:"It stayed quietly in the corner, never demanding attention",k:["quiet","still","calm","sat","there","corner","demand","ignor"]},{t:"It seemed to be waiting until Mei was ready to play it",k:["wait","ready","eventually","until","time","her to"]}],model:"It suggests the violin sat quietly in the corner without making demands, as if it were calmly waiting for the moment Mei would be ready to pick it up."},{id:"sb3",set:"B",ref:"BA",part:"Q1(c)",marks:3,q:"Using your own words, explain how Mei feels when she is called into Room 14 (paragraph 3).",points:[{t:"Embarrassed: her face burns when everyone looks",k:["embarrass","blush","ashamed","red","burn","humiliat"]},{t:"Nervous or anxious: she stands up too quickly",k:["nervous","anxious","worried","scared","afraid","tense","panic","jumpy","rush"]},{t:"Small or exposed in the huge, empty room",k:["small","overwhelm","exposed","alone","intimidat","enormous","big","loud","tiny"]}],model:"She is flustered and anxious, jumping up so fast that she bangs her case. When everyone stares she feels deeply embarrassed, and the huge, almost empty room makes her feel small and exposed."},{id:"sb4",set:"B",ref:"BA",part:"Q1(d)",marks:3,q:"What helps Mei to begin playing, and what does this suggest about her relationship with her grandmother?",points:[{t:"She remembers her grandmother's kitchen, the radio and her humming",k:["kitchen","radio","hum","remember","memor","thought of"]},{t:"The memory calms her and gives her confidence",k:["comfort","calm","safe","relax","confiden","focus","peace"]},{t:"She was close to her grandmother and still misses or loves her",k:["close","love","miss","bond","special","grief","died","dead","important","connect"]}],model:"Remembering her grandmother humming along to the radio in the kitchen calms her and lets her focus. This suggests they were very close, and that Mei still misses her and draws strength from her memory."},{id:"sb5",set:"B",ref:"BA",part:"Q1(e)",marks:5,q:"How does the writer make the ending of the passage dramatic? Explain with reference to paragraph 5.",points:[{t:'The string snaps suddenly and "like a slap", a violent shock',k:["snap","slap","whip","sudden","shock","violent","broke"]},{t:"A judge half rises from her seat, showing alarm",k:["judge","rose","rise","stood","alarm","concern","worried"]},{t:"Mei keeps playing on the remaining strings, showing determination and skill",k:["kept","keep","continu","carr","determin","adapt","skill","remaining"]},{t:"The silence after she finishes builds tension",k:["silen","nobody spoke","no one spoke","pause","tension","quiet"]},{t:"The judge's question shows she is deeply impressed, leaving the outcome open",k:["impress","question","learn","amaz","surpris","admir","talent","open"]}],model:'The E string snaps without warning and whips past her "like a slap", a sudden, almost violent shock. A judge half rises, which shows how alarming the moment is. Instead of stopping, Mei keeps playing on the remaining strings, revealing her determination and skill. The silence that follows builds tension, and the judge\'s quiet question shows she is amazed, leaving us wondering what will happen next.'},{id:"sb6",set:"B",ref:"BC",part:"Q2(a)",marks:4,q:"Identify a word or phrase from Text C which suggests the same idea as each of the following: (i) the path was covered in broken stone (ii) the air had been made completely pure (iii) the glacier filled the narrowest part of the valley (iv) the ice was marked with ridges and damage.",points:[{t:'(i) "rubble"',k:["rubble"]},{t:'(ii) "scrubbed clean"',k:["scrub"]},{t:'(iii) "the valley\'s throat"',k:["throat"]},{t:'(iv) "scarred and ribbed"',k:["scar","ribbed"]}],model:"(i) rubble (ii) scrubbed clean (iii) filling the valley's throat (iv) scarred and ribbed"},{id:"sb7",set:"B",ref:"BC",part:"Q2(b)",marks:3,q:'Using your own words, explain what the writer means by each of these phrases: (i) "absurdly far apart" (ii) "a constant hurried gurgle" (iii) "did not stop so much as collapse".',points:[{t:"(i) ridiculously or shockingly distant from each other",k:["ridiculous","unbeliev","shock","silly","strange","very far","huge distance","unreasonabl","crazy","extreme"]},{t:"(ii) a non-stop, rapid bubbling or rushing sound",k:["bubbl","rush","continu","non stop","never stop","nonstop","quick","fast","rapid","always"]},{t:"(iii) rather than ending neatly, it was falling apart",k:["fall","break","crumbl","give way","disintegrat","apart","fell"]}],model:"(i) ridiculously distant from one another (ii) a never-ending, rapid bubbling sound (iii) instead of ending neatly, it was falling to pieces"},{id:"sb8",set:"B",ref:"BC",part:"Q2(c)",marks:3,q:'Explain how the writer suggests the glacier is unwell in this sentence: "Our guide knelt and laid her palm flat on the ice, the way you might touch the forehead of someone with a fever."',points:[{t:"The simile compares the glacier to a sick person",k:["sick","ill","fever","patient","person","human","unwell"]},{t:"The guide's gesture is gentle and caring, as if she is worried",k:["gentle","care","concern","tender","worr","love","kind","soft"]},{t:'"Fever" suggests the glacier is overheating or dying from warming',k:["warm","heat","melt","dying","suffer","climate","temperature","hot"]}],model:'The simile turns the glacier into a sick person and the guide into someone nursing them: her gesture is gentle and anxious. "Fever" suggests dangerous heat, hinting that the glacier is suffering, even dying, because the climate is warming.'}),M.push({id:"sumB",set:"B",kind:"summary",paper:"p1",label:"Q1(f) Summary",title:"The problems of light at night",marks:15,minutes:25,words:[80,120],ref:["BB"],secs:["Reading","Writing"],prompt:"According to Text B, what problems are caused by artificial light at night? You must use continuous writing (not note form) and use your own words as far as possible. Your summary should not be more than 120 words.",plan:o,points:[{t:"Many people can no longer see the stars or the Milky Way",k:["star","milky","night sky"]},{t:"Baby turtles head inland instead of to the sea",k:["turtle"]},{t:"Migrating birds lose their way",k:["migrat","disorient","confus","lose their way","lost","navigat"]},{t:"Birds circle buildings until exhausted or crash into glass",k:["exhaust","circl","crash","glass","collid","fly into","window"]},{t:"Insects swarm round lamps instead of feeding and pollinating",k:["insect","moth","pollinat"]},{t:"Bats and birds that eat insects go hungry",k:["hungry","bat","starv","food chain","go without"]},{t:"Light reduces the sleep hormone, so people sleep badly",k:["melatonin","hormone","sleep"]},{t:"Poor sleep causes tiredness and weaker concentration",k:["tired","concentrat","focus","fatigue","exhausted people"]},{t:"Long-term risk to health",k:["ill","health","disease","sick"]},{t:"Children find it harder to settle at night",k:["child","settle","bedroom"]},{t:"Badly aimed lighting wastes electricity and money",k:["electric","waste","money","cost","financ","energy"]},{t:"The waste adds to carbon emissions",k:["carbon","emission","climate","global warming"]}],checks:[{t:"No more than 120 words",w:1,sec:1,auto:"max"},{t:"Own words: no long phrases copied from Text B",w:1,sec:1,auto:"nolift"},{t:"Continuous sentences, not notes or bullet points",w:1,sec:1,auto:"prose"},{t:"No introduction, opinions, examples or quotations",w:1,sec:1,auto:"noopinion"},{t:"Related points grouped and linked smoothly",w:1,sec:1}],model:"Artificial light at night hides the stars from about a third of people. It also harms wildlife: young turtles crawl towards roads rather than the sea, migrating birds become confused and either circle lit towers until exhausted or hit the windows, and insects swarm around lamps instead of feeding and pollinating, which leaves bats and birds that eat them short of food. In people, bright light, particularly from LEDs and screens, reduces the hormone that brings sleep, so they rest badly, feel tired and concentrate less, with a possible long-term risk to health; children also struggle to settle. Finally, badly aimed lights waste electricity and money and increase carbon emissions.",tips:["There are at least 12 separate problems in Text B: aim for 10","Group them: the night sky, wildlife, health, cost","The final paragraph is about solutions, so leave it out"]},{id:"langB",set:"B",kind:"language",paper:"p1",label:"Q2(d) Language",title:"How the writer presents the glacier",marks:15,minutes:25,words:[250,450],ref:["BC"],secs:["Selection","Analysis"],prompt:"Re-read paragraphs 1 and 2 of Text C. Explain how the writer uses language to convey meaning and to create effect in these paragraphs. Choose three examples of words and phrases from each paragraph to support your answer. Your choices should include the use of imagery.",plan:i.concat(["Paragraph 1 is about the journey and first sight; paragraph 2 brings the glacier to life","Look for the images of illness and injury: they build a pattern"]),checks:[{t:"Three or more quoted choices from paragraph 1",w:2,sec:0,auto:"q1"},{t:"Three or more quoted choices from paragraph 2",w:2,sec:0,auto:"q2"},{t:"Imagery included from each paragraph (simile, metaphor or personification)",w:2,sec:0,auto:"imagery"},{t:"The meaning of each choice explained in context",w:2,sec:1},{t:"Connotations of key words explored, not just whole phrases",w:3,sec:1,auto:"connot"},{t:'Precise effects, with no generic comments like "makes the reader want to read on"',w:2,sec:1,auto:"nogeneric"},{t:"The overall impression of each paragraph summed up",w:2,sec:1,auto:"overall"}],model:e("Paragraph 1",'The path climbs through "grey rubble, as if a giant had emptied his pockets and walked away". "Rubble" suggests the broken remains of something destroyed, and the simile of a careless giant makes the destruction seem huge and thoughtless; "walked away" hints that nobody has taken responsibility for the damage.','The signposts are "absurdly far apart". "Absurdly" conveys the writer\'s disbelief: the posts become a ruler measuring how fast the ice has vanished, and the distance makes the loss shocking.','The glacier fills "the valley\'s throat" and its surface is "the dirty white of an old bandage". The metaphor turns the valley into a body, while "bandage" connotes a wound, and "dirty" and "old" suggest the injury has been left untreated. The glacier seems hurt rather than majestic.',"Overall, paragraph 1 presents a damaged landscape in which the glacier is already wounded.","","Paragraph 2",'The glacier "ticked, dripped, sighed". The list of verbs makes it sound alive, while "ticked" suggests a clock counting down and "sighed" adds weariness, as though it knows it is dying.','The meltwater is "a constant hurried gurgle like a kettle that could never quite boil". The simile links the glacier to heat, and "hurried" and "constant" suggest melting that cannot be stopped.','The guide touches the ice like "the forehead of someone with a fever". The simile makes the glacier a sick patient, and "fever" connotes dangerous heat, linking to a warming climate.','Finally the slab "shivered, groaned, and slid" into the lake. These verbs personify it as a creature in pain, and its "roar" echoing for a long time suggests a death that cannot be undone.',"Overall, paragraph 2 develops the image of illness into the glacier's final collapse, leaving the reader with a sense of grief and loss."),tips:["Track the pattern: rubble, bandage, fever, groaned","Explain single words: absurdly, throat, sighed","Imagery is required from both paragraphs"]},{id:"q3B",set:"B",kind:"extended",paper:"p1",label:"Q3 Extended response",title:"Speech: the glacier guide",marks:25,minutes:35,words:[250,350],ref:["BC"],secs:A,format:"speech",prompt:"You are the guide in Text C. Later that week, you give a talk to a group of students at the glacier visitor centre.",bullets:["describe the walk to the glacier and what visitors can see and hear when they get there","explain what the changes to the glacier tell us","suggest what young people can do, and why it matters to them"],start:"Good afternoon, everyone, and welcome to the valley.",plan:["Bullet 1: the rubble path, the year signposts, the thin air, the ticking and dripping, the collapsing ice","Bullet 2: the posts show how quickly the ice has retreated; the lake did not exist when you were a child","Bullet 3: develop sensibly: small actions, choices, speaking up; why their generation will feel the effects","Speech voice: greet the audience, address them directly, end with a memorable line"],checks:[{t:"Bullet 1: the walk and what visitors see and hear",w:3,sec:0,k:["rubble","sign","path","tick","drip","sigh","gurgle","collapse","lake"]},{t:"Bullet 2: what the changes tell us",w:3,sec:0,k:["retreat","shrink","melt","warm","climate","faster","years","1950","lake"]},{t:"Bullet 3: what young people can do, and why it matters",w:3,sec:0,k:["you can","we can","action","choice","vote","energy","travel","speak","future","generation"]},{t:"Details from Text C used accurately",w:3,sec:0,k:["signpost","bandage","fever","slab","house","blue","milky","throat"]},{t:"Ideas developed beyond the text, but consistent with it",w:3,sec:0},{t:"Speech conventions: greeting, direct address, a clear close",w:3,sec:1,auto:"speech"},{t:"Own words, not lifted from Text C",w:2,sec:1,auto:"nolift"},{t:"Organised in clear paragraphs",w:2,sec:1,auto:"paras3"},{t:"Accurate spelling, punctuation and grammar",w:3,sec:1,auto:"accuracy"}],model:e("Good afternoon, everyone, and welcome to the valley.","","Most of you walked up here this morning, so you already know the path: grey, broken stone, mile after mile of it, with those little signposts along the way. Did you look at the dates? Every post marks where the ice once reached. When I was your age, the walk from the car park to the glacier took twenty minutes. Today it takes nearly two hours, and the air at the top is so thin and clean that you can taste the rock.","","When you finally see the glacier, you might expect silence. Instead it ticks and drips and sighs. You can hear water rushing through tunnels inside it, and at the front the ice does not end neatly; it breaks apart in blue towers that lean over a pale lake. Last week I watched a block the size of a house groan and slide into that water. I have spent my whole life on this ice, and I still could not speak.","","So what is the glacier telling us? Those posts are a timeline. The ice is not just shrinking; it is shrinking faster every decade, because the world is warming. The lake below it did not exist when I was a child. Glaciers like this one store water that towns and farms depend on in summer, so this is not only a beautiful place disappearing. It is a warning.","","You might think that nothing you do could matter to something this enormous. It does. The way you travel, the energy your homes use, what you buy and, above all, what you say to the people who make decisions all add up. You are the generation who will live with the results, so you have every right to demand change.","","When you walk back down that path today, read the signposts again. Then decide where you want the next one to stand. Thank you."),tips:["Speech conventions: greet, address the audience, close strongly","Bullet 3 needs development: link actions to the glacier","Stay consistent with Text C: no invented disasters"]},{id:"dwB",set:"B",kind:"directed",paper:"p2",label:"Section A Directed writing",title:"Article: should school start later?",marks:40,minutes:60,words:[250,350],ref:["BD1","BD2"],secs:A,format:"article",prompt:"Your school is considering starting the school day one hour later. Write an article for your school magazine giving your views.",bullets:["evaluate the views given in both texts","give your own views, based on what you have read, about whether the school day should start later"],plan:["A headline and an opening that hooks your readers (fellow students and teachers)",'Text 1: the strongest evidence, then its limits (one group of schools, other changes, problems dismissed as "organisation")','Text 2: practical problems that are real; the claim about phones is a "some studies" argument',"Your view: a clear position, perhaps a compromise drawn from both texts","A conclusion that tells readers what should happen next"],checks:[{t:"Ideas from Text 1 used and assessed",w:3,sec:0,k:["melatonin","body clock","biolog","attendance","grades","accident","anxious","motivat","8:45","hour longer"]},{t:"Ideas from Text 2 used and assessed",w:3,sec:0,k:["later finish","4:30","bus","job","sibling","brothers","sports","fixture","phone","habit","tutor"]},{t:"Evaluation: you judge how convincing each argument is, not just repeat it",w:5,sec:0,auto:"evaluate"},{t:"Your own clear view, based on the texts",w:4,sec:0,auto:"view"},{t:"Article conventions: headline, engaging opening, writes for readers of the magazine",w:5,sec:1},{t:"Clear structure with paragraphs and linking words",w:5,sec:1,auto:"connect"},{t:"Persuasive techniques used deliberately",w:5,sec:1,auto:"persuade"},{t:"Formal register with no slang",w:4,sec:1,auto:"noslang"},{t:"Accurate spelling, grammar and punctuation",w:6,sec:1,auto:"accuracy"}],tips:["Evaluate: one group of schools is not proof for every school","Both writers agree sleep matters: use that common ground","Give the article a headline"]},{id:"cdB1",set:"B",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The beach after summer",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Describe a beach at the end of summer, after the visitors have gone.",plan:["Open with emptiness: what is missing that was there in August","Details left behind: a lost flip-flop, closed kiosks, faded signs","Senses: wind, cold sand, gulls, the smell of seaweed and salt","A person or animal who remains: a dog walker, a lifeguard packing up","End with an image of the sea, which does not notice the season has changed"],wordbank:["desolate","melancholy","wistful","muffled","bleak","serene"],checks:S},{id:"cdB2",set:"B",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The waiting room at night",marks:40,minutes:60,words:[350,450],secs:I,prompt:"Describe the scene in a hospital waiting room late at night.",plan:["Light and sound first: buzzing strip lights, a machine humming, a clock","Three or four people, each shown by one telling action","Small details: a vending machine, a forgotten coffee, a child aslee
