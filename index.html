ife","notice","animal","spot","watch","observe","slow"]},{t:"The fast bridge journey means people will rush past and miss such experiences",k:["miss","lose","rush","experience","beaut","fast","quick"]}],model:"He means that the slow ferry crossing allows people to notice the natural world around them, whereas the quick bridge journey will mean they rush past and miss moments like this."},{id:"sa5",ref:"A",part:"Q1(e)",marks:2,q:"How does the final paragraph prove the grandfather's point?",points:[{t:"Dolphins appear beside the ferry when he slows down",k:["dolphin"]},{t:"The passengers look up from their phones and notice them for once",k:["phone","look+up","looked+up","notice","attention"]}],model:"When he slows the ferry, three dolphins appear, and the passengers, who had been staring at their phones, finally look up and notice them."},{id:"sa6",ref:"B",part:"Q1",marks:2,q:"Identify two drawbacks of rooftop gardens mentioned in paragraph 4 of Text B.",points:[{t:"They are heavy, so older buildings may need costly strengthening",k:["heavy","weigh","strength","structur","reinforc"]},{t:"They cost money to maintain",k:["maintain","maintenance","upkeep","looking after"]},{t:"If neglected, they can become an eyesore",k:["eyesore","ugly","neglect","messy","unattractive"]}],model:"They are heavy when soaked, so older buildings may need expensive strengthening, and they cost money to maintain."},{id:"sa7",ref:"C",part:"Q2(a)",marks:1,q:"Identify a word or phrase from paragraph 1 of Text C which suggests that the fishermen are grimly determined.",points:[{t:'"their faces set like stone"',k:["stone"]}],model:"their faces set like stone"},{id:"sa8",ref:"C",part:"Q2(b)",marks:3,q:'Using your own words, explain what the writer means by each of these words from Text C: (i) "worrying at" the tarpaulins (ii) the gusts "flung" the gulls (iii) the sea "reared".',points:[{t:"(i) pulling or tugging at again and again",k:["tug","pull","yank","pick","jerk","tear","grab","snatch"]},{t:"(ii) threw them violently or with great force",k:["threw","throw","toss","hurl","forc","push","blew","blown","sent"]},{t:"(iii) rose up high, like an animal on its back legs",k:["rose","rise","rising","lift","stood","stand","tower","surg"]}],model:"(i) repeatedly tugging and pulling at (ii) threw them violently (iii) rose up high, like an animal standing on its back legs"},{id:"sa9",ref:"C",part:"Q2(c)",marks:3,q:'Explain how the writer conveys the change in the sea in this sentence: "The sea, which an hour earlier had lapped politely at the jetty, now reared and snarled".',points:[{t:'"lapped politely": the sea was calm, gentle and well-behaved',k:["calm","gentle","polite","well behaved","peaceful","tame","quiet","soft"]},{t:'"reared and snarled": the sea is like a vicious, angry animal',k:["animal","beast","predator","dog","wolf","horse","vicious","aggress","angry","hostile","wild"]},{t:"The contrast shows how suddenly and completely it has become dangerous",k:["contrast","change","transform","juxtapos","sudden","danger","threat"]}],model:'"Lapped politely" makes the sea sound gentle and well-mannered, almost tame. By contrast, "reared and snarled" turns it into a vicious animal rising up to attack. Placing the two side by side shows how suddenly and completely the sea has become dangerous.'}],q=["Reading","Writing"],S=["Content and structure","Style and accuracy"],M=[{t:"Precise, ambitious vocabulary, with few weak words like nice, good or very",w:6,sec:1,auto:"vocab"},{t:"Varied sentence lengths and openings",w:6,sec:1,auto:"variety"},{t:"Accurate spelling",w:4,sec:1,auto:"spell"},{t:"Accurate punctuation, including speech marks and no comma splices",w:4,sec:1,auto:"punct"},{t:"Consistent tense and fluent, well-linked paragraphs",w:4,sec:1}],C=[{t:"Stays descriptive: atmosphere and detail, very little plot",w:4,sec:0},{t:"A clear structure, such as zooming in, a time shift or moving through a place",w:4,sec:0},{t:"Detail from several senses, not just sight",w:4,sec:0,auto:"senses"},{t:"A striking opening and a final image that ends it well",w:4,sec:0}].concat(M),A=[{t:"A clear story shape: opening, rising tension, climax and ending",w:4,sec:0},{t:"Believable characters, shown through actions and dialogue",w:4,sec:0,auto:"dialogue"},{t:"Tension and pace controlled, with short sentences at key moments",w:4,sec:0,auto:"short"},{t:'A satisfying ending (not "it was all a dream")',w:4,sec:0,auto:"nodream"}].concat(M),I=[{id:"sum",kind:"summary",paper:"p1",label:"Q1(f) Summary",title:"The benefits of rooftop gardens",marks:15,minutes:25,words:[80,120],ref:["B"],secs:["Reading","Writing"],prompt:"According to Text B, what are the benefits of rooftop gardens for cities and the people who live in them? You must use continuous writing (not note form) and use your own words as far as possible. Your summary should not be more than 120 words.",plan:o,points:[{t:"They make dull grey roofs and skylines more attractive",k:["attractive","appearance","beaut","look nicer","look better","prettier","pleasant to look"]},{t:"They keep buildings and city centres cooler",k:["cool","heat","temperature","warm","hot"]},{t:"People rely less on air conditioning",k:["air condition","air con","aircon","energy","electric"]},{t:"They soak up rainwater and release it slowly",k:["rain","water","storm"]},{t:"They reduce flooding and pressure on drains",k:["flood","drain","overflow"]},{t:"They give bees, butterflies and birds food and shelter",k:["bee","bird","butterfl","wildlife","insect","animal","habitat","creature","species"]},{t:"Residents can grow fresh vegetables",k:["vegetable","grow","crop","produce","fresh food","fruit","tomato"]},{t:"The food is local, not transported long distances",k:["local","travel","transport","distance","miles","kilomet"]},{t:"They bring neighbours together",k:["neighbour","neighbor","social","communit","friend","meet","together"]},{t:"They offer a calm, peaceful place to rest",k:["calm","peace","rest","relax","tranquil","quiet","escape"]},{t:"Time among plants lowers stress",k:["stress","wellbeing","well being","mental","anxi","health","mood"]}],checks:[{t:"No more than 120 words",w:1,sec:1,auto:"max"},{t:"Own words: no long phrases copied from Text B",w:1,sec:1,auto:"nolift"},{t:"Continuous sentences, not notes or bullet points",w:1,sec:1,auto:"prose"},{t:"No introduction, opinions, examples or quotations",w:1,sec:1,auto:"noopinion"},{t:"Related points grouped and linked smoothly",w:1,sec:1}],model:"Rooftop gardens cool cities because plants and soil absorb much less heat than dark roofs, so the rooms beneath need less air conditioning. They store rainwater during storms and release it gradually, reducing the risk of drains overflowing and streets flooding. They give bees, butterflies and birds driven out by concrete somewhere to feed and shelter. Some grow vegetables, providing crowded areas with fresh, locally grown food. They also benefit people socially and mentally: residents meet neighbours they previously ignored, enjoy a peaceful place to relax, and feel less stressed among plants. Finally, they make dull grey skylines more attractive.",tips:["10 marks are for points, so aim for at least 10 separate ideas","Group points: cooling, water, wildlife, food, people","Count your words before you finish"]},{id:"lang",kind:"language",paper:"p1",label:"Q2(d) Language",title:"How the writer presents the storm",marks:15,minutes:25,words:[250,450],ref:["C"],secs:["Selection","Analysis"],prompt:"Re-read paragraphs 1 and 2 of Text C. Explain how the writer uses language to convey meaning and to create effect in these paragraphs. Choose three examples of words and phrases from each paragraph to support your answer. Your choices should include the use of imagery.",plan:r.concat(["Put each choice in quotation marks so it is clear what you are analysing","Finish each paragraph with the overall impression it creates"]),checks:[{t:"Three or more quoted choices from paragraph 1",w:2,sec:0,auto:"q1"},{t:"Three or more quoted choices from paragraph 2",w:2,sec:0,auto:"q2"},{t:"Imagery included from each paragraph (simile, metaphor or personification)",w:2,sec:0,auto:"imagery"},{t:"The meaning of each choice explained in context",w:2,sec:1},{t:"Connotations of key words explored, not just whole phrases",w:3,sec:1,auto:"connot"},{t:'Precise effects, with no generic comments like "makes the reader want to read on"',w:2,sec:1,auto:"nogeneric"},{t:"The overall impression of each paragraph summed up",w:2,sec:1,auto:"overall"}],model:e("Paragraph 1",'The sky has "curdled into a bruised purple". "Curdled" suggests milk turning sour and thick, so the sky seems to be rotting, as if something has spoiled. "Bruised" connotes injury, as though the sky has already been beaten. Together they make it look sickly and hurt, warning that violence is coming.','The wind begins to "prowl" along the shoreline. This verb is used of predators hunting, so the wind is personified as a restless animal searching for prey. It makes the town seem vulnerable and builds tension.','The gulls are "pinned in place like paper cut-outs". The simile suggests they are flat, weightless and helpless, held still by the wind like decorations stuck to a wall. When they are "flung" inland, we see that even creatures of the air are powerless.',"Overall, paragraph 1 creates quiet menace: the storm has not broken yet, but everything is in the grip of something dangerous and alive.","","Paragraph 2",'The rain is "not falling but hurled". Rain usually drops gently, but "hurled" suggests deliberate, violent throwing, as if the storm is attacking the town.','It becomes "a grey wall that marched across the water". A wall is solid and impossible to see through or escape, while "marched" evokes an army advancing in formation, relentless and organised.','The sea "swallowed the lighthouse whole". A lighthouse is a symbol of safety and guidance, so having it devoured as if by a monster suggests that nothing can protect the town now.','The contrast between the sea that "lapped politely" and the sea that "reared and snarled" shows its transformation from a tame, well-mannered presence into a vicious beast, like a dog turning on its owner.',"Overall, paragraph 2 presents the storm at full strength as a monstrous, living force that overwhelms the town."),tips:["Short quotations let you zoom in on single words","Meaning first, then connotations, then effect","Imagery is required: pick at least one image from each paragraph"]},{id:"q3c",kind:"extended",paper:"p1",label:"Q3 Extended response",title:"Journal: the fisherman",marks:25,minutes:35,words:[250,350],ref:["C"],secs:q,format:"journal",prompt:"You are one of the fishermen in Text C. That night, you write a journal entry about the storm.",bullets:["what you noticed as the storm approached and how you and the other fishermen prepared","your thoughts and feelings when the storm struck the harbour","what the storm has shown you about the sea and about your town"],start:"I have worked on this beach for twenty years, but today\u2026",plan:["Bullet 1: the sky, the wind, the gulls; dragging the boats up the shingle in silence","Bullet 2: the rain, the vanishing lighthouse, the spray, the caf\xe9 lights going out; your fear","Bullet 3: develop it: what you learned about the sea, and how the town pulled together","Use details from Text C, but explain feelings the text only hints at","Journal voice: first person, honest, reflective, written that night"],checks:[{t:"Bullet 1: what you noticed and how you prepared",w:3,sec:0,k:["sky","wind","gull","boat","shingle","drag","haul","prepar"]},{t:"Bullet 2: your thoughts and feelings when the storm struck",w:3,sec:0,k:["afraid","fear","scared","terrif","shak","panic","heart","felt","feel"]},{t:"Bullet 3: what the storm has shown you about the sea and the town",w:3,sec:0,k:["learn","realis","realiz","shown","taught","remind","understand","respect"]},{t:"Details from Text C used accurately (the lighthouse, the caf\xe9, the spray)",w:3,sec:0,k:["lighthouse","caf\xe9","cafe","spray","jetty","harbour","window"]},{t:"Ideas developed beyond the text, but consistent with it",w:3,sec:0},{t:"Journal voice: first person and reflective",w:3,sec:1,auto:"firstperson"},{t:"Own words, not lifted from Text C",w:2,sec:1,auto:"nolift"},{t:"Organised in clear paragraphs",w:2,sec:1,auto:"paras3"},{t:"Accurate spelling, punctuation and grammar",w:3,sec:1,auto:"accuracy"}],model:e("I have worked on this beach for twenty years, but today I learned how little I know about the sea.","","The signs were there from the morning. By noon the sky had turned a sickly purple, the colour of an old bruise, and the wind had started creeping along the shore, tugging at every loose shutter as if it were searching for a way in. Even the gulls could not fly against it; they hung still for a moment before being tossed inland like scraps of paper. Nobody needed to give an order. Together we hauled the boats as far up the beach as our backs would allow, saving our breath and our fear for later.","","When the storm finally struck, it was worse than anything I have seen. The rain came at us sideways, a solid grey curtain that hid the lighthouse completely, and for a terrible moment I thought it had gone. The sea, which had been nudging the jetty as gently as a cat, rose up and roared, throwing spray right over the harbour wall. Somewhere glass shattered. I sheltered in the caf\xe9 with the others, and when the lights went out, nobody said a word. I am not ashamed to admit that my hands were shaking.","","Tonight the wind has dropped and I am writing by candlelight. I keep thinking about how quickly the sea changed. We talk about it as if it belongs to us, but today it reminded us that we are only its guests. And yet I also saw what this town is made of: no one went home until every boat was safe. Tomorrow we will count the damage. Tomorrow we will start again."),tips:["Give each bullet roughly equal space","Develop ideas: explain feelings and reasons the text implies","Don't invent wild new events like a shipwreck rescue"]},{id:"q3a",kind:"extended",paper:"p1",label:"Q3 Extended response",title:"Letter: the ferry skipper",marks:25,minutes:35,words:[250,350],ref:["A"],secs:q,format:"letter",prompt:"You are Amara's grandfather in Text A. After the final crossing, you write a letter to the town council.",bullets:["what the ferry and the crossing have meant to you and your passengers over the years","what happened on the crossing when the dolphins appeared, and how the passengers reacted","how the council could keep something of the ferry's value once the bridge opens"],start:"Dear Members of the Council,",plan:["Open politely and say who you are: forty-one years at the wheel","Bullet 1: what the slow crossing gives people that a bridge cannot; be fair about why the bridge is wanted","Bullet 2: slowing the engine, the three dolphins, passengers looking up from their phones, the boy","Bullet 3: develop a sensible proposal, such as weekend trips, school visits or training a new skipper",'Close formally: "Yours faithfully" when you begin "Dear Members of the Council"'],checks:[{t:"Bullet 1: what the ferry has meant to you and your passengers",w:3,sec:0,k:["years","forty","passenger","crossing","journey","evening"]},{t:"Bullet 2: the dolphins and how the passengers reacted",w:3,sec:0,k:["dolphin"]},{t:"Bullet 3: a sensible suggestion for the council",w:3,sec:0,k:["keep","save","tourist","trip","suggest","propose","instead","visit","school"]},{t:"Details from Text A used accurately (the bell, the ropes, the bridge, the boy)",w:3,sec:0,k:["bell","rope","bridge","six","boy","island","amara"]},{t:"Ideas developed beyond the text, but consistent with it",w:3,sec:0},{t:"Letter conventions: greeting, formal but heartfelt tone, sign-off",w:3,sec:1,auto:"letter"},{t:"Own words, not lifted from Text A",w:2,sec:1,auto:"nolift"},{t:"Organised in clear paragraphs",w:2,sec:1,auto:"paras3"},{t:"Accurate spelling, punctuation and grammar",w:3,sec:1,auto:"accuracy"}],model:e("Dear Members of the Council,","","For forty-one years I have taken the Marisol across to the island every evening at six. As you prepare to open the new bridge, I would like to tell you what you are about to lose.","","Of course the bridge is needed. Six minutes instead of forty is a real gift to people who are tired and want to reach home, and nobody should blame them for being relieved. But the crossing has never been just a journey. I have watched children see the sea for the first time and strangers become friends because there was nothing to do but talk. On the ferry, people slow down. On a bridge, they never will.","","On our final crossing I slowed the engine halfway across. There was no explanation; there was only hope. And there they were: three dolphins rising beside us in the silver water, breathing once and disappearing. Every passenger looked up from their phone. Nobody spoke. A small boy who had asked me earlier whether I was sad pressed his face to the rail, and I knew he would remember that moment long after he had forgotten the bridge.","","So I ask you not to send the Marisol for scrap. Keep her for weekend trips and school visits, for anyone who wants to see the bay slowly. I would gladly train a younger skipper, perhaps my granddaughter, who knows these waters almost as well as I do, and the ticket money could pay for her upkeep.","","I have checked her ropes every evening for forty-one years. Let me check them a little longer.","","Yours faithfully,","The skipper of the Marisol"),tips:["Match the register to your reader: polite and formal for a council","Use the text's details, then build on them","The third bullet invites you to develop ideas sensibly"]},{id:"dw1",kind:"directed",paper:"p2",label:"Section A Directed writing",title:"Speech: should phones be banned?",marks:40,minutes:60,words:[250,350],ref:["D1","D2"],secs:q,format:"speech",prompt:"Your headteacher is considering a complete ban on mobile phones during the school day. You have been asked to give a speech to students and teachers in a school assembly.",bullets:["evaluate the views expressed in both texts","give your own views, based on what you have read, about whether phones should be banned"],start:"Good morning, everyone.",plan:["Hook: involve the audience straight away (a question or a show of hands)","State your view clearly in the first paragraph","Text 1: its strongest point, then a weakness (one school's survey, no evidence, ignores hiding)","Text 2: why it is more or less convincing (it admits the problems, offers alternatives)","Your proposal, built from both texts",'A memorable ending and "Thank you"'],checks:[{t:"Ideas from Text 1 used and assessed",w:3,sec:0,k:["seven in ten","survey","relief","emergenc","textbook","notification","bully","playground","concentrat","attention"]},{t:"Ideas from Text 2 used and assessed",w:3,sec:0,k:["hid","tool","experiment","translat","photograph","responsib","switch off","manage","screen"]},{t:"Evaluation: you judge how convincing each argument is, not just repeat it",w:5,sec:0,auto:"evaluate"},{t:"Your own clear view, based on the texts",w:4,sec:0,auto:"view"},{t:"Speech conventions: greeting, direct address and a clear close",w:5,sec:1,auto:"speech"},{t:"Clear structure with paragraphs and linking words",w:5,sec:1,auto:"connect"},{t:"Persuasive techniques used deliberately",w:5,sec:1,auto:"persuade"},{t:"Formal register with no slang",w:4,sec:1,auto:"noslang"},{t:"Accurate spelling, grammar and punctuation",w:6,sec:1,auto:"accuracy"}],model:e("Good morning, everyone.","","Raise your hand if your phone has buzzed since you walked into this hall. Now keep it up if you checked it. Exactly. Our headteacher is considering a complete ban on phones during the school day, and I want to explain why a total ban would be a mistake, but why doing nothing would be a mistake too.","",'The writer of the first article makes powerful points. Anyone who has watched a lesson fall apart because of one notification knows the problem is real, and the idea of "seven hours of relief" from group chats and midnight comments is genuinely moving. Online bullying does follow students everywhere.',"",'However, the evidence is weaker than it sounds. The survey comes from a single school, and glancing at a phone is not the same as losing a whole lesson. The writer claims parents "managed perfectly well" without smartphones but offers no proof. Above all, the article ignores the obvious problem: phones will simply be hidden.',"","The second writer, a teacher, tackles that problem head on, and I find this far more convincing. Bans, they argue, teach us nothing; they simply hide the problem instead of solving it. Crucially, they admit that phones distract and that cyberbullying is real before explaining why school is exactly where we should learn to handle both.","","So what do I propose? Not a free-for-all, and not a total ban. Phones should be silent and out of sight in lessons unless a teacher asks for them. Lunchtimes could have phone-free zones. And every year group should be taught how to manage notifications and behave kindly towards each other online.","","We will spend our whole lives surrounded by screens. Let us use our time here to learn to control them, rather than pretending they do not exist.","","Thank you."),tips:["Evaluate: is the evidence strong? Is anything ignored or exaggerated?","You can agree with one text, or take a middle view",'Avoid slang like "gonna" and "kinda"']},{id:"dw2",kind:"directed",paper:"p2",label:"Section A Directed writing",title:"Letter: to your headteacher",marks:40,minutes:60,words:[250,350],ref:["D1","D2"],secs:q,format:"letter",prompt:"Your headteacher has asked students for their views on banning mobile phones during the school day. Write a letter to your headteacher.",bullets:["evaluate the ideas in both texts","explain what you think the school should do, based on what you have read"],start:"Dear Mrs Okafor,",plan:["Say why you are writing and give your view in the first paragraph","Use the strongest evidence from the text you agree with","Concede: accept the fair points of the other text, then explain why they are less convincing","Make practical suggestions that answer both writers' concerns",'Polite, formal close: "Yours sincerely" when you use the head\'s name'],checks:[{t:"Ideas from Text 1 used and assessed",w:3,sec:0,k:["seven in ten","survey","relief","emergenc","textbook","notification","bully","playground","concentrat","thirty heads"]},{t:"Ideas from Text 2 used and assessed",w:3,sec:0,k:["hid","tool","experiment","translat","photograph","responsib","switch off","manage","screen"]},{t:"Evaluation: you judge how convincing each argument is, not just repeat it",w:5,sec:0,auto:"evaluate"},{t:"Your own clear view, based on the texts",w:4,sec:0,auto:"view"},{t:"Letter conventions: greeting, purpose, formal sign-off",w:5,sec:1,auto:"letter"},{t:"Clear structure with paragraphs and linking words",w:5,sec:1,auto:"connect"},{t:"Reasoned, persuasive tone that stays polite",w:5,sec:1},{t:"Formal register with no slang",w:4,sec:1,auto:"noslang"},{t:"Accurate spelling, grammar and punctuation",w:6,sec:1,auto:"accuracy"}],model:e("Dear Mrs Okafor,","","I am writing about your proposal to ban mobile phones during the school day. Having read arguments on both sides, I believe a ban is the right decision, although it will only work if it is introduced carefully.","",'The case for a ban is stronger than many students would like to admit. The first article describes how a single buzz can make "thirty heads turn", and anyone who sits in our lessons knows this is no exaggeration. More importantly, the writer points out that phones let playground conflicts follow us everywhere. Group chats that exclude people and photographs shared without permission are real problems here; seven hours away from them each day would give many students genuine relief. Is that not worth a little inconvenience?',"","I accept that the second writer raises fair points. Phones can be useful for recording experiments or translating texts, and families do worry about emergencies. However, these arguments are less convincing than they first appear. The school office has a telephone, and teachers could book tablets for lessons that need them. The claim that students will simply hide their phones is a reason to enforce a ban properly, not a reason to avoid one.","","Where I agree with the second writer is that we need to learn to use technology responsibly. A ban during school hours does not prevent this. I would suggest that phones are handed in at registration and returned at the end of the day, and that tutor time includes lessons on managing notifications and behaving kindly online.","","I hope you will consider these suggestions, and I would be happy to discuss them with the student council.","","Yours sincerely,","A Year 11 student"),tips:['Concede, then counter: "I accept that\u2026 However\u2026"',"Practical suggestions show you have weighed both texts",'Formal letter: no contractions like "don\'t" in the body']},{id:"cd1",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The market at closing time",marks:40,minutes:60,words:[350,450],secs:S,prompt:"Describe a busy market as it closes at the end of the day.",plan:["Wide shot: the market at its loudest; colours, crowds, smells","Close-ups: one stall, one trader's hands, one detail nobody notices","Change: the light shifts; sounds begin to fade; shutters come down","Pull back: the empty lane and a final image that echoes the opening"],wordbank:["cacophony","vibrant","meander","hushed","melancholy","desolate"],checks:C,model:e("At four o'clock, the market is still roaring. Awnings of faded red and orange stretch over the narrow lane like the sails of stranded ships, and beneath them the air is thick with frying garlic, ripe mangoes and diesel. Traders bellow prices over one another until the words dissolve into a single cacophony, rising and falling like surf.","","Look closer. At the spice stall, a woman scoops turmeric into paper cones, her fingertips stained a permanent gold. Pyramids of chillies glow beside sacks of cardamom so fragrant that passers-by slow down without knowing why. Across the lane, the fishmonger's ice has begun to sweat; silver bodies lie in rows, their eyes clouding, and he sluices the counter with a bucket of water that runs grey into the gutter.","","By five, the light has changed. The sun slides behind the clock tower and shadows stretch across the cobbles, cool and blue. Voices drop. Someone laughs, tired and content, and a radio behind the noodle stall crackles out an old love song that nobody is listening to. The first metal shutter rattles down with a clatter that echoes off the walls, then another, and another, until the lane sounds like a giant drawing breath through its teeth.","","The fruit seller is the last to pack away. He works slowly, as if reluctant to let the day go, and wraps each unsold papaya in newspaper as tenderly as if it were a sleeping child. Bruised tomatoes are left in a crate by the drain, where a thin cat appears, sniffs, and moves on, unimpressed. Pigeons strut between the empty stalls with the confidence of new owners.","","Now the awnings are folded and the lane seems far too wide, a long grey corridor littered with cabbage leaves and flattened cardboard. A single bulb buzzes above the locked spice stall, and moths gather around it like late customers hoping for a bargain. The smells linger after their owners have gone: a ghost of garlic, a memory of ginger, the sweetness of fruit beginning to turn.","","Tomorrow, before dawn, the shutters will rise and the roar will return. For now the market sleeps, and the only sound is the patient drip of melting ice, counting the seconds until morning.")},{id:"cd2",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The abandoned cinema",marks:40,minutes:60,words:[350,450],secs:S,prompt:"Describe a place that has been abandoned for many years.",plan:["Entrance: how the outside world gets in (wind, light, weeds)","Move through the space room by room, like a camera","Details that show the past: objects left behind, signs of the people who were here","The silence: what you hear instead of what used to be there","End with a final image, or a moment where the past almost returns"],wordbank:["dilapidated","eerie","muffled","reverberate","desolate","translucent"],checks:C,model:e("The doors of the Regal Cinema have not opened for thirty years, but the wind has found its own way in. It slips through a broken pane above the entrance and wanders the foyer, stirring drifts of dust that rise and settle like slow grey snow.","","Light enters in thin blades between the boarded windows. It falls across the ticket counter, where a brass bell sits beside a faded poster of a film nobody remembers, the heroine's smile peeling away in long curls. The carpet, once a deep and confident crimson, has bleached to the colour of weak tea. Each step releases a soft, damp breath of mould, and somewhere beneath it a floorboard sighs.","","Beyond the swing doors, the auditorium waits in near darkness. Rows of velvet seats slope towards the screen like the steps of a ruined amphitheatre. Some have collapsed; others still hold their shape, their arms worn smooth by thousands of elbows, as if the audience left a moment ago. In the front row a single seat is folded down, as though someone is still waiting for the film to begin. The screen hangs in tatters, a huge pale sail torn by damp, and behind it pigeons have built an untidy kingdom of twigs and feathers. When one shifts, the beat of its wings echoes around the cavernous room like sudden applause.","","It is the silence that is hardest to bear. In a room built for gasps and laughter, there is only one sound left: the tick of water dripping from the ceiling into a rusted bucket that someone placed there long ago and never came back to empty. The air smells of wet plaster and old popcorn oil, a sour sweetness that clings to the back of the throat.","","High at the back, the projection window is still intact. Through it, dust drifts in a beam of sunlight like a film waiting to be shown. For a moment it is almost possible to believe the projector will flicker into life, that music will swell and the darkness will fill with faces turned upwards, lit silver and gold.","","Then a cloud passes over the sun. The beam fades. The Regal returns to its long, patient sleep, and the wind, bored, slips back out through the broken pane.")},{id:"cd3",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The station: dawn and rush hour",marks:40,minutes:60,words:[350,450],secs:S,prompt:"Describe a railway station early in the morning, before it gets busy, and then later when it is crowded.",plan:["Dawn: emptiness, cold, small sounds that carry, one or two people","A one-line paragraph to mark the time shift","Rush hour: the same details transformed (the same kiosk, the same pigeons)","Contrast senses: quiet against noise, fresh smells against crowded ones","End by returning to a detail from the opening"],wordbank:["tranquil","hushed","clamour","scurry","lurch","luminous"],checks:C,model:e("At half past five, the station belongs to the pigeons. They patrol the empty platform in twos and threes, heads bobbing, inspecting the yellow line as if it were their own invention. The departure board flickers green in the gloom, its letters clicking over one by one with nobody to read them.","","The air is cold enough to sting. It smells of metal and damp concrete, with a faint, warm hint of bread from the kiosk, where the shutter is half raised and a young man yawns as he lines up paper cups in perfect rows. Under the roof a loose sheet of plastic flaps and settles, flaps and settles, like a slow heartbeat. Otherwise there is nothing: no footsteps, no voices, no trains.","","A cleaner moves along the platform with a wide broom, pushing a small wave of crisp packets ahead of her. She hums an old tune, and the sound carries much further than it should across the hushed tracks. Beyond the glass canopy the sky is turning from ink to pale lilac, and the rails gleam like two silver threads running into the morning.","","By eight o'clock, the station is unrecognisable.","","The pigeons have retreated to the girders; below them, a tide of commuters surges through the barriers: suits and school uniforms, headphones and briefcases, a toddler perched on her father's shoulders like a queen surveying her kingdom. Footsteps drum on the stairs. The announcements, which earlier echoed politely into silence, now compete with a hundred conversations and the shriek of brakes as a train slides in, already full, its windows fogged with breath.","","The kiosk has become a battleground. The young man, wide awake now, slams coffee after coffee onto the counter while the queue snakes back past the timetable. The smell of bread has been swallowed by perfume, warm rubber and the sharp tang of the city waking up.","","The doors open. Bodies pour out and bodies pour in, and for a few seconds the platform empties as quickly as it filled. Then the whistle blows, the train pulls away, and a single pigeon drops from the girders to inspect the yellow line again, as if nothing has happened at all.")},{id:"cd4",kind:"comp",type:"desc",paper:"p2",label:"Section B Descriptive",title:"The family gathering",marks:40,minutes:60,words:[350,450],secs:S,prompt:"Describe a family gathering, focusing on the people and the atmosphere.",plan:["Choose one room as your stage and anchor it with a central figure","Describe three or four people through one telling action each","Use sound and smell to build warmth","Include a quieter moment or a detail that hints at the past","End as the gathering winds down, with a final image"],wordbank:["vibrant","resonant","wistful","serene","meticulous","cacophony"],checks:C,model:e("The kitchen is the beating heart of my grandmother's house, and on the first Sunday of the holidays it is working overtime.","","Steam rises from three pots at once, fogging the window above the sink so that the garden becomes a soft green blur. The air is heavy with cumin, frying onions and the scorched sweetness of something left in the oven a minute too long. Nobody minds; my grandmother stands at the centre of it all, small and unhurried, stirring with a wooden spoon worn pale at the edges and giving instructions in a voice so quiet that everyone has to lean in to hear.","","Around her, the family orbits. My uncle, enormous and cheerful, has been trusted with the tomatoes and chops them with the solemn concentration of a surgeon. Two of my aunts argue happily about whose turn it was to bring dessert, their bangles chiming like tiny bells. Under the table, the youngest cousins have built a fort from chair legs and a tablecloth, and every so often a small hand reaches up to steal an olive.","","In the living room, the television murmurs to itself, ignored. My grandfather has fallen asleep in his armchair with a newspaper tented over his chest, rising and falling with each gentle snore. On the mantelpiece, photographs in mismatched frames watch over us: weddings, graduations, a black-and-white couple squinting into the sun on a beach decades ago. Some of those faces are at the table today. Some are not, but somehow they are here too.","","When the food arrives, the noise doubles. Plates clatter, chairs scrape and three conversations collide in the middle of the table. Rice is passed from hand to hand like a precious parcel. Someone knocks over a glass, and the laughter is so loud that my grandfather wakes with a start and asks if he has missed anything.","","Later, when the dishes are stacked and the light has turned golden, the house grows quiet. Cousins sprawl across the carpet, too full to move, and someone starts a sleepy argument about a board game. My grandmother sits at last, hands folded, watching us with the calm satisfaction of someone who has gathered everything she loves into one warm, crowded room.")},{id:"cn1",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The Key",marks:40,minutes:60,words:[350,450],secs:S,prompt:'Write a story with the title "The Key".',plan:["Opening: the key arrives with a mystery attached","Rising action: failed attempts; a hint that someone knows more","Turning point: a character recognises it","Climax: the door opens and reveals something that changes how a character sees the past","Ending: a quiet final image rather than a big explanation"],wordbank:["apprehensive","gnarled","wistful","foreboding","resonant","hushed"],checks:A,model:e("The key arrived on a Tuesday, in an envelope with no stamp and no name, just our address in shaky blue ink.","","It was old and heavy, black iron longer than my hand, its teeth worn smooth. A paper tag hung from it on faded string. On the tag, someone had written a single word: Remember.","",'"Junk," said Mum, but she turned it over twice before handing it back, and I saw her jaw tighten.',"","For a week I carried it everywhere. I tried it in every lock I could find: the shed, the garage, the tin box under Mum's bed where she kept papers she never let me read. Nothing fitted. At night it lay on my bedside table, catching the street light, while I wondered whose hand had written that word.","","It was Gran who recognised it. We were visiting her at the care home and I was turning the key between my fingers. She stopped mid-sentence. Her eyes, which these days drifted like boats without anchors, found mine and held them.","",'"Where did you get that?" she whispered. "That opens the blue house on Harbour Lane. Your grandfather\'s workshop."',"","Mum went still. My grandfather had walked out when she was a baby. That was all anyone ever said about him, and they rarely said it.","","On Saturday we drove to Harbour Lane in silence. The house was squeezed between a launderette and a phone shop, its paint faded to the colour of a winter sky. The key turned stiffly, resisted, then gave.","","Dust lay over everything like a sheet. Beneath it were shelves of tiny wooden boats, hundreds of them, each carved and painted by hand, each with a name on its side. Every name was Mum's.","","On the workbench, beside a half-finished hull, lay a letter addressed to her, sealed and never sent. She read it standing in the doorway. When she finally looked up, her eyes were wet.","",'"He didn\'t leave because of me," she said. "He was ill. He was trying to come back."',"","We never found out who posted the key. But that evening Mum placed the smallest boat on our kitchen windowsill, where the light could find it.")},{id:"cn2",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The light in the window",marks:40,minutes:60,words:[350,450],secs:S,prompt:'Write a story that begins: "Nobody else had noticed the light in the window."',plan:["Use the given opening exactly, then establish why the light is strange","Build curiosity over several days; raise the stakes with a deadline","Climax: the narrator investigates alone; slow the moment down","Reveal a human, believable explanation","Resolve with action and end on an image that echoes the light"],wordbank:["ominous","reverberate","apprehensive","dilapidated","muffled","resilient"],checks:A,model:e("Nobody else had noticed the light in the window.","","Every evening the number 12 bus crawled past Carlton Tower, and every evening I pressed my forehead to the glass and counted the floors. Fourteen storeys of dark windows, boarded and blind. The council had emptied the building in the spring. A yellow sign on the fence announced the demolition date in letters a metre high: Monday.","","But on the eleventh floor, third window from the left, a small orange light was glowing.","","On Thursday it was there again. On Friday it flickered, as if someone had walked in front of it. I looked around the bus. Nobody else had seen.","","On Saturday I stepped off the bus two stops early.","","The fence had a gap where the wire had been peeled back. My heart was hammering so hard I could feel it in my throat. The stairwell smelled of damp and pigeons, and every step echoed upwards into the dark. By the eleventh floor I could hear music: an old song, crackling, the kind my grandmother used to hum.","","The door of flat 114 was open a crack.","",'"Hello?" My voice came out smaller than I meant it to.',"","The music stopped. Footsteps shuffled. The door swung open, and an elderly man in a cardigan peered at me over his glasses.","",'"You\'re not from the council," he said.',"","His name was Mr Adeyemi, and he had lived in flat 114 for forty years. His late wife had planted the balcony garden in their first summer: geraniums, tomatoes, a lemon tree in a cracked blue pot. He had moved to his new flat across town, but he could not carry the plants, so every evening he came back to water them, sitting with a lamp and the radio until dark.","",'"They knock it down on Monday," I said.',"",'He looked at the lemon tree. "I know."',"","On Sunday I came back with my brother, my cousin and three borrowed shopping trolleys. It took us six trips and the whole afternoon.","","Now, when the number 12 passes the empty space where Carlton Tower stood, I look across the river instead. On the fourth floor of a newer building, a small orange light glows among the leaves.")},{id:"cn3",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The misunderstanding",marks:40,minutes:60,words:[350,450],secs:S,prompt:"Write a story in which a misunderstanding has serious consequences.",plan:["Set up the misunderstanding early so the reader sees it before the narrator does","Make the consequences real: danger, cost or harm, not a quick laugh","Slow the climax down with short sentences and physical detail","Show how the narrator gets out of it through their own actions","End with what the narrator has learned, shown in one final image"],wordbank:["apprehensive","plummet","hurtle","stagger","impetuous","despondent"],checks:A,model:e("The lifeguard was waving at me. I was sure of it.","","It was the last afternoon of our holiday and the beach was almost empty. Mum was dozing under the umbrella, my little sister Noor was burying her own feet, and I was waist-deep in water so clear I could see my toes. Beyond the rocks, the waves were bigger, glassy and green. That was where I wanted to be.","","On the tall white chair, the lifeguard stood up. She lifted both arms above her head and swept them from side to side.","","I grinned, waved back, and swam towards the rocks.","","At first it was easy. Too easy. The water carried me as if it wanted me out there too, and in a minute I was further out than I had meant to go in five. When I turned, the umbrella was a tiny red dot. I started to swim back.","","I did not move.","","I kicked harder. My arms churned. The beach stayed exactly where it was, then slowly slid further away. The water around me was strangely smooth, a dark channel between the breaking waves, pulling me out like a conveyor belt.","","Panic arrived all at once. Salt filled my mouth. I could hear my own breathing, ragged and loud, and nothing else. My legs were turning to stone.","","Swim sideways. The words surfaced from somewhere: a poster in the changing room, an assembly I had barely listened to. Don't fight it. Swim along the beach.","","So I turned. Stroke after stroke, parallel to the shore; then a wave lifted me and pushed me forward instead of back. Was it working?","","The lifeguard reached me as my knees scraped sand. She dragged me into the shallows, gasping, a long red cut down her shin where the rocks had caught her.","",'"I was waving," she panted, "to tell you to come back."',"","I looked at her leg, at the blood threading into the foam, at Mum sprinting down the beach with Noor in her arms, and I could not say anything at all.","","Nobody shouted at me. That was the worst part. Mum just held me so tightly that I could feel her shaking.","","Now, whenever someone waves at me from a distance, I stop. I look. And I make sure I understand.")},{id:"cn4",kind:"comp",type:"narr",paper:"p2",label:"Section B Narrative",title:"The journey that went wrong",marks:40,minutes:60,words:[350,450],secs:S,prompt:"Write a story about a journey that does not go to plan.",plan:["Open with the plan, so the reader knows what should happen","The moment it goes wrong: make it the narrator's own fault","Raise the stakes: no phone, no help, time running out","A turning point: help arrives, or the narrator solves it","End with a change in the narrator, tied back to the opening plan"],wordbank:["apprehensive","meander","desolate","lurch","elated","nonchalant"],checks:A,model:e("The plan was simple: the 8:14 train to the city, the museum by ten, lunch on the steps and home by four. Ms Rahman had written it on the board in green pen and made us copy it into our planners. I had copied it. I had not read it.","","Which is why, at half past ten, I woke in an empty carriage with my cheek stuck to the window and no idea where I was.","","Outside, instead of the grey towers of the city, there was a tiny station with a single bench, a hanging basket of drooping flowers and, beyond the fence, the sea.","","Stumbling onto the platform, I heard the doors hiss shut behind me. The train slid away. The sign above the bench said Port Ellin. I had never heard of it.","","My phone was dead. Of course it was. I had spent the journey playing games instead of listening to Josh explain, for the third time, which stop we needed.","","For a moment I just stood there while a gull screamed at me from the roof. My stomach felt hollow. Somewhere in the city, thirty students were filing into a museum, and one empty seat was about to be noticed. Ms Rahman's face swam into my mind: pale, then crimson.","","The ticket office was closed. The next train back was at 1:40. Down the hill I went, into the town, past a bakery that smelled of warm sugar, until I found a caf\xe9 with a handwritten sign: Phone charging, ask inside.","","The woman behind the counter took one look at me and put the kettle on. While my phone charged, she rang the school, then the museum, then my mum, speaking so calmly that it seemed lost teenagers arrived in her caf\xe9 every week. Perhaps they did.","",'When Ms Rahman finally called, she did not shout. She let out a long breath that crackled down the line and said, "Stay exactly where you are."',"","So I did, settling by the window with a hot chocolate and a slice of lemon cake the woman refused to let me pay for, watching fishing boats nod in the harbour. Something strange had happened; I was not frightened any more.","","I never saw the museum. But I still keep the caf\xe9's receipt folded inside my planner, next to the plan I didn't read.")}],E='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"',W={heart:'<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',bolt:'<svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>',flame:'<svg viewBox="0 0 24 24"><path d="M12.5 2c.9 3.3-1.4 4.9-1.4 7.3 0 1.3 1 2.4 2.2 2.4 1.5 0 2.3-1.2 2.1-2.9 2.3 1.6 3.8 4.2 3.8 7C19.2 19.9 16.1 23 12 23s-7.2-3.1-7.2-6.9C4.8 10.9 10.8 8.4 12.5 2z"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linec
